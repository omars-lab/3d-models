<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Gallery - Islamic Cookie Cutters</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            font-weight: 300;
            opacity: 0.9;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .model-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            position: relative;
        }

        .model-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .model-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(45deg, #f0f2f5, #e8ecf0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .model-image img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .model-card:hover .model-image img {
            transform: scale(1.05);
        }

        .model-content {
            padding: 1.5rem;
        }

        .model-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 0.5rem;
        }

        .model-description {
            color: #718096;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .model-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .code-link {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .code-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stl-link {
            background: #48bb78;
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .stl-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: white;
            font-size: 1.2rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer {
            text-align: center;
            margin-top: 4rem;
            color: white;
            opacity: 0.8;
        }

        .footer a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .gallery {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            
            .model-actions {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>3D Model Gallery</h1>
            <p>Beautiful Islamic-inspired cookie cutters designed with OpenSCAD</p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            Loading gallery...
        </div>

        <div id="gallery" class="gallery" style="display: none;">
            <!-- Gallery items will be populated by JavaScript -->
        </div>

        <div class="footer">
            <p>Created with ❤️ using OpenSCAD | <a href="https://github.com/omars-lab/3d-models" target="_blank">View on GitHub</a></p>
        </div>
    </div>

    <script>
        // Model data
        var data = [
          {
            name: "Arabesque",
            image: "build/images/Arabesque.png",
            code: "https://raw.githubusercontent.com/omars-lab/3d-models/refs/heads/master/src/CookieCutters/Arabesque.scad",
            description: "Intricate Islamic geometric pattern featuring eight-fold symmetry with outer stars and complex arabesque designs."
          },
          {
            name: "Circle",
            image: "build/images/Circle.png", 
            code: "https://raw.githubusercontent.com/omars-lab/3d-models/refs/heads/master/src/CookieCutters/Circle.scad",
            description: "Simple yet elegant circular cookie cutter design."
          },
          {
            name: "Crescent with Star",
            image: "build/images/CrescentWithStar.png",
            code: "https://raw.githubusercontent.com/omars-lab/3d-models/refs/heads/master/src/CookieCutters/CrescentWithStar.scad", 
            description: "Classic Islamic symbol featuring a crescent moon with a star, perfect for Eid celebrations."
          },
          {
            name: "Eight Point Star",
            image: "build/images/EightPointStar.png",
            code: "https://raw.githubusercontent.com/omars-lab/3d-models/refs/heads/master/src/CookieCutters/EightPointStar.scad",
            description: "Beautiful eight-pointed star design with geometric precision, inspired by traditional Islamic art."
          },
          {
            name: "Lantern 1",
            image: "build/images/Lantern1.png",
            code: "https://raw.githubusercontent.com/omars-lab/3d-models/refs/heads/master/src/CookieCutters/Lantern1.scad",
            description: "Traditional Middle Eastern lantern design with arched openings and decorative elements."
          },
          {
            name: "Lantern 2", 
            image: "build/images/Lantern2.png",
            code: "https://raw.githubusercontent.com/omars-lab/3d-models/refs/heads/master/src/CookieCutters/Lantern2.scad",
            description: "Alternative lantern design with unique geometric patterns and architectural features."
          },
          {
            name: "Lantern 3",
            image: "build/images/Lantern3.png", 
            code: "https://raw.githubusercontent.com/omars-lab/3d-models/refs/heads/master/src/CookieCutters/Lantern3.scad",
            description: "Third variation of the lantern series, showcasing different proportions and decorative styles."
          },
          {
            name: "Minaret",
            image: "build/images/Minaret.png",
            code: "https://raw.githubusercontent.com/omars-lab/3d-models/refs/heads/master/src/CookieCutters/Minaret.scad",
            description: "Architectural minaret design representing the iconic tower of Islamic mosques."
          },
          {
            name: "Mosque 1",
            image: "build/images/Mosque1.png",
            code: "https://raw.githubusercontent.com/omars-lab/3d-models/refs/heads/master/src/CookieCutters/Mosque1.scad", 
            description: "First mosque design featuring traditional Islamic architecture with dome and minaret elements."
          },
          {
            name: "Mosque 2",
            image: "build/images/Mosque2.png",
            code: "https://raw.githubusercontent.com/omars-lab/3d-models/refs/heads/master/src/CookieCutters/Mosque2.scad",
            description: "Second mosque variation with different architectural proportions and decorative details."
          }
        ];
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const gallery = document.getElementById('gallery');
            const loading = document.getElementById('loading');
            
            // Hide loading and show gallery
            setTimeout(() => {
                loading.style.display = 'none';
                gallery.style.display = 'grid';
                
                // Populate gallery
                data.forEach((model, index) => {
                    const modelCard = createModelCard(model, index);
                    gallery.appendChild(modelCard);
                });
            }, 1000);
        });

        function createModelCard(model, index) {
            const card = document.createElement('div');
            card.className = 'model-card fade-in';
            card.style.animationDelay = `${index * 0.1}s`;
            
            const stlPath = model.code.replace('src/CookieCutters/', 'build/stls/').replace('.scad', '.stl');
            
            card.innerHTML = `
                <div class="model-image">
                    <img src="${model.image}" alt="${model.name}" loading="lazy">
                </div>
                <div class="model-content">
                    <h3 class="model-name">${model.name}</h3>
                    <p class="model-description">${model.description}</p>
                    <div class="model-actions">
                        <a href="${model.code}" class="code-link" target="_blank">
                            <i class="fas fa-code"></i>
                            View Code
                        </a>
                        <a href="${stlPath}" class="stl-link" target="_blank">
                            <i class="fas fa-download"></i>
                            Download STL
                        </a>
                    </div>
                </div>
            `;
            
            return card;
        }
    </script>
</body>
</html>
