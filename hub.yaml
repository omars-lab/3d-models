# How this repo shows on the local launcher (~/Workspace/git/hubs). Phase 1: today's ports.
# Check it with `uv run ~/Workspace/git/hubs/launcher/check.py --repo .`

runners:
  - id: 3d-models
    port: 8613
    health: /
    start: make site              # also opens a browser tab; gains --bind 127.0.0.1 in Phase 2
    host_name: 3d-models

# Every page below is served by the same `make site` and published by the same `make deploy`.
hubs:
  - id: 3d-models
    name: 3D models
    description: Cookie-cutter gallery, Studio, Orb Lab, Lego Lab, prints register.
    visibility: public
    use: published
    fallback: local
    local: { runner: 3d-models }
    published:
      url: https://blog.bytesofpurpose.com/3d-models/
      host: github-pages
      deploy: make deploy

  - id: 3d-models-coaster
    name: Coaster Lab
    description: Size a rosette coaster for your printer; the checks say what will print and why.
    visibility: public
    use: published
    fallback: local
    local: { runner: 3d-models, path: /coaster.html }
    published:
      url: https://blog.bytesofpurpose.com/3d-models/coaster.html
      host: github-pages
      deploy: make deploy

  - id: 3d-models-studio
