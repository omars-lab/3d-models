  - { id: beige,           hex: "#F7E6DE", name: "Beige",           line: "PLA Basic", code: "10201" }
  - { id: gold,            hex: "#E4BD68", name: "Gold",            line: "PLA Basic", code: "10401" }
  - { id: bronze,          hex: "#847D48", name: "Bronze",          line: "PLA Basic", code: "10801" }
  - { id: cocoa-brown,     hex: "#6F5034", name: "Cocoa Brown",     line: "PLA Basic", code: "10802" }
  - { id: cobalt-blue,     hex: "#0056B8", name: "Cobalt Blue",     line: "PLA Basic", code: "10604" }
  - { id: turquoise,       hex: "#00B1B7", name: "Turquoise",       line: "PLA Basic", code: "10605" }
  - { id: mistletoe-green, hex: "#3F8E43", name: "Mistletoe Green", line: "PLA Basic", code: "10502" }
  - { id: maroon-red,      hex: "#9D2235", name: "Maroon Red",      line: "PLA Basic", code: "10205" }
  - { id: light-gray,      hex: "#D1D3D5", name: "Light Gray",      line: "PLA Basic", code: "10104" }
  - { id: ivory-white,     hex: "#FFFFFF", name: "Ivory White",     line: "PLA Matte", code: "11100" }
  - { id: bone-white,      hex: "#CBC6B8", name: "Bone White",      line: "PLA Matte", code: "11103" }
  - { id: desert-tan,      hex: "#E8DBB7", name: "Desert Tan",      line: "PLA Matte", code: "11401" }
  - { id: latte-brown,     hex: "#D3B7A7", name: "Latte Brown",     line: "PLA Matte", code: "11800" }
  - { id: caramel,         hex: "#AE835B", name: "Caramel",         line: "PLA Matte", code: "11803" }
  - { id: dark-brown,      hex: "#7D6556", name: "Dark Brown",      line: "PLA Matte", code: "11801" }
  - { id: dark-chocolate,  hex: "#4D3324", name: "Dark Chocolate",  line: "PLA Matte", code: "11802" }
