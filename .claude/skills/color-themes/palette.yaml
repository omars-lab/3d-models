# The colors a theme may use. Real filament only.
#
# owned: the four trays the printer reported on 2026-10-04 (`bambu filament --json`). A tray is a
#   fact about the printer on that day. When the trays change, re-read them and edit this list.
#   The color is what prints; the name is only a label.
# buy:   Bambu filaments that are not loaded. Each hex is copied from
#   docs/research/2026-10-04-bambu-pla-color-hexes.md (Bambu Studio's own color list), and
#   `themes.py --self-test` fails when a hex here differs from that file's row for the same code.
#   A color with no row there may not go on this list.
#
# Each color has an id, which is what a theme names. A theme never writes a hex of its own.

owned_read: "2026-10-04, `bambu filament --json`"

owned:
  - { id: pink,  hex: "#F5547C", name: "Hot Pink",     note: "same hex as PLA Basic Hot Pink" }
  - { id: blue,  hex: "#0047BB", name: "Blue",         note: "no PLA Basic or Matte row has this hex" }
  - { id: black, hex: "#000000", name: "Black",        note: "same hex as PLA Basic Black and PLA Matte Charcoal" }
  - { id: green, hex: "#00AE42", name: "Bambu Green",  note: "same hex as PLA Basic Bambu Green" }

buy:
  - { id: jade-white,      hex: "#FFFFFF", name: "Jade White",      line: "PLA Basic", code: "10100" }
  - { id: beige,           hex: "#F7E6DE", name: "Beige",           line: "PLA Basic", code: "10201" }
