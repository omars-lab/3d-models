# The colors a theme may use. Real filament only.
#
# owned: the four trays the printer reported on 2026-10-04 (`bambu filament --json`). A tray is a
#   fact about the printer on that day. When the trays change, re-read them and edit this list.
#   The color is what prints; the name is only a label.
# buy:   Bambu filaments that are not loaded. Each one is copied from the color catalog,
#   docs/design/coaster/themes/catalog/catalog.yaml (Bambu Studio's own color list, built by
#   `catalog.py build`), and `themes.py --self-test` fails when a code is not in it, or the
#   name, line or hex differs from the catalog's, or the line is not one a coaster prints in.
#   A spool with more than one color (a gradient or multi-color spool) lists them all under
#   `hexes:`. The finish (silk, sparkle, translucent, ...) is read from the catalog by code.
#
# Each color has an id, which is what a theme names. A theme never writes a hex of its own.
# `themes.py suggest --helper gradient` prints the lines to add here for the colors it picks.

owned_read: "2026-10-04, `bambu filament --json`"

#
# code: the spool's own product code, read off its tag on 2026-10-05 (`bambu filament --json`:
#   `tray_sub_brands` names the line, the letter-digit end of `tray_id_name` is the catalog's
#   `slot` in that line, and `cols` matched the catalog's hexes for all four). The swatch plates
#   (scripts/swatch.py) are named by it.
owned:
  - { id: pink,  hex: "#F5547C", name: "Hot Pink",     code: "10204", note: "PLA Basic Hot Pink, by its tag" }
  - { id: blue,  hex: "#0047BB", name: "Blue",         code: "13903", note: "PLA Silk Neon City by its tag: a two-color spool, #0047BB and #BB22A3; themes draw it as its blue only" }
  - { id: black, hex: "#000000", name: "Black",        code: "10101", note: "PLA Basic Black, by its tag" }
  - { id: green, hex: "#00AE42", name: "Bambu Green",  code: "10501", note: "PLA Basic Bambu Green, by its tag" }

buy:
