# The Bambu Lab X2D, 0.4 mm nozzle, the smooth glacier plate, Bambu PLA Basic: the setup every judged
# plate but bedface-3 printed on. Written by teach-simulator (scripts/fit.py fit --write); the
# comment above the first key is kept when the fit rewrites the rest.
#
# The glacier plate is not Bambu's, and the slicer has no type for it. The print records slice it as
# the High Temp plate (glacier-plate memory, D-108), so `match` names "High Temp Plate", and a slice
# for Bambu's own High Temp plate matches this profile too. The two are different surfaces; nothing
# here says the fit carries to the Bambu plate (K10). If both are ever used, add a profile for the
# other and name the one a slice printed on with --setup.

