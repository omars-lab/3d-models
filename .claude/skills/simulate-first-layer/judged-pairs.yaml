  - { a: G, b: S, omar: better, words: "Fewer",
      source: docs/prints/2026-10-12-bedface-3/index.md,
      note: "across plates: bedface-3 on the textured plate against bedface-2's stock coaster" }
  - { a: K, b: R, omar: better, words: "Fewer",
      source: docs/prints/2026-10-12-bedface-3/index.md,
