# The pairs of printed pieces Omar compared, and what he said, for `simulate.py calibrate`.
#
# Each pair says how Omar found piece `a` against piece `b`: better (fewer slits), worse, same, or
# not_better (no fewer, maybe more). His words are quoted exactly from the print record named in
# `source`, typos kept. Where one answer covered two pieces, the pair is the one the page asked about
# with the turn on the bed matched (both turned or both not), and `note` says so.
#
# Every piece here still had slits in print (each record's lesson says so), so none of them is a
# clean bottom, whatever the plan says.
#
# Add a pair when a new plate is judged. Never reword Omar's answer, and never add a pair he did not
# compare.

# Two settings closer than this, in points of bare share, count as the same in the plan. It is the
# spread the fill-angle sweep measured between fill angles that lay the same lines on the whole
# coaster (docs/research/2026-10-14-fill-angle-sweep.md).
band_pp: 0.13

# Each piece: the plate it printed on (its slice in build/plates/<plate>.plate.3mf), its label in that
# plate's bed map, and what the plain plan cannot see: the first-layer flow ratio, and how much closer
# to the bed the nozzle started (the textured plate's 0.02 mm, bedface-3). Both feed the spread model
# only, which is Theory.
#
# `setup` names the printer setup the piece printed on, one of the profiles in setups/: the machine,
# nozzle, plate and filament. teach-simulator fits a setup only on pairs whose two pieces share it, so
# a pair across setups (G/S and K/R: the textured plate against the glacier plate) is never pooled
# into either fit. The slice cannot tell the glacier plate from Bambu's own High Temp plate (both
# slice as "High Temp Plate"), so the glacier tag comes from the print records, not the slice.
pieces:
  H:   { plate: bedface-4, label: STOCK A, setup: x2d-0.4-glacier-pla-basic }
  J:   { plate: bedface-4, label: STOCK B, setup: x2d-0.4-glacier-pla-basic }
  L:   { plate: bedface-4, label: OVERLAP 30 A, setup: x2d-0.4-glacier-pla-basic }
  P:   { plate: bedface-4, label: OVERLAP 30 B, setup: x2d-0.4-glacier-pla-basic }
  "2": { plate: bedface-4, label: OVERLAP 55 A, setup: x2d-0.4-glacier-pla-basic }
  T:   { plate: bedface-4, label: OVERLAP 55 B, setup: x2d-0.4-glacier-pla-basic }
  U:   { plate: bedface-4, label: FLOW 105 A, flow: 1.05, setup: x2d-0.4-glacier-pla-basic }
  W:   { plate: bedface-4, label: FLOW 105 B, flow: 1.05, setup: x2d-0.4-glacier-pla-basic }
  X:   { plate: bedface-4, label: FLOW 110 A, flow: 1.1, setup: x2d-0.4-glacier-pla-basic }
  Y:   { plate: bedface-4, label: FLOW 110 B, flow: 1.1, setup: x2d-0.4-glacier-pla-basic }
  "4": { plate: bedface-4, label: MONOLINE A, setup: x2d-0.4-glacier-pla-basic }
  "7": { plate: bedface-4, label: MONOLINE B, setup: x2d-0.4-glacier-pla-basic }
  F:   { plate: bedface-1, label: COASTER, setup: x2d-0.4-glacier-pla-basic }
  Z:   { plate: sheets-04g-fit2, label: COASTER, setup: x2d-0.4-glacier-pla-basic }
  S:   { plate: bedface-2, label: COASTER STOCK, setup: x2d-0.4-glacier-pla-basic }
  R:   { plate: bedface-2, label: COASTER RINGS, setup: x2d-0.4-glacier-pla-basic }
  G:   { plate: bedface-3, label: COASTER STOCK, lower_mm: 0.02, setup: x2d-0.4-textured-pei-pla-basic }
  K:   { plate: bedface-3, label: COASTER RINGS, lower_mm: 0.02, setup: x2d-0.4-textured-pei-pla-basic }

pairs:
  - { a: P, b: J, omar: better, words: "P has fewer, l has more",
      source: docs/prints/2026-10-13-bedface-4/index.md,
      note: "asked about L and P against H and J; P and J are both turned" }
  - { a: L, b: H, omar: worse, words: "P has fewer, l has more",
      source: docs/prints/2026-10-13-bedface-4/index.md,
      note: "the lowercase l is L; L and H are both not turned" }
  - { a: T, b: L, omar: better, words: "Fewer, no ridge",
      source: docs/prints/2026-10-13-bedface-4/index.md,
      note: "asked about 2 and T against L and P; T and L are both not turned" }
  - { a: "2", b: P, omar: better, words: "Fewer, no ridge",
      source: docs/prints/2026-10-13-bedface-4/index.md,
      note: "2 and P are both turned" }
  - { a: "2", b: T, omar: better, words: "2 is better than T",
