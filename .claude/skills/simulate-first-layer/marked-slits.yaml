# Where the slits sit on each judged piece, read from its bed-face photo, for teach-simulator.
#
# These are Claude's readings of Omar's photos, not Omar's. Omar's verdicts are in judged-pairs.yaml;
# nothing here changes them. Marked 2026-10-14 by eye, by the rubric in
# ../teach-simulator/marking-rubric.md.
#
# Not blind: every piece was marked knowing Omar's verdicts and the print records' own descriptions
# of the photos. A mark can lean toward the verdict it was read beside. A blind re-mark (pieces
# shuffled, verdicts hidden) is the check this file has not had.
#
# Levels, for each place a slit can sit: 0 none, 1 a few, 2 some, 3 many. null means the place
# does not exist on that piece (no rings, no id) or the photo cannot show it; `why` says which.
#   wall:      along a wall, where the fill meets the wall loops
#   middle:    in the middle of a strap, away from the walls (a seam or a crossing of fill lines)
#   ring_seam: where rings close or the rings from two sides of a strap meet (ring layouts only)
#   id:        at the carved id
#
# Each photo gets one line saying how far it can be read. bedface-4's photos are about 1000 px wide,
# taken at an angle under room light, with glare across the right third, so only the left two-thirds
# of each piece is read.

read_by: Claude (by eye, from the photos); not Omar's reading
marked: 2026-10-14
rubric: ../teach-simulator/marking-rubric.md

pieces:
  H:
    photo: docs/prints/2026-10-13-bedface-4/photos/piece-h-bed-face.jpg
    layout: stock
    marks: { wall: 3, middle: 1, ring_seam: null, id: 0 }
