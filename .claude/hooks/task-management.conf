# task-management-manager hooks for this repo. Each hook is off unless a line here turns it on.
# The list of what waits on Omar is docs/raid.md (the plugin's raid-log skill).
ENABLE_RAID_NOTICE=1     # session start: how many decisions wait on Omar here, and how old
ENABLE_RAID_CHECK=1      # after an edit to docs/raid.md: check its shape
