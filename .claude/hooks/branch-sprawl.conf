# branch-sprawl guard (guardrail-manager) — this repo's limit on working trees.
# 3d-models keeps seven standing worktrees other sessions use (main, -work, -hub-ro,
# -hub-rw, -master-ro, -pm, -naqsh-story), so the default of 5 blocked every new one.
# Raised to 9 by Omar, 2026-10-27: "bump worktree limit for now". Lower it again
# once the standing set shrinks.
MAX_WORKTREES=9
