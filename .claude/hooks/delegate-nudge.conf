# delegate-nudge hook — nudge toward the delegate-parallel-work skill when the
# task list holds several pending, unblocked tasks. See delegate-nudge.py.
# A machine-wide copy at ~/.claude/hooks/delegate-nudge.conf is overridden by this one.
ENABLED=1
MIN_READY=3            # nudge when this many pending + unblocked tasks exist
REMIND_EVERY_MIN=30    # repeat at most this often unless the ready-count grows
