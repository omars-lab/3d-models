# whats-next hook (guardrail-manager plugin): when a stretch of work ends, Claude asks the
# advisor what to do next. The plugin's hook is on for the whole machine; this file overrides
# ~/.claude/hooks/whats-next.conf for this repo so the ask is about customers and users.
# It replaces this repo's own copy of the hook (next-for-customers.py), removed 2026-11-04.
# Keep MESSAGE on one line, and keep the hash sign out of it: the conf reader cuts a line there.
ENABLED=1
MIN_TOOL_CALLS=40
MESSAGE=[whats-next] A stretch of work just finished. Before you hand back, call the advisor and ask it: what is the next most important thing to do for our customers and users (the people who buy and use the coasters, the store, the gallery and the Lab), among the work this session owns? Which work that is: the routing rule in .claude/loop-prompts/README.md, under "Which session runs which loop". If no advisor tool is attached, or it does not answer, answer it yourself from the backlogs in docs/tasks/ that the rule gives this session. End your closing message with a short "Next for customers" section: the one pick, why it matters to them, and whether it is already on a backlog. Name it; do not start it in this turn. If the most important thing belongs to another session or repo by that rule (anything a shopper or the store touches is the storefront repo's), say so and point at its backlog instead of picking it.
