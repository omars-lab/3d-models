# whats-next hook (guardrail-manager plugin): when a stretch of work ends, Claude asks the
# advisor what to do next. The plugin's hook is on for the whole machine; this file overrides
# ~/.claude/hooks/whats-next.conf for this repo so the ask is about customers and users.
# It replaces this repo's own copy of the hook (next-for-customers.py), removed 2026-11-04.
# Open work on the task at hand comes first; the next pick only once it runs out (Omar, 2026-11-05).
# Keep MESSAGE on one line, and keep the hash sign out of it: the conf reader cuts a line there.
ENABLED=1
MIN_TOOL_CALLS=40
MESSAGE=[whats-next] A stretch of work just finished. Before you hand back, check what is still open on the work at hand: the session's task list (in progress first, then pending), open PRs and branches, and follow-ups this work created. If any of it is unblocked (needs no answer, approval or hands from Omar or another session), keep going on it now instead of stopping, highest value first. Only when nothing on the work at hand is left that you can do, call the advisor and ask it: what is the next most important thing to do for our customers and users (the people who buy and use the coasters, the store, the gallery and the Lab), among the work this session owns? Which work that is: the routing rule in .claude/loop-prompts/README.md, under "Which session runs which loop". If no advisor tool is attached, or it does not answer, answer it yourself from the backlogs in docs/tasks/ that the rule gives this session. End your closing message with what is still open and who it waits on, then a short "Next for customers" section: the one pick, why it matters to them, and whether it is already on a backlog. Name it; do not start it in this turn. If the most important thing belongs to another session or repo by that rule (anything a shopper or the store touches is the storefront repo's), say so and point at its backlog instead of picking it.
