    <style>/*
 * The app's one set of style tokens: the gold-on-ink look the Studio has had
 * since the start, and the one-app design's mockup uses (3d-models
 * `docs/design/process/users-and-surfaces-design.md`, D-130).
 *
 * Every name starts `--app-`, because the pages these tokens reach already use
 * the short names for other things: the Studio's `--ink` is the page
 * background, while `design/tokens.css` uses `--ink` for body text. A shared
 * `--ink` would turn one of them unreadable.
 *
 * Read by: the side bar on every page (inlined with it at build time, so it is
 * there on a page whose own stylesheet never loads), and `packages/web`'s
 * `styles.css`, whose own names point here instead of carrying a second copy.
 * The Lab pages' own palettes (`style.css`, `design/tokens.css`) move onto
 * these names page by page; until a page has, it keeps its own look under the
 * shared bar.
 *
 * Two sets, dark and light, in the pattern `design/tokens.css` and the decomp,
 * orb-instrument and rosette-explorer pages already follow: dark on `:root`
 * (what the Studio has always been, and what a browser with no color-scheme
 * support gets), light under `prefers-color-scheme: light`, and both again
 * under `:root[data-theme='light'|'dark']`, so the side bar's Auto / Light /
 * Dark switch beats the system's choice either way. The switch sets
 * `data-theme` before the first paint (`src/appbar.ts`). Nothing is colored
 * inside the media query, only the names are set, or the switch would have
 * nothing to override.
 *
 * The light set is warm paper with a darker gold. `tests/theme-tokens.test.ts`
 * holds its gold, text and dim text to 4.5:1 against the page and panel
 * backgrounds, and the dark set's gold and text too, so a retune that loses
 * contrast fails. (The dark dim text, #7a7468, is 4.3:1 on the ink and was so
 * before the light set came; it is left as it was.)
 */
:root {
  --app-gold: #c9a84c;
  --app-gold-light: #e8c97a;
  --app-gold-dim: #6a5520;
  /* The current page's faint background on the side bar. */
  --app-gold-soft: rgba(201, 168, 76, 0.14);
  --app-blue: #4a9eff;
  --app-blue-dim: #1e4a80;
  --app-ink: #080810;
  --app-ink-mid: #0f0f1a;
  --app-ink-panel: #0c0c18;
  /* Hairlines: the side bar's edge, its divider, card borders. */
  --app-line: #2a2a3a;
  --app-text: #ede8d8;
  --app-text-dim: #7a7468;
  --app-green: #4caf7a;
  --app-red: #f85149;
  /* A shadow under a panel that floats over the page. */
  --app-shadow: rgba(0, 0, 0, 0.45);
  --app-scrim: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
  --app-mono: 'Fira Code', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
  --app-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --app-gold: #7a5f12;
    --app-gold-light: #5c460c;
    --app-gold-dim: #cdb77a;
    --app-gold-soft: rgba(122, 95, 18, 0.12);
    --app-blue: #1f5fbf;
    --app-blue-dim: #b9cdee;
    --app-ink: #f6f1e4;
    --app-ink-mid: #ece4d0;
    --app-ink-panel: #fffcf4;
    --app-line: #d9cfb6;
    --app-text: #1f1b14;
    --app-text-dim: #5f584b;
    --app-green: #276b43;
    --app-red: #b3261e;
    --app-shadow: rgba(60, 45, 10, 0.18);
    --app-scrim: rgba(31, 27, 20, 0.4);
    color-scheme: light;
  }
}

:root[data-theme='dark'] {
  --app-gold: #c9a84c;

  --app-line: #2a2a3a;

  --app-text-dim: #7a7468;

  --app-shadow: rgba(0, 0, 0, 0.45);
  --app-scrim: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

:root[data-theme='light'] {
  --app-gold: #7a5f12;

:root{--appbar-w:240px;--appbar-top:0px}
:root:is([data-appbar-folded],:has(#appbar-fold:checked)){--appbar-w:64px}
body{padding-left:var(--appbar-w)}

.appbar{position:fixed;inset:0 auto 0 0;z-index:1000;display:flex;flex-direction:column;width:var(--appbar-w);
