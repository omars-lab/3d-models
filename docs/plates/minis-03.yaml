# minis-03 — one minimal-frame of every pattern, and one pegs pair
#
# Built with the print-coaster-samples skill (.claude/skills/print-coaster-samples/).
# minis-01 and minis-02 carry only two patterns (CS-1 GimTvN9hw4U, CS-2 7apC5Q9QS-8).
# Omar asked on 2026-09-25 for "as many minimals of different patterns" as fit, even
# smaller, and fewer pegs. So this plate carries the openwork style for all eight
# patterns bikar has a coaster for:
#
#   minimal-frame ×1 each  `-minimal-frame-coaster`  a solid frame round the edge, the
#                                                    straps standing inside, every empty
#                                                    space cut through
#   minimal-pegs  ×2       `-minimal-pegs-coaster`   CS-1 only — minimal-frame with
#                                                    dovetails in the frame, two so the
#                                                    pair can be pushed together
#
# The six minimal-frames beyond CS-1/CS-2 are new (bikar
# feat/minimal-frame-all-patterns, 2026-09-25).
#
# Sizes: 40 mm, the smallest the files allow, except where 40 mm closes the pattern up.
#   sDO9fpu76v8 (Royal Alcazar) at 60 — at 40 it is a solid hexagon with pinholes.
#   nmEjCTzMbDg (n-fold flower) at 70 — at 40 it is a solid disc with a ring of dots;
#     even at 90 only the centre rosette opens, the outer rings stay thin slits. It is
#     here so every pattern is represented, not because it makes good openwork.
# Straps at 1.6 mm everywhere (the freestanding floor, CAL-CST-07); frames at the
# default 3 mm. Every item passed the mesh gate and the linkage gate (one body) at
# exactly these params on 2026-09-25.
#
# Left off, on purpose:
#   interlock          minis-02 has one of each pattern; the CS-1 pegs pair tests the
#                      dovetail fit on this plate.
#   CS-2 minimal-pegs  one pegs pair is enough to test the fit.
#   minimal (no frame) CS-1/CS-2 are on minis-02; clipped tilings need the frame to
#                      stay one piece.
#
# Validate (no hardware, no slicer):
#   bambu slice compose docs/plates/minis-03.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

items:
  - bkr:    bikar:patterns/Constructions/GimTvN9hw4U-minimal-frame-coaster.bkr  # CS-1 six-fold star rosette (hexagon)
    piece:  Coaster
    params: { size: 40, strap: 1.6 }
    count:  1
  - bkr:    bikar:patterns/Constructions/GimTvN9hw4U-minimal-pegs-coaster.bkr   # CS-1 minimal-pegs (pair)
    piece:  Coaster
    params: { size: 40, strap: 1.6 }
    count:  2
  - bkr:    bikar:patterns/Constructions/7apC5Q9QS-8-minimal-frame-coaster.bkr  # CS-2 eight-fold rosette (square)
    piece:  Coaster
    params: { size: 40, strap: 1.6 }
    count:  1
  - bkr:    bikar:patterns/Constructions/rDuxHF3xMOc-minimal-frame-coaster.bkr  # CS-8 eight-fold star rosette tiling (square)
    piece:  Coaster
    params: { size: 40, strap: 1.6 }
    count:  1
  - bkr:    bikar:patterns/Constructions/lEfWSogWscs-minimal-frame-coaster.bkr  # tomb of Itimad ad-Daula (octagon)
    piece:  Coaster
    params: { size: 40, strap: 1.6 }
    count:  1
  - bkr:    bikar:patterns/Constructions/n3IidKfXE1I-minimal-frame-coaster.bkr  # 12-6-4 star rosette (square)
    piece:  Coaster
    params: { size: 40, strap: 1.6 }
    count:  1
  - bkr:    bikar:patterns/Constructions/tA8eSdVx_EQ-minimal-frame-coaster.bkr  # 7-fold star rosette (heptagon)
    piece:  Coaster
    params: { size: 40, strap: 1.6 }
    count:  1
  - bkr:    bikar:patterns/Constructions/sDO9fpu76v8-minimal-frame-coaster.bkr  # Royal Alcazar 6-fold (hexagon)
    piece:  Coaster
    params: { size: 60, strap: 1.6 }
    count:  1
  - bkr:    bikar:patterns/Constructions/nmEjCTzMbDg-minimal-frame-coaster.bkr  # n-fold flower (round)
    piece:  Coaster
    params: { size: 70, strap: 1.6 }
    count:  1
