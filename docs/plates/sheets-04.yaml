# sheets-04 — the gBV fit (sampler sheet 4)
#
# The gBV minimal coaster itself (gBV_JTt3Kxk, CS-13: the straps only, 4 mm tall, no base),
# and loose pieces for two of its rings, to see whether they fit the real coaster. Omar,
# 2026-10-02: print the minimal construction, not a separate frame. The coaster prints once;
# the pieces change. The pieces come from bikar's `Loose-Fit-Coupon.bkr`, which keeps the
# coaster's size 90 and strap 3, so they are the pieces the gBV coaster will have. They are
# 1.2 mm thick, so in the 4 mm coaster they sit below the top: the fit is read on the walls.
#
# The coaster's holes are cut on the exact outline the pieces were made for (bikar #297), so
# each piece keeps its full gap all round. Measured on the meshes at mid height (2026-10-02),
# least room per set, every corner read: GAP 05 +0.050 mm, GAP 10 +0.100, GAP 15 +0.150,
# GAP 20 +0.200, STAR 15 +0.150; no corner inside a wall. Before #297 the holes came up to
# 0.25 mm further in at the points and blunted the star tips, and only GAP 20 cleared.
#
#   COASTER  the gBV minimal coaster, one
#   GAP 05   orbit 2, the ten six-sided pieces of the middle ring, 0.05 mm per face
#   GAP 10   the same ring at 0.10
#   GAP 15   the same ring at 0.15 (CAL-FIT-01's sliding step, the file default)
#   GAP 20   the same ring at 0.20
#   STAR 15  orbit 3, the ten small five-point stars, at 0.15 only, to see whether the tips catch
#   PEAK 2   orbit 2 at 0.15 again, each piece with a 2 mm peak on top (D-091): the same wall
#            and gap as GAP 15, then a soft curve up to a point, so flat and peaked sit side by
#            side. 1.2 + 2 = 3.2 mm tall, still under the coaster's 4 mm top
#
# The rings come from `bikar bands` on the gBV coaster: orbit 2 is ten hexagons at radius
# 19.9 mm, orbit 3 ten 10-sided stars at 28.3 mm. The gap is taken off the piece, so the pocket
# keeps the drawn shape and the one coaster takes every set. Each set is one plate item (its ten
# pieces keep their ring) and goes into its own bag straight off the plate, labelled with its
# code, because the sets look alike. The codes are not on the pieces; each item's `label:` is
# its code, and compose writes where each one landed to the bed map beside the plate
# (`print_review.py bed` draws it).
#
# Printing waits on Omar's yes to failure detection on and the first layer watched
# (loose-pieces §3.7): the pieces are the smallest things we would have printed.
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/plates/sheets-04.yaml --dry-run
# Slice, then draw the bed with its labels:
#   bambu slice compose docs/plates/sheets-04.yaml
#   python3 tools/print_review.py bed <out.png> build/plates/sheets-04.plate.3mf

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-coaster.bkr
    label:  COASTER
  - bkr:    bikar:patterns/Coupons/Loose-Fit-Coupon.bkr
    label:  GAP 05
    piece:  Hex
    params: { gap: 0.05 }
  - bkr:    bikar:patterns/Coupons/Loose-Fit-Coupon.bkr
    label:  GAP 10
    piece:  Hex
    params: { gap: 0.1 }
  - bkr:    bikar:patterns/Coupons/Loose-Fit-Coupon.bkr
    label:  GAP 15
    piece:  Hex
    params: { gap: 0.15 }
  - bkr:    bikar:patterns/Coupons/Loose-Fit-Coupon.bkr
    label:  GAP 20
    piece:  Hex
    params: { gap: 0.2 }
  - bkr:    bikar:patterns/Coupons/Loose-Fit-Coupon.bkr
    label:  STAR 15
    piece:  Star
    params: { star_gap: 0.15 }
  - bkr:    bikar:patterns/Coupons/Loose-Fit-Coupon.bkr
    label:  PEAK 2
    piece:  Hex
    params: { gap: 0.15, peak: 2 }
