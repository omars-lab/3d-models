    width: 20
    parts:
      - {kind: piece, color: teal, box: [0, 0, 20, 1.6], label: lower half, label_at: [18, 0.8]}
      - {kind: piece, box: [0, 1.6, 20, 1.6], label: upper half, label_at: [18, 2.4]}
      - {kind: seam, line: [0, 1.6, 20]}
      - {kind: stud, color: teal, box: [5, 1.6, 1.2, 1.0], toward: up, label: pin, label_at: [5.6, 2.1]}
      - {kind: stud, color: teal, box: [13.8, 1.6, 1.2, 1.0], toward: up}
    notes:
      - "No gap at the cut, and twisting the halves against each other does not turn them."
  - title: "Bad: a pin too tight holds the halves apart"
    width: 20
    parts:
      - {kind: piece, color: teal, box: [0, 0, 20, 1.6], label: lower half, label_at: [18, 0.8]}
      - {kind: air, box: [0, 1.6, 20, 0.5], label: "a gap you can see", label_at: [16, 1.85]}
      - {kind: piece, box: [0, 2.1, 20, 1.6], label: upper half, label_at: [18, 2.9]}
      - {kind: stud, color: teal, box: [5, 1.6, 1.2, 1.0], toward: up}
      - {kind: stud, color: teal, box: [13.8, 1.6, 1.2, 1.0], toward: up}
    notes:
      - "The other bad case cannot be seen from the side: the halves close but turn round each other,
        as STAR-STOCK can on its one pin."
