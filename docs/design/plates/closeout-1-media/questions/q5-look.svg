<svg xmlns="http://www.w3.org/2000/svg" width="1517.92" height="404.9" viewBox="0 0 1517.92 404.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Question 5: a brim kite cut through from the side, on the bed and after trimming (a sketch)</title>
<rect width="100%" height="100%" fill="#f8f7f4"/>
<text x="20" y="37" font-size="17" font-weight="bold" fill="#222222">Question 5: a brim kite cut through from the side, on the bed and after trimming (a sketch)</text>
<text x="20" y="53.5" font-size="12.5" fill="#555555">Cut through, side view. Gold: the piece. Solid blue: printed on the bed (first layer). Not to scale.</text>
<g data-panel="On the bed: a thin brim round the kite's first layer">
<text x="20" y="89.5" font-size="14" font-weight="bold" fill="#222222">On the bed: a thin brim round the kite's first layer</text>
<g transform="translate(26,107.5)">
<polygon data-kind="piece" points="108,57.6 324,57.6 324,0 108,0" fill="#dcaa33"/>
<line data-mark="first" x1="108" y1="57.6" x2="324" y2="57.6" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="flange" points="0,57.6 108,57.6 108,50.4 0,50.4" fill="#dcaa33"/>
<polygon data-kind="flange" points="324,57.6 432,57.6 432,50.4 324,50.4" fill="#dcaa33"/>
<rect data-kind="bed" x="-6" y="61.6" width="444" height="5" fill="#cfcbc3"/>
<text x="442" y="67.6" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="242" cy="136.3" r="2.6" fill="#222222"/>
<polyline points="242,136.3 539.24,136.3 549.24,136.3" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="553.24" y="140.3" font-size="12" fill="#222222" text-anchor="start">kite</text>
<circle data-label-dot="1" cx="80" cy="161.5" r="2.6" fill="#222222"/>
<polyline points="80,161.5 539.24,161.5 549.24,161.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="553.24" y="165.5" font-size="12" fill="#222222" text-anchor="start">2 mm brim, one layer</text>
</g>
<g data-panel="Good: brim off, a sharp clean bottom edge">
<text x="825.12" y="89.5" font-size="14" font-weight="bold" fill="#222222">Good: brim off, a sharp clean bottom edge</text>
<g transform="translate(831.12,107.5)">
<polygon data-kind="piece" points="108,57.6 324,57.6 324,0 108,0" fill="#dcaa33"/>
<line data-mark="first" x1="108" y1="57.6" x2="324" y2="57.6" stroke="#2f6fd8" stroke-width="4"/>
<rect data-kind="bed" x="-6" y="61.6" width="444" height="5" fill="#cfcbc3"/>
<text x="442" y="67.6" font-size="12" fill="#444444">the table</text>
</g>
<circle data-label-dot="1" cx="1155.12" cy="165.1" r="2.6" fill="#222222"/>
<polyline points="1155.12,165.1 1344.36,165.1 1354.36,165.1" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1358.36" y="169.1" font-size="12" fill="#222222" text-anchor="start">square corner, no lip</text>
</g>
<g data-panel="Bad: a lip left where the brim was">
<text x="20" y="252.7" font-size="14" font-weight="bold" fill="#222222">Bad: a lip left where the brim was</text>
<g transform="translate(26,270.7)">
<polygon data-kind="piece" points="108,57.6 324,57.6 324,0 108,0" fill="#dcaa33"/>
<line data-mark="first" x1="108" y1="57.6" x2="324" y2="57.6" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="flange" points="97.2,57.6 108,57.6 108,50.4 97.2,50.4" fill="#dcaa33"/>
<polygon data-kind="flange" points="324,57.6 334.8,57.6 334.8,50.4 324,50.4" fill="#dcaa33"/>
<rect data-kind="bed" x="-6" y="61.6" width="444" height="5" fill="#cfcbc3"/>
<text x="442" y="67.6" font-size="12" fill="#444444">the table</text>
</g>
<circle data-label-dot="1" cx="128.6" cy="324.7" r="2.6" fill="#222222"/>
<polyline points="128.6,324.7 539.24,324.7 549.24,324.7" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="553.24" y="328.7" font-size="12" fill="#222222" text-anchor="start">lip: it may stop the kite fitting</text>
<text x="20" y="367.9" font-size="12" fill="#444444">Compare with the plain twin beside it: its bottom edge, its corners, and whether it still goes in its pocket.</text>
</g>
</svg>
