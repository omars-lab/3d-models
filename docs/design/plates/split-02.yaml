# split-02 — option C: a split gBV coaster whose pieces carry a flange the two halves close on
#
# Omar, 2026-10-04, on the split design's call 6 (split-with-studs §11): "i want a olate hat tries
# a and c ... these shoukd be different options in coaster lab". Option C is the flange: both faces
# of the coaster stay flush. Each piece is a 0.6 mm boss the shape of its hole, then a band 0.8 mm
# wider all round for the middle 3.2 mm, then another 0.6 mm boss, and each half has an undercut
# at the cut for its side of the band. Closed, the band is held between the two halves and only
# the bosses show. Option A, the lip, is split-01: two plates, because four 112.5 mm halves fill
# an X2D bed and leave no room for pieces.
#
# The coaster is bikar's gBV_JTt3Kxk-split-flange-coaster.bkr at its defaults: size 112.5 (the
# 1.25x coaster sheets-04g printed), strap 3.75, closed height 4.4, cut at half, flange 0.8,
# gap 0.25 per face. No studs: the undercuts leave no strap wide enough to stand a 2 mm stud on,
# so the halves line up by their outlines and the pieces.
#
# The coaster carries its id, 2, so it can be told from split-01 and every later prototype (Omar,
# 2026-10-06: "every proptoty should have an id"). Its cut faces are mostly undercut, so the id
# goes on the lower half's bottom face instead, mirrored so it reads the right way round there,
# 2 mm tall: the most the strap has room for. The coaster file's id defaults to 0, no mark; the
# plate sets it. At 112.5 the flange takes 1 to 9 except 4, whose closed loop shuts at 2 mm.
#
# No color here, on purpose. The send picks it: `bambu print send … --color "#RRGGBB"`.
#
#   LOWER    the lower half, cut face up (1)
#   UPPER    the upper half, printed face down (1)
#   MIDDLE   the twenty-sided piece in the middle (1)
#   KITE     the small four-sided kites (10)
#   HEX      the inner ring of six-sided pieces (10)
#   STAR     the ten-pointed stars (10)
#   OUTER    the outer ring of six-sided pieces (10)
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/split-02.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

id_code: SP2
no_id_reasons:
  - &lower "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. The plate's number, cut into its bottom by the coaster file's own id mark, tells it apart."
  - &upper "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. It is the only upper half on the plate, and it closes onto the lower half beside it."
  - &kite "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. Pieces stay with the coaster they came off the bed beside, from the plate's bed map."
  - &hex "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. Pieces stay with the coaster they came off the bed beside, from the plate's bed map."
  - &outer "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. Pieces stay with the coaster they came off the bed beside, from the plate's bed map."
  - &star "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. Pieces stay with the coaster they came off the bed beside, from the plate's bed map."

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Lower
    params: { size: 112.5, id: 2 }
    label:  LOWER
    no_id:  *lower
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Upper
    params: { size: 112.5, id: 2 }
    label:  UPPER
    no_id:  *upper
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Middle
    params: { size: 112.5, id: 2 }
    label:  MIDDLE
    id:     M
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Kite
    params: { size: 112.5, id: 2 }
    label:  KITE
    no_id:  *kite
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Hex
    params: { size: 112.5, id: 2 }
    label:  HEX
    no_id:  *hex
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Star
    params: { size: 112.5, id: 2 }
    label:  STAR
    no_id:  *star
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Outer
    params: { size: 112.5, id: 2 }
    label:  OUTER
    no_id:  *outer
