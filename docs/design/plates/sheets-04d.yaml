# sheets-04d — the gBV minimal coaster, bigger, with a mini iPhone and a gummy bear
#
# Omar, 2026-10-03: "i want to make a new minimal construction and all pieces and make a bigger
# version of them, 1.25 current length and width and 1.1 size the height". sheets-04c printed the
# gBV minimal coaster (gBV_JTt3Kxk, CS-13) at size 90, strap 3, height 4, round 1. This plate is
# the same file 1.25 times across and 1.1 times up: size 112.5, strap 3.75, round 1.25, height
# 4.4. Its pieces are on sheets-04e (pink) and sheets-04f (black), one color per plate, because a
# headless slice with two filaments crashes Bambu Studio 02.08.02.61.
#
# He also asked for "a mini version of this /Users/omareid/Downloads/Iphone 16 Pro.stl" and "a
# minim gummy bear stl". Both ride on this plate, since it has the most room (an assumption,
# stated in the report). Neither file is in git: this repo is public, the iPhone model's license
# likely forbids sharing it, and the bear is 34 MB. They sit in the gitignored .bambu/imports/,
# held to their hashes.
#
#   COASTER  the gBV minimal coaster at size 112.5, strap 3.75, height 4.4, round 1.25
#   PHONE    the phone from the iPhone 16 Pro model, already about 1:3.8 (16.6 x 40 x 4.6 mm),
#            so scale 1. The model is two bodies, a phone and a case. Sliced alone, the case is
#            flagged both ways up (its back hangs over the hollow, or it stands on its camera
#            ring), and only the phone as modeled (screen down, lenses up) slices clean. So the
#            phone is cut out by sheets-04d-phone.scad and the case left off. A re-cut can list the
#            same triangles in another order, so its sha256 goes here afresh.
#   BEAR     "Gummy Bear" by shoorya, Printables 1351519, CC0: modeled 2.1 x 2.3 x 4.1 mm,
#            scale 5 gives about 10.7 x 11.7 x 20.2 mm, a real gummy bear's size
#
# Green (#00AE42), the tray loaded now (filament-sync against sheets-04c).
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/sheets-04d.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"
  color:    "#00AE42"

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-coaster.bkr
    params: { size: 112.5, strap: 3.75, height: 4.4, round: 1.25 }
    label:  COASTER
  - stl:    .bambu/imports/iphone-16-pro-phone.stl # cut from iphone-16-pro.stl, sha256 4a15ef0b…
    sha256: 6c0155fcb3d2639796d493b903b4ac6dfbc7aea8467558c1644dd2e63a9dd09b
    label:  PHONE
  - stl:    .bambu/imports/gummy-bear-cc0-1351519.stl
    sha256: 3d383c58dabb7c317064e75b69cfb29a21ff6739cb38d83d3e0b2e31cfa55fa2
    scale:  5
    label:  BEAR
