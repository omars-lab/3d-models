# stud-1 — three wedges of the split lip coaster, the same but for how far apart their studs are
#
# Task #241: which stud spacing holds a split coaster's halves together and lines them up. The
# split lip coaster (bikar's gBV_JTt3Kxk-split-lip-coaster.bkr, split-01's coaster) is cut to a
# 72-degree slice, a fifth of the coaster, from 9 degrees (bikar #332: `wedge` keeps whole faces by
# their centre angle and picks the studs again on the slice). A slice is a fifth of the bed and a
# fifth of the time, and still has straps, lips, holes and studs as the whole coaster does.
#
# Everything is split-01's but the slice, the stud spacing and the carved id:
#
#   pair   stud_spacing   studs on the slice   id
#   25     25 mm           3                   4
#   15     15 mm           7                   5
#   10     10 mm          13                   6
#
# 25 mm is the coaster file's default and split-01's. The id goes on each lower half's bottom face,
# mirrored, as on split-01 (1), split-02 (2) and pkt-2 (3). The stud gap stays 0.05 mm, the coaster
# file's default, until spl-1 says which gap holds (task #251); if spl-1's winner differs, the gap
# moves to it as a new iteration of this plate.
#
# No loose pieces: split-01 asks how the pieces seat at full size, and pieces here would mix that
# question into this one (a pair that rocks could be the pieces or the studs).
#
# No color here, on purpose. The send picks it: `bambu print send … --color "#RRGGBB"`.
#
#   LOWER25  UPPER25   the halves at 25 mm, id 4
#   LOWER15  UPPER15   the halves at 15 mm, id 5
#   LOWER10  UPPER10   the halves at 10 mm, id 6
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/stud-1.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

id_code: ST1
no_id_reasons:
  - &lower "Its bottom, the bed face, already carries the coaster's own id mark (4, 5 or 6), cut by the coaster file; a piece letter beside it would say nothing the number does not (D-114)."
  - &upper "An upper half prints face down, so its bed face is the top that shows in use, and an id is cut only on a face hidden in use (D-114). The three uppers are told apart by their sockets, which match their lower's studs: 3 at 25 mm, 7 at 15 mm, 13 at 10 mm."

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Lower
    params: { size: 112.5, wedge: 72, wedge_from: 9, stud_spacing: 25, id: 4 }
    label:  LOWER25
    no_id:  *lower
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Upper
    params: { size: 112.5, wedge: 72, wedge_from: 9, stud_spacing: 25, id: 4 }
    label:  UPPER25
    no_id:  *upper
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Lower
    params: { size: 112.5, wedge: 72, wedge_from: 9, stud_spacing: 15, id: 5 }
    label:  LOWER15
    no_id:  *lower
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Upper
    params: { size: 112.5, wedge: 72, wedge_from: 9, stud_spacing: 15, id: 5 }
    label:  UPPER15
    no_id:  *upper
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Lower
    params: { size: 112.5, wedge: 72, wedge_from: 9, stud_spacing: 10, id: 6 }
    label:  LOWER10
    no_id:  *lower
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Upper
    params: { size: 112.5, wedge: 72, wedge_from: 9, stud_spacing: 10, id: 6 }
    label:  UPPER10
    no_id:  *upper
