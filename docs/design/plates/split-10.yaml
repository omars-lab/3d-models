# split-10 — the flange coaster's loose pieces, each fix bracketed, a stock piece beside each
#
# split-07 printed the whole flange coaster with every loose piece cut in two. Omar, 2026-10-27,
# with photos: the stars' faces "are not a star extruded, they have a curve"; "the middle piece
# has webbed duck feel"; "the dovetail kites are really loose"; "i want to run experiments on these
# infill pieces". The halves (the frame) came out well and wait on split-09.
#
# So this bed is loose pieces only, no frame: they go into the split-07 frame Omar already has.
# Every frame-facing param is split-07's, so each stock piece is split-07's piece. wedge 36 cuts
# each ring down to one piece (two bodies, its lower and upper halves); the middle piece is one
# already and takes no wedge.
#
# Iteration 2 (Omar, "does this maximize the testing we can do to reduce prints?", then
# "Everything, slope included"): each fit is bracketed both ways from stock, so one print finds
# the fit instead of one step per print, and each fit variant prints twice, so one bad piece does
# not decide it.
#
#   Stars (the curve): stock cut star / a whole star (halves 0: does the cut cause the curve?) /
#     a cut star with supports under the 0.8 mm step each half prints over air / a cut star with a
#     45° slope under that step (slope 0.2, bikar #349).
#   Middle (the "webbed" feel): stock / with supports / with the slope.
#   Kites (loose), two of each: gap 0.12 (stock) / 0.10 / 0.08 a face; pin hole 0.25 wider than
#     the pin (stock) / 0.20 / 0.15.
#   Hexes and outer pieces (the dovetail slide), two of each: 0.15 a side (stock) / 0.10 / 0.05.
#     "Dovetail kites" may mean the kites or the pieces with the dovetail; both are here.
#
# The sloped star and middle set slide_hex 0 and slide_outer 0: bikar refuses a slope on any
# piece of a coaster that also asks for a slide, and the whole coaster is built even when one
# piece is picked. Neither the star nor the middle has a slide, so their meshes change only by the
# slope.
#
# No labels: an id may go only on a face hidden in use (D-114), and both faces of a cut piece show.
# Pieces are told apart by where they sit on the bed: the page's bed picture names each.
#
# No color here: the send picks it.
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/split-10.yaml --plate-type textured_plate --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

id_code: SPA

ledge_bitten_by_design: "the 0.7 mm wall Omar picked on split-08 still bites the hex pieces' blunt end (D-119); split-07's pieces, unchanged"
no_id_reasons:
  - &nolabel "No labels: both faces of a cut piece show in use, and an id goes only on a hidden face (D-114). Each piece is told apart by its place on the bed picture."

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Star
    params: { size: 112.5, stud: 1.2, stud_gap: 0.25, stud_spacing: 6, stud_ring2: 54.4, stud_ring2_n: 10, stud_ring2_turn: 18, stud_ring3: 13.0, stud_ring3_n: 10, stud_ring3_turn: 18, stud_ring4: 25.1, stud_ring4_n: 10, stud_ring4_turn: 0, stud_ring5: 33.5, stud_ring5_n: 10, stud_ring5_turn: 18, stud_boss: 1, room: 0.2, gap: 0.1, stud_wall: 0.7, halves: 1, pin: 1.2, pin_gap: 0.25, pins_middle: 3, pins_kite: 1, pins_star: 1, slide: 4, slide_gap: 0.15, slide_height: 0.8, slide_hex: 1, slide_outer: 1, wedge: 36 }
    label:  STAR-STOCK
