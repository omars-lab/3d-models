    object_settings: { infill_wall_overlap: "55%" }
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Kite
    params: { size: 112.5, stud: 1.2, stud_gap: 0.25, stud_spacing: 6, stud_ring1: 9.6, stud_ring1_n: 10, stud_ring1_turn: 0, stud_ring2: 54.4, stud_ring2_n: 10, stud_ring2_turn: 18, stud_boss: 1, room: 0.2, gap: 0.12 }
    label:  KITES-G12
    no_id:  *nolabel
    object_settings: { infill_wall_overlap: "55%" }
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Hex
    params: { size: 112.5, stud: 1.2, stud_gap: 0.25, stud_spacing: 6, stud_ring1: 9.6, stud_ring1_n: 10, stud_ring1_turn: 0, stud_ring2: 54.4, stud_ring2_n: 10, stud_ring2_turn: 18, stud_boss: 1, room: 0.2, gap: 0.1 }
    label:  HEXES
    no_id:  *nolabel
    object_settings: { infill_wall_overlap: "55%" }
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
    piece:  Star
    params: { size: 112.5, stud: 1.2, stud_gap: 0.25, stud_spacing: 6, stud_ring1: 9.6, stud_ring1_n: 10, stud_ring1_turn: 0, stud_ring2: 54.4, stud_ring2_n: 10, stud_ring2_turn: 18, stud_boss: 1, room: 0.2, gap: 0.1 }
    label:  STARS
    no_id:  *nolabel
    object_settings: { infill_wall_overlap: "55%" }
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-flange-coaster.bkr
