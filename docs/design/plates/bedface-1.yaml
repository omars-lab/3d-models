# bedface-1 — sheets-04g-fit2 again, on the house bed-face preset
#
# Omar, 2026-10-10, with a photo of a pink coaster's underside: "why do i get gaps like this in
# the plate touching side". The answer is the bed-face design
# (docs/design/printing/bed-face-slicing-design.md): the stock first layer leaves slits where its
# diagonal lines turn at the walls, and a bare core in small kites. Its fix is the house preset,
# tools/bambu/presets/bed-face-0.20.json (rings on the first layer, 30% overlap, a 0.42 mm first
# line), checked so far only in the slicer's plan. Then "send the plate", and of the ways to test
# it he picked "One plate, new preset only", in pink (#F5547C).
#
# So this plate is sheets-04g-fit2 piece for piece, in the same pink, on the same glacier plate,
# with one thing changed: the settings line. fit2 printed on the stock preset on 2026-10-10 and
# its pieces are on hand, so each piece here is judged beside its fit2 twin: the undersides
# (slits gone?) and the fit in the coaster (moved?). The design's first plan, one plate in two
# halves, stock and house, cannot test the 0.42 line: Bambu's command line takes the rings and
# the overlap per object but not the first line's width (design §5.2).
#
# The kites keep fit2's 0.05 gap although fit2 found them tough to push in. Widening them is
# sheets-04g-fit3's question; here it would mix a fit change into the bed-face comparison.
#
# The carved id (D-109, D-114): FC1/<iteration> <letter> on each middle piece, A at gap 0, C at
# 0.025, E at 0.05, as on fit2; F on the coaster, not the Z that fit and fit2 carve, since one
# letter is all `id_form: piece` cuts and two Z coasters could not be told apart; none on the
# kites, so keep them in their own pile off the bed. B, D, M, N and O are left
# out of the code and the letters, since they read alike at 2.5 mm (Omar, 2026-10-09).
#
#   COASTER               the gBV minimal coaster, as fit2 printed it (1)
#   KITE 0.05             ten kites at gap 0.05 (10)
#   MIDDLE 0 … 0.05       one middle piece at each of 0, 0.025 and 0.05, three dots to one (3)
#
# No color here, on purpose: the send picks it (`bambu print send … --color "#RRGGBB"`).
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/bedface-1.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;tools/bambu/presets/bed-face-0.20.json"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

id_code: FC1
no_id_reasons:
  - &kite "bikar refuses even the one-letter id here (D-114): it needs a flat bed-face patch with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. There is one rung of kites on this plate, so they need no telling apart."

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-coaster.bkr
    params: { size: 112.5, strap: 3.75, height: 4.4, round: 1.25 }
    label:  COASTER
    id:     F
    id_form: piece
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Kite
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.05 }
    label:  KITE 0.05
    no_id:  *kite
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0, middle_dots: 3 }
    label:  MIDDLE 0
    id:     A
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.025, middle_dots: 2 }
    label:  MIDDLE 0.025
    id:     C
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.05, middle_dots: 1 }
    label:  MIDDLE 0.05
    id:     E
