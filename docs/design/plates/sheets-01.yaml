# sheets-01 — edge and top (sampler sheet 1)
#
# One card with 30 mm windows of the three minimal coasters standing on it, cut at their own
# 90 mm scale, so a sample is the real coaster's edge and top, not a shrunk copy. The card is
# bikar's `Sampler-Cards.bkr` piece Sheet1Card, its codes engraved; the cells below use the
# same numbers as its labels (column x = -20, 14, 48; row y = 24, -10, -44).
#
#   A TODAY  today's staircase edge, round 1 — the control
#   B TRUE   the true edge (bikar #291), round 1 — the file default
#   C DOME   the true edge, round 1.5 — the full dome
#
# Columns: CS-1 crossing (GimTvN9hw4U), CS-2 star (7apC5Q9QS-8), gBV star (gBV_JTt3Kxk).
#
# Row A is three vendored STLs, not a bikar render: bikar main draws only the true edge, so the
# staircase windows were cut once from the commit before it with the window cut backported, and
# checked in with their hashes (src/Samplers/sheets-01-row-a/README.md says how, and how to
# rebuild them byte for byte). The sheet refuses a row A file whose hash has changed.
#
# Build and look (no hardware; slicing is local):
#   bambu slice sheet docs/design/plates/sheets-01.yaml --dry-run
#   bambu slice sheet docs/design/plates/sheets-01.yaml

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

card:
  bkr: bikar:patterns/Coupons/Sampler-Cards.bkr
  piece: Sheet1Card

cells:
  - name: A TODAY / CS-1
    at: [-20, 24]
    stl: src/Samplers/sheets-01-row-a/GimTvN9hw4U-minimal-coaster-window.stl
    sha256: da3a40df55a57b00cfa08b46edc27df7438e107b94770a940cf40ebf2d0263d9
    window: 30@9.7,1
  - name: A TODAY / CS-2
    at: [14, 24]
    stl: src/Samplers/sheets-01-row-a/7apC5Q9QS-8-minimal-coaster-window.stl
    sha256: c0ba87472a8cf358a95f4aa9a25c208cbf3a10aed0283560a01eef8c49d34e38
    window: 30@18.5,18.5
  - name: A TODAY / GBV
    at: [48, 24]
    stl: src/Samplers/sheets-01-row-a/gBV_JTt3Kxk-minimal-coaster-window.stl
    sha256: c1b596e59f39a41adbd124718c0ba689652e79def54228103b0efa3a1015bccb
    window: 30@0,0
  - name: B TRUE / CS-1
    at: [-20, -10]
    bkr: bikar:patterns/Constructions/GimTvN9hw4U-minimal-coaster.bkr
    piece: Coaster
    window: 30@9.7,1
  - name: B TRUE / CS-2
    at: [14, -10]
    bkr: bikar:patterns/Constructions/7apC5Q9QS-8-minimal-coaster.bkr
    piece: Coaster
    window: 30@18.5,18.5
  - name: B TRUE / GBV
    at: [48, -10]
    bkr: bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-coaster.bkr
    piece: Coaster
    window: 30@0,0
  - name: C DOME / CS-1
    at: [-20, -44]
    bkr: bikar:patterns/Constructions/GimTvN9hw4U-minimal-coaster.bkr
    piece: Coaster
    params: { round: 1.5 }
    window: 30@9.7,1
  - name: C DOME / CS-2
    at: [14, -44]
    bkr: bikar:patterns/Constructions/7apC5Q9QS-8-minimal-coaster.bkr
    piece: Coaster
    params: { round: 1.5 }
    window: 30@18.5,18.5
  - name: C DOME / GBV
    at: [48, -44]
    bkr: bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-coaster.bkr
    piece: Coaster
    params: { round: 1.5 }
    window: 30@0,0
