# pkt-1 — the pocket coupon: does a piece printed in place in its pocket come out loose?
#
# Way c of the finish-techniques brainstorm (docs/design/printing/finish-techniques-brainstorm.md
# §1.4), the split design's other way to keep a loose piece in. Each loose piece is cut at the
# split too, and each half prints its own piece half inside it, in a closed pocket: the pocket
# necks in at the face and again at the cut, and between them is a room at the full opening. The
# piece half is a plug through each neck and a band in the room, with air above and below the
# band. Nothing is placed by hand. Closing the coaster presses each piece half onto its partner at
# the cut, with nothing extra between them (the brainstorm's pick; glue comes only if the movement
# is felt).
#
# Three things are not known, and this plate asks each in the hand:
#   - whether the band comes free of the necks, or the air closes up and fuses it;
#   - whether the closed piece moves or clicks in its pocket when the coaster is lifted;
#   - whether the band's underside, printed over air on the plug, comes out flat.
#
# Pairs: bikar's patterns/Coupons/Split-Pocket-Coupon.bkr, the spl-1 trap tile (25 mm square,
# 4.4 mm tall, cut at 2.2, two studs) with its hexagon in a pocket. Each half's band is 0.6 mm.
#   P2: one layer of air (0.2 mm), necks 0.6 mm (the deboss floor)
#   P4: two layers of air (0.4 mm), necks 0.4 mm, under the deboss floor on purpose
# Two pairs of each, since a fused band may come from one bad layer, not the air: a and b.
# Lower is the stud half, Upper the socket half, each printed face down with its piece half in it.
# Each pair's letter is cut into its cut faces, the lower half reading <letter>B and the upper
# <letter>T (Omar, 2026-10-06, on spl-1: "minimal letters printiend on each AT AB"). The letters
# go on from spl-1's A to N, so no two prototypes on the shelf share one: P2a is O, P2b P, P4a Q,
# P4b R.
#
# No color here, on purpose. The send picks it: `bambu print send … --color "#RRGGBB"`.
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/pkt-1.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

id_code: PK1
no_id_reasons:
  - &lower "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. Its pair letter, cut into its cut face as <letter>B (O to R), tells it apart."
  - &upper "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. Its pair letter, cut into its cut face as <letter>T (O to R), tells it apart."

items:
  - { bkr: "bikar:patterns/Coupons/Split-Pocket-Coupon.bkr", piece: Lower, params: { air: 0.2, thick: 0.6, pair: 15 }, no_id: *lower, label: P2aL }
  - { bkr: "bikar:patterns/Coupons/Split-Pocket-Coupon.bkr", piece: Upper, params: { air: 0.2, thick: 0.6, pair: 15 }, no_id: *upper, label: P2aU }
  - { bkr: "bikar:patterns/Coupons/Split-Pocket-Coupon.bkr", piece: Lower, params: { air: 0.2, thick: 0.6, pair: 16 }, no_id: *lower, label: P2bL }
  - { bkr: "bikar:patterns/Coupons/Split-Pocket-Coupon.bkr", piece: Upper, params: { air: 0.2, thick: 0.6, pair: 16 }, no_id: *upper, label: P2bU }
  - { bkr: "bikar:patterns/Coupons/Split-Pocket-Coupon.bkr", piece: Lower, params: { air: 0.4, thick: 0.4, pair: 17 }, no_id: *lower, label: P4aL }
  - { bkr: "bikar:patterns/Coupons/Split-Pocket-Coupon.bkr", piece: Upper, params: { air: 0.4, thick: 0.4, pair: 17 }, no_id: *upper, label: P4aU }
  - { bkr: "bikar:patterns/Coupons/Split-Pocket-Coupon.bkr", piece: Lower, params: { air: 0.4, thick: 0.4, pair: 18 }, no_id: *lower, label: P4bL }
  - { bkr: "bikar:patterns/Coupons/Split-Pocket-Coupon.bkr", piece: Upper, params: { air: 0.4, thick: 0.4, pair: 18 }, no_id: *upper, label: P4bU }
