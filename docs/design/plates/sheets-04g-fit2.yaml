# sheets-04g-fit2 — the middle piece halfway between gap 0 and 0.05, in a fresh coaster
#
# Omar, 2026-10-10, on sheets-04g-fit: "middle peice wise, a fits but to tight. B is good but
# comes off a bit to easy? is there a midway between a and b?". A was gap 0 per face and B 0.05.
# In the older sheets-04g coaster everything sat about one 0.05 rung looser ("4b on that oen is
# loose. 4a fits but easliy removable"), so the hole size moves from print to print: the pieces
# have to be tried in a coaster printed with them, never one from another print.
#
# So this plate prints a fresh coaster and the middle piece at three gaps: 0 and 0.05 again, as
# controls for this print's holes, and 0.025, the midway. A control that does not repeat its
# 4GF verdict says this coaster's holes moved, and the 0.025 piece is read against the controls,
# not against the old plate.
#
# The kites: on sheets-04g-fit "the biggest size fits well, rest too small/lost", the biggest
# being gap 0.05. One rung of ten at 0.05 prints again, to check that gap holds in a new coaster.
# That is an assumption on the page, not a decision.
#
# Each middle piece carries dots in its top, the most on the biggest, as on sheets-04g-fit:
# three at gap 0, two at 0.025, one at 0.05. A dot is 1 mm across and keeps 0.8 mm of top to the
# piece's edge (CAL-CST-01). The kites carry none.
#
# The carved id (D-109, D-114) goes on each piece's bed face. A middle piece carries the whole id,
# 4GH/<iteration> <letter>: A at gap 0 (the 4GF A again), C at 0.025, E at 0.05. B, D, M, N and O
# are skipped, since they read alike at 2.5 mm (Omar, 2026-10-09). The coaster has room only for
# a letter, Z, and the kites for none.
#
#   COASTER               the gBV minimal coaster, as sheets-04g-fit printed it (1)
#   KITE 0.05             ten kites at gap 0.05 (10)
#   MIDDLE 0 … 0.05       one middle piece at each of 0, 0.025 and 0.05, three dots to one (3)
#
# No color here, on purpose: the send picks it (`bambu print send … --color "#RRGGBB"`).
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/sheets-04g-fit2.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

id_code: 4GH
no_id_reasons:
  - &kite "bikar refuses even the one-letter id here (D-114): it needs a flat bed-face patch with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. There is one rung of kites on this plate, so they need no telling apart."

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-coaster.bkr
    params: { size: 112.5, strap: 3.75, height: 4.4, round: 1.25 }
    label:  COASTER
    id:     Z
    id_form: piece
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Kite
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.05 }
    label:  KITE 0.05
    no_id:  *kite
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0, middle_dots: 3 }
    label:  MIDDLE 0
    id:     A
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.025, middle_dots: 2 }
    label:  MIDDLE 0.025
    id:     C
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.05, middle_dots: 1 }
    label:  MIDDLE 0.05
    id:     E
