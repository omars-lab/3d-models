# split-01 — option A: a split gBV coaster whose two halves trap its pieces under a lip
#
# Omar, 2026-10-04, on the split design's call 6 (split-with-studs §11): "i want a olate hat tries
# a and c ... these shoukd be different options in coaster lab". Option A is the lip: each half's
# pocket is 0.8 mm narrower for its first 0.6 mm in from the outer face, so a piece dropped into
# the lower half and closed in by the upper half cannot fall out of either face. The pieces are
# plain prisms 3.2 mm tall, sitting 0.6 mm below each face, under the lips.
# Option C, the flange, is split-02: two plates, because four 112.5 mm halves fill an X2D bed and
# leave no room for pieces.
#
# The coaster is bikar's gBV_JTt3Kxk-split-lip-coaster.bkr at its defaults: size 112.5 (the 1.25x
# coaster sheets-04g printed), strap 3.75, closed height 4.4, cut at half, lip 0.8, gap 0.25 per
# face, studs 2 mm across at least 25 mm apart, for the halves to line up. The ten stars have no
# pieces here and stay open holes, as in the minimal coaster: a star's window moved in by a 0.8 mm
# lip closes up its arms, so it would show no star.
#
# No color here, on purpose. The send picks it: `bambu print send … --color "#RRGGBB"`.
#
#   LOWER    the lower half, cut face up, studs on it (1)
#   UPPER    the upper half, printed face down, sockets on its cut face (1)
#   MIDDLE   the twenty-sided piece in the middle (1)
#   KITE     the small four-sided kites (10)
#   HEX      the inner ring of six-sided pieces (10)
#   OUTER    the outer ring of six-sided pieces (10)
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/split-01.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Lower
    params: { size: 112.5 }
    label:  LOWER
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Upper
    params: { size: 112.5 }
    label:  UPPER
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Middle
    params: { size: 112.5 }
    label:  MIDDLE
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Kite
    params: { size: 112.5 }
    label:  KITE
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Hex
    params: { size: 112.5 }
    label:  HEX
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Outer
    params: { size: 112.5 }
    label:  OUTER
