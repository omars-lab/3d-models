# split-01 — option A: a split gBV coaster whose two halves trap its pieces under a lip
#
# Omar, 2026-10-04, on the split design's call 6 (split-with-studs §11): "i want a olate hat tries
# a and c ... these shoukd be different options in coaster lab". Option A is the lip: each half's
# pocket is 0.8 mm narrower for its first 0.6 mm in from the outer face, so a piece dropped into
# the lower half and closed in by the upper half cannot fall out of either face. The pieces are
# plain prisms 3.2 mm tall, sitting 0.6 mm below each face, under the lips.
# Option C, the flange, is split-02: two plates, because four 112.5 mm halves fill an X2D bed and
# leave no room for pieces.
#
# The coaster is bikar's gBV_JTt3Kxk-split-lip-coaster.bkr at its defaults: size 112.5 (the 1.25x
# coaster sheets-04g printed), strap 3.75, closed height 4.4, cut at half, lip 0.8, gap 0.25 per
# face, studs 2 mm across at least 25 mm apart, for the halves to line up. The ten stars have no
# pieces here and stay open holes, as in the minimal coaster: a star's window moved in by a 0.8 mm
# lip closes up its arms, so it would show no star.
#
# The coaster carries its id, 1, so it can be told from split-02 and every later prototype (Omar,
# 2026-10-06: "every proptoty should have an id"). The cut faces are mostly pocket, so the id goes
# on the lower half's bottom face, mirrored so it reads the right way round there. The coaster
# file's id defaults to 0, no mark; the plate sets it, and at 112.5 the lip takes any id from 1
# to 9.
#
# The carved id (D-109, D-114) goes on each piece's bed face, which is hidden in use. The middle
# piece carries the whole id, SP1/<iteration> M. The lower half's bottom already carries the
# coaster's own 1, and a letter beside it would say nothing more. The hex and outer rings come out
# of bikar as one render of ten pieces, and bikar cuts one id per render, so they carry none until
# it cuts one into each piece. The kites have room for none. The upper half carries none: it
# prints face down, so its bed face is the top.
#
# No color here, on purpose. The send picks it: `bambu print send … --color "#RRGGBB"`.
#
#   LOWER    the lower half, cut face up, studs on it (1)
#   UPPER    the upper half, printed face down, sockets on its cut face (1)
#   MIDDLE   the twenty-sided piece in the middle (1)
#   KITE     the small four-sided kites (10)
#   HEX      the inner ring of six-sided pieces (10)
#   OUTER    the outer ring of six-sided pieces (10)
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/split-01.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

id_code: SP1
no_id_reasons:
  - &lower "Its bottom, the bed face, already carries the coaster's own id mark, 1, cut by the coaster file; a piece letter beside it would say nothing the 1 does not (D-114)."
  - &upper "An upper half prints face down, so its bed face is the top that shows in use, and an id is cut only on a face hidden in use (D-114). It is the only upper half on the plate, and it closes onto the lower half beside it."
  - &kite "bikar refuses even the one-letter id here (D-114): it needs a flat bed-face patch with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. Pieces stay with the coaster they came off the bed beside, from the plate's bed map."
  - &ring "A hex or outer piece comes out of bikar as one ring of ten, and bikar cuts one id per render, so only one of the ten would carry it (D-114); an id that marks one piece in ten is not an id. The ring stays together from the plate's bed map until bikar cuts an id into each piece of a ring."

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Lower
    params: { size: 112.5, id: 1 }
    label:  LOWER
    no_id:  *lower
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Upper
    params: { size: 112.5, id: 1 }
    label:  UPPER
    no_id:  *upper
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Middle
    params: { size: 112.5, id: 1 }
    label:  MIDDLE
    id:     M
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Kite
    params: { size: 112.5, id: 1 }
    label:  KITE
    no_id:  *kite
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Hex
    params: { size: 112.5, id: 1 }
    label:  HEX
    no_id:  *ring
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-split-lip-coaster.bkr
    piece:  Outer
    params: { size: 112.5, id: 1 }
    label:  OUTER
    no_id:  *ring
