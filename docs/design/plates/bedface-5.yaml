    window: 50@13,30
    label:  OVERLAP 75 B
    id:     C
    id_form: piece
    object_settings: { infill_wall_overlap: "75%" }
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-coaster.bkr
