# theme-terracotta-souk-10401 — every piece in PLA Basic Gold (10401) #e4bd68
#
# Written by `bambu plates by-color` from patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr: every group of one color on one plate,
# so each plate prints from one spool (piece colors phase 1). Slice it with `bambu slice compose`.
#
#   MIDDLE  Middle pieces of gBV (1)
#   STAR    Star pieces of gBV (10)
#
# The color is named at the send (`bambu print send --color`), not here (call 18).

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0 }
    label:  MIDDLE
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Star
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0 }
    label:  STAR
