# sheets-04g-fit — the kites and the middle piece at a ladder of gaps, for the coaster already printed
#
# Omar, 2026-10-04, on sheets-04g: "the small kits were too tight ti fit" and "adn the middle
# piece was too lose". Every piece there printed at gap 0. The write-up is
# docs/issues/sheets-04g-fit.md: the middle piece had sharp corners where the strap is round
# (0.45 mm of play at each of its ten inward corners), and the kites had no play anywhere.
#
# bikar now cuts every piece along the strap's real edge, so the gap here is the gap all round.
# This plate tries the two pieces Omar named at several gaps each, to be pressed into the
# sheets-04g coaster he already has and into a fresh one printed beside them: the whole gap comes
# off the piece, so the coaster's holes are the ones these pieces were cut for. It answers the
# open bet CAL-LSE-01.
#
# One render of a ring gives all ten of its pieces, packed in two interlaced rows, so each kite
# rung is ten kites, and each middle rung is one middle piece.
#
# Omar, 2026-10-06, on this plate: "we should re-print minimal consturciton with this to fit in
# again. can we use small dots to distingush (on top of peices (3 dots for biggest, 1 dot for
# smallest, etc?". So the coaster prints again with them, as sheets-04g printed it, and each middle
# piece carries dots in its top, the most on the biggest: four at gap 0, three at 0.05, two at
# 0.1, one at 0.15. A dot is 1 mm across and keeps 0.8 mm of top to the piece's edge (CAL-CST-01).
# The kites carry none: one dot leaves 0.71 mm of top on the biggest kite, under that floor. Until
# the page settles how kites are told apart, each rung's ten come off the bed together and stay
# in their own pile.
#
#   COASTER                 the gBV minimal coaster, as sheets-04g printed it (1)
#   KITE 0.05 … KITE 0.25   ten kites at each of five gaps (50)
#   MIDDLE 0 … MIDDLE 0.15  one middle piece at each of four gaps, four dots to one (4)
#
# No color here, on purpose: the send picks it (`bambu print send … --color "#RRGGBB"`).
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/sheets-04g-fit.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

items:
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-coaster.bkr
    params: { size: 112.5, strap: 3.75, height: 4.4, round: 1.25 }
    label:  COASTER
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Kite
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.05 }
    label:  KITE 0.05
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Kite
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.1 }
    label:  KITE 0.10
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Kite
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.15 }
    label:  KITE 0.15
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Kite
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.2 }
    label:  KITE 0.20
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Kite
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.25 }
    label:  KITE 0.25
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0, middle_dots: 4 }
    label:  MIDDLE 0
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.05, middle_dots: 3 }
    label:  MIDDLE 0.05
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.1, middle_dots: 2 }
    label:  MIDDLE 0.10
  - bkr:    bikar:patterns/Constructions/gBV_JTt3Kxk-minimal-pieces.bkr
    piece:  Middle
    params: { size: 112.5, strap: 3.75, height: 4.4, gap: 0.15, middle_dots: 1 }
    label:  MIDDLE 0.15
