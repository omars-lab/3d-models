# closeout-1 — one small plate for every plate question still open on the flange coaster
#
# Omar, 2026-11-05, after saying he no longer has star-3's pieces: "can we print a combo plate to
# close out all decisions we need?" The which-questions page (2026-11-05) sorted the 24 open
# questions: 18 were overtaken by later plates, and the rest come down to four that need pieces
# in the hand. Its call 7 listed the small plate that answers them from split-10's and star-3's
# slices. This is that plate, with one thing added: a slice of the coaster frame, so the kites can
# be tried without split-07's frame, which may be gone like the rest.
#
# Every piece prints exactly as it printed before, with the same dots on its cut face, so each
# answer reads straight back onto the plate it came from:
#
#   Stars (split-10 question 1, which face stays flat):
#     STAR-STOCK 3 dots, STAR-SUPPORT 1 dot, STAR-SLOPE 2 dots, STAR-WHOLE (the only whole star)
#   The flat star on star-2's pins (star-3, both questions; worth judging only if a flat star wins):
#     FLAT-TRI, the only star in halves with no dots and three pin holes on a triangle
#   star-2's pick, to judge the faces against (Omar, 2026-11-05, asked if stars with a skirt were
#   here, then picked "Add star-2's grid star"):
#     STAR-GRID 1 dot on the bottom, star-2's TRI-12 (sloped, grid supports, three 1.2 mm pins), a group of its
#     own so its supports never run into a neighbour's
#   Middles (split-10 question 3, what "pins of 6" means):
#     MIDDLE-STOCK 1 dot (the centre pin and six round it), MIDDLE-PINS5 2 dots (the centre and four)
#   Kites (split-10 question 4, which gap fits the frame):
#     KITE-STOCK, no dots (0.12 mm a face, as split-07); KITE-G08, 1 dot (0.08 mm); two of each
#   The same kites on a brim (Omar, 2026-11-05: "on small kite (10/11) can we try them with skirt
#   and brim"): KITE-BRIM-12, 1 dot on the bottom (0.12 mm); KITE-BRIM-08, 1 on the cut face and 1 on the bottom (0.08 mm); one of each, in the kites box,
#   and a skirt round the whole plate
#   The frame slice, for the kites: LOWER-36 and UPPER-36, a 36° slice of split-07's two halves
#     (wedge 36 from 9°, the same slice the kites themselves are cut from), so a kite drops into
#     its own pocket and the halves close over it
#
# Left off, and why:
#   - the hexagon and outer pieces: hexfit-2 settled the rail (0.01 mm a side, no rock), 2026-11-05.
#   - MIDDLE-SUPPORT and MIDDLE-SLOPE: Omar called the supported middle best ("this was best"); the
#     open part is only the pin count, which stock and PINS5 answer.
#   - star-3's second flat star: one copy answers whether the pins hold; the second only doubles it.
#   - star-1's question (no base, grid supports or a brim): overtaken by star-2.
#
# Each group is a `group:`, so the slice lays each question's pieces out in a block of its own.
#
# No color here: the send picks it.
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/closeout-1.yaml --plate-type textured_plate --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

id_code: CL1

# One skirt round the whole plate, two lines 2 mm out (Omar, 2026-11-05, picked "Brim kites, plus a
# whole-plate skirt"). It touches no piece: it primes the nozzle, so the first piece starts clean.
skirt: { loops: 2 }

# No ledge_bitten_by_design line: the ledge check found 27 loose pieces and none bitten, so the
# line copied from split-08 at the start claimed a bite this plate does not have.

no_id_reasons:
  - &dots "dots on each half's cut face, hidden once the halves close, exactly as on split-10, so the answer reads back onto split-10's piece: count them. bikar: no carved id fits (a one-letter id needs 3.1 x 3.5 mm of flat face with 0.8 mm to every edge)"
  - &whole "the only whole star: it has no cut face to take dots, and it is the one star that is not in two halves"
  - &flat "the only star in two halves with no dots, and the only one with three pin holes on a triangle. bikar: no carved id fits on a star half"
  - &kitestock "no dots: the only other kite here, KITE-G08, has one dot on each half's cut face"
  - &lower "the frame slice's lower half, the only piece of its shape here; an id is cut only on a face hidden in use (D-114), and this half's bed face is the coaster's face"
  - &upper "the frame slice's upper half, the only piece of its shape here; it prints face down, so its bed face is the top that shows in use (D-114)"

