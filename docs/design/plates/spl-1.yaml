# spl-1 — the split coupon: how tight a stud, how thick a socket floor, does a lip trap a piece
#
# The split design's first plan item (docs/design/pieces/split-with-studs-design.md §9). A split
# coaster is two halves glued at a cut, lined up by studs on the lower half that sit in sockets in
# the upper half. Three things are not known yet, and this plate asks each in the hand before a
# full coaster prints:
#   - which gap between a stud and its socket presses in and holds (the default is 0.05 mm across,
#     the snug rung of CAL-FIT-01, ported from round fit pins and never printed in a split);
#   - whether a socket shows through the 0.6 mm floor over it on the top face;
#   - whether a lip keeps a loose piece in between the two halves (option A, call 6).
#
# Fit pairs: bikar's patterns/Coupons/Split-Fit-Coupon.bkr, a 15 mm square tile 4.4 mm tall cut at
# 2.2, one stud. Lower is the stud half, Upper the socket half, printed face down. The gap is the
# socket's diameter less the stud's; below zero it is a press fit.
#   gap ladder, 2 mm stud, floor 0.6:  -0.10 -0.05 0 0.05 0.10 0.15   (labels G-10 … G15)
#   small stud, 1.5 mm:                0 and 0.05                     (S00, S05)
#   large stud, 3 mm:                  0 and 0.05                     (B00, B05)
#   floor ladder, gap 0.05:            0.8 and 1.0 (0.6 is G05)       (F08, F10)
# Each pair is an L and a U tile with the same label, and the same letter cut into its cut faces
# (Omar, 2026-10-06: "can we have minimal letters printiend on each AT AB (a top, a bottom), BT,
# BB"): the lower tile reads AB, the upper AT, and so on. Fit pairs are A to L in the order below,
# the trap pairs M (room 0) and N (room 0.2). A trap's loose hexagon carries no letter; it stays
# with the tiles it came off the bed beside.
#
# Trap pairs: bikar's patterns/Coupons/Split-Trap-Coupon.bkr, a 25 mm square tile with one hexagon
# trapped under a 0.8 mm lip, at room 0 (a 3.2 mm piece, as tall as its cavity) and room 0.2
# (3.0 mm, which can rattle). The kite pair the design also asks for comes later.
#
# No color here, on purpose. The send picks it: `bambu print send … --color "#RRGGBB"`. The
# show-through check wants the lightest color loaded.
#
# Validate (no hardware; slicing is local):
#   bambu slice compose docs/design/plates/spl-1.yaml --dry-run

bed: x2d
profile:
  settings: "Bambu Lab X2D 0.4 nozzle;0.20mm Standard @BBL X2D"
  filament: "Bambu PLA Basic @BBL X2D 0.4 nozzle"

id_code: SL1
no_id_reasons:
  - &upper "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. Its pair letter, cut into its cut face as <letter>T, tells it apart."
  - &trap_lower "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. Its pair letter, cut into its cut face as MB or NB, tells it apart."
  - &trap_upper "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. Its pair letter, cut into its cut face as MT or NT, tells it apart."
  - &trap_piece "bikar refuses the full id here: it needs a flat bed-face patch of about 10 x 8 mm with 0.8 mm to every edge and 1.2 mm of solid over it, and this piece has none. It stays with the tiles it came off the bed beside."

