<svg xmlns="http://www.w3.org/2000/svg" width="1302" height="410.3" viewBox="0 0 1302 410.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>The small kite: two halves joined by one pin</title>
<rect width="100%" height="100%" fill="#f8f7f4"/>
<text x="20" y="37" font-size="17" font-weight="bold" fill="#222222">The small kite: two halves joined by one pin</text>
<text x="20" y="53.5" font-size="12.5" fill="#555555">Cut through, side view. Gold and teal: the piece. White: air. Solid blue: printed on the bed (first layer). Orange dashed: printed last (top surface). To scale.</text>
<g data-panel="1. Closed, to scale">
<text x="20" y="89.5" font-size="14" font-weight="bold" fill="#222222">1. Closed, to scale</text>
<g transform="translate(117.6,109.5)">
<polygon data-kind="piece" points="35.2,184.8 149.6,184.8 149.6,158.4 35.2,158.4" fill="#3f9189"/>
<line data-mark="first" x1="35.2" y1="184.8" x2="149.6" y2="184.8" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="flange" points="0,158.4 184.8,158.4 184.8,92.4 0,92.4" fill="#3f9189"/>
<polygon data-kind="flange" points="0,92.4 184.8,92.4 184.8,26.4 0,26.4" fill="#dcaa33"/>
<polygon data-kind="piece" points="35.2,26.4 149.6,26.4 149.6,0 35.2,0" fill="#dcaa33"/>
<line data-mark="first" x1="35.2" y1="0" x2="149.6" y2="0" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="socket" points="60.5,92.4 124.3,92.4 124.3,26.4 60.5,26.4" fill="#ffffff"/>
<polygon data-kind="stud" points="66,92.4 118.8,92.4 118.8,44 110,35.2 74.8,35.2 66,44" fill="#3f9189"/>
<line data-kind="seam" x1="0" y1="92.4" x2="184.8" y2="92.4" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="202.4" y1="92.4" x2="202.4" y2="26.4"/>
<line x1="198.4" y1="92.4" x2="206.4" y2="92.4"/>
<line x1="198.4" y1="26.4" x2="206.4" y2="26.4"/>
</g>
<text x="209.4" y="63.4" font-size="11" fill="#444444" text-anchor="start">hole 1.5</text>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="202.4" y1="26.4" x2="202.4" y2="0"/>
<line x1="198.4" y1="26.4" x2="206.4" y2="26.4"/>
<line x1="198.4" y1="0" x2="206.4" y2="0"/>
</g>
<text x="209.4" y="17.2" font-size="11" fill="#444444" text-anchor="start">floor 0.6</text>
</g>
<circle data-label-dot="1" cx="130.8" cy="162.3" r="2.6" fill="#222222"/>
<polyline points="130.8,162.3 103.6,162.3 93.6,162.3" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="166.3" font-size="12" fill="#222222" text-anchor="end">upper half</text>
<circle data-label-dot="1" cx="210" cy="184.3" r="2.6" fill="#222222"/>
<polyline points="210,184.3 103.6,184.3 93.6,184.3" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="188.3" font-size="12" fill="#222222" text-anchor="end">1.2 mm pin</text>
<circle data-label-dot="1" cx="130.8" cy="241.5" r="2.6" fill="#222222"/>
<polyline points="130.8,241.5 103.6,241.5 93.6,241.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="245.5" font-size="12" fill="#222222" text-anchor="end">lower half</text>
<text x="20" y="322.3" font-size="12" fill="#444444">The hole sits wholly over the face block, so it goes through the</text>
<text x="20" y="339.3" font-size="12" fill="#444444">band and keeps the face block as its floor: 0.6 mm, what the</text>
<text x="20" y="356.3" font-size="12" fill="#444444">coaster's own pin holes keep. The pin is 1.3 mm, 0.2 short of the</text>
<text x="20" y="373.3" font-size="12" fill="#444444">hole's floor, so the halves close flat.</text>
</g>
<g data-panel="2. How the two halves print">
<text x="496" y="89.5" font-size="14" font-weight="bold" fill="#222222">2. How the two halves print</text>
<g transform="translate(650.48,109.5)">
<polygon data-kind="piece" points="25.6,108.8 108.8,108.8 108.8,89.6 25.6,89.6" fill="#3f9189"/>
<line data-mark="first" x1="25.6" y1="108.8" x2="108.8" y2="108.8" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="flange" points="0,89.6 134.4,89.6 134.4,41.6 0,41.6" fill="#3f9189"/>
<line data-mark="last" x1="0" y1="41.6" x2="134.4" y2="41.6" stroke="#e27a2a" stroke-width="4" stroke-dasharray="6 4"/>
<polygon data-kind="stud" points="48,41.6 86.4,41.6 86.4,6.4 80,0 54.4,0 48,6.4" fill="#3f9189"/>
<line data-mark="last" x1="48" y1="0" x2="86.4" y2="0" stroke="#e27a2a" stroke-width="4" stroke-dasharray="6 4"/>
<polygon data-kind="piece" points="275.2,108.8 358.4,108.8 358.4,89.6 275.2,89.6" fill="#dcaa33"/>
<line data-mark="first" x1="275.2" y1="108.8" x2="358.4" y2="108.8" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="flange" points="249.6,89.6 384,89.6 384,41.6 249.6,41.6" fill="#dcaa33"/>
<line data-mark="last" x1="249.6" y1="41.6" x2="384" y2="41.6" stroke="#e27a2a" stroke-width="4" stroke-dasharray="6 4"/>
<polygon data-kind="socket" points="293.6,89.6 340,89.6 340,41.6 293.6,41.6" fill="#ffffff"/>
<rect data-kind="bed" x="-6" y="112.8" width="396" height="5" fill="#cfcbc3"/>
<text x="394" y="118.8" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="660.08" cy="176.7" r="2.6" fill="#222222"/>
<polyline points="660.08,176.7 630.48,176.7 620.48,176.7" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="616.48" y="180.7" font-size="12" fill="#222222" text-anchor="end">lower half, pin up</text>
<circle data-label-dot="1" cx="1024.88" cy="176.7" r="2.6" fill="#222222"/>
<polyline points="1024.88,176.7 1115.72,176.7 1125.72,176.7" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1129.72" y="180.7" font-size="12" fill="#222222" text-anchor="start">upper half, turned over</text>
<text x="496" y="257.9" font-size="12" fill="#444444">Both faces print on the bed. The pin's tip and the hole's mouth are last layers, so the bed's squash reaches neither.</text>
<text x="496" y="274.9" font-size="12" fill="#c0392b">Two pins along the long axis only just fit: the band leaves the 1.625 mm of room split-06 gives a 1.2 mm pin only from</text>
<text x="496" y="291.9" font-size="12" fill="#c0392b">about 1.8 mm on one side of the middle to 0.6 mm on the other, 2.4 mm, and two holes need 2.35 mm between centres (the pin,</text>
<text x="496" y="308.9" font-size="12" fill="#c0392b">its gap and a wall). The outer hole would also hang past the face block, so it could only be 0.9 mm deep. One pin has room</text>
<text x="496" y="325.9" font-size="12" fill="#c0392b">to spare.</text>
</g>
</svg>
