<svg xmlns="http://www.w3.org/2000/svg" width="1236.68" height="566.5" viewBox="0 0 1236.68 566.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>The hexagon: two halves joined by a slide, and where the slot runs thin</title>
<rect width="100%" height="100%" fill="#f8f7f4"/>
<text x="20" y="37" font-size="17" font-weight="bold" fill="#222222">The hexagon: two halves joined by a slide, and where the slot runs thin</text>
<text x="20" y="53.5" font-size="12.5" fill="#555555">Cut through, side view. Gold and teal: the piece. White: air. Solid blue: printed on the bed (first layer). Not to scale.</text>
<g data-panel="1. SLD-1's rail: the slot half along the slot, as it prints">
<text x="20" y="89.5" font-size="14" font-weight="bold" fill="#222222">1. SLD-1's rail: the slot half along the slot, as it prints</text>
<g transform="translate(26,107.5)">
<polygon data-kind="piece" points="16,84 304,84 304,60 16,60" fill="#dcaa33"/>
<line data-mark="first" x1="16" y1="84" x2="304" y2="84" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="flange" points="0,60 320,60 320,0 0,0" fill="#dcaa33"/>
<polygon data-kind="air" points="0,40 320,40 320,0 0,0" fill="#ffffff"/>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="8" y1="60" x2="8" y2="40"/>
<line x1="4" y1="60" x2="12" y2="60"/>
<line x1="4" y1="40" x2="12" y2="40"/>
</g>
<text x="15" y="54" font-size="11" fill="#444444" text-anchor="start">0.5 over air</text>
<rect data-kind="bed" x="-6" y="88" width="332" height="5" fill="#cfcbc3"/>
<text x="330" y="94" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="186" cy="127.5" r="2.6" fill="#222222"/>
<polyline points="186,127.5 427.24,127.5 437.24,127.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="441.24" y="131.5" font-size="12" fill="#222222" text-anchor="start">slot 1.0 deep, open at both ends</text>
<circle data-label-dot="1" cx="186" cy="159.5" r="2.6" fill="#222222"/>
<polyline points="186,159.5 427.24,159.5 437.24,159.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="441.24" y="163.5" font-size="12" fill="#222222" text-anchor="start">upper half, face down</text>
<text x="20" y="231.1" font-size="12" fill="#c0392b">Where the slot crosses the band's overhang, at both ends, only 0.5 mm of band is left under it,</text>
<text x="20" y="248.1" font-size="12" fill="#c0392b">printed over air. The coaster keeps at least 0.6 mm under its own pin holes, and that floor sits on</text>
<text x="20" y="265.1" font-size="12" fill="#c0392b">solid layers, not on air, so the rule does not carry over as it is.</text>
</g>
<g data-panel="2. A lower rail: the same view">
<text x="706.76" y="89.5" font-size="14" font-weight="bold" fill="#222222">2. A lower rail: the same view</text>
<g transform="translate(712.76,107.5)">
<polygon data-kind="piece" points="16,84 304,84 304,60 16,60" fill="#dcaa33"/>
<line data-mark="first" x1="16" y1="84" x2="304" y2="84" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="flange" points="0,60 320,60 320,0 0,0" fill="#dcaa33"/>
<polygon data-kind="air" points="0,32 320,32 320,0 0,0" fill="#ffffff"/>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="8" y1="60" x2="8" y2="32"/>
<line x1="4" y1="60" x2="12" y2="60"/>
<line x1="4" y1="32" x2="12" y2="32"/>
</g>
<text x="15" y="50" font-size="11" fill="#444444" text-anchor="start">0.7 over air</text>
<rect data-kind="bed" x="-6" y="88" width="332" height="5" fill="#cfcbc3"/>
<text x="330" y="94" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="872.76" cy="123.5" r="2.6" fill="#222222"/>
<polyline points="872.76,123.5 1114,123.5 1124,123.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1128" y="127.5" font-size="12" fill="#222222" text-anchor="start">slot 0.8 deep</text>
<text x="706.76" y="231.1" font-size="12" fill="#444444">A 0.6 mm rail in a 0.8 mm slot leaves 0.7 mm. The price is a smaller lock: the</text>
<text x="706.76" y="248.1" font-size="12" fill="#444444">rail's top is 0.2 mm a side wider than its root, against 0.3 for SLD-1's.</text>
</g>
<g data-panel="3. SLD-1's rail, closed, across it, to scale">
<text x="20" y="330.1" font-size="14" font-weight="bold" fill="#222222">3. SLD-1's rail, closed, across it, to scale</text>
<g transform="translate(117.6,350.1)">
<polygon data-kind="piece" points="25.6,134.4 358.4,134.4 358.4,115.2 25.6,115.2" fill="#3f9189"/>
<line data-mark="first" x1="25.6" y1="134.4" x2="358.4" y2="134.4" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="flange" points="0,115.2 384,115.2 384,67.2 0,67.2" fill="#3f9189"/>
<polygon data-kind="flange" points="0,67.2 384,67.2 384,19.2 0,19.2" fill="#dcaa33"/>
<polygon data-kind="piece" points="25.6,19.2 358.4,19.2 358.4,0 25.6,0" fill="#dcaa33"/>
<line data-mark="first" x1="25.6" y1="0" x2="358.4" y2="0" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="slot" points="260.8,67.2 260.8,60.8 264,60.8 264,54.4 267.2,54.4 267.2,48 270.4,48 270.4,41.6 270.4,41.6 270.4,35.2 113.6,35.2 113.6,41.6 113.6,41.6 113.6,48 116.8,48 116.8,54.4 120,54.4 120,60.8 123.2,60.8 123.2,67.2" fill="#ffffff"/>
<polygon data-kind="rail" points="256,67.2 256,60.8 259.2,60.8 259.2,54.4 262.4,54.4 262.4,48 265.6,48 265.6,41.6 118.4,41.6 118.4,48 121.6,48 121.6,54.4 124.8,54.4 124.8,60.8 128,60.8 128,67.2" fill="#3f9189"/>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="336" y1="67.2" x2="336" y2="41.6"/>
<line x1="332" y1="67.2" x2="340" y2="67.2"/>
<line x1="332" y1="41.6" x2="340" y2="41.6"/>
</g>
<text x="343" y="58.4" font-size="11" fill="#444444" text-anchor="start">rail 0.8</text>
</g>
<circle data-label-dot="1" cx="130.4" cy="388.5" r="2.6" fill="#222222"/>
<polyline points="130.4,388.5 103.6,388.5 93.6,388.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="392.5" font-size="12" fill="#222222" text-anchor="end">upper half</text>
<circle data-label-dot="1" cx="130.4" cy="446.1" r="2.6" fill="#222222"/>
<polyline points="130.4,446.1 103.6,446.1 93.6,446.1" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="450.1" font-size="12" fill="#222222" text-anchor="end">lower half</text>
<text x="20" y="512.5" font-size="12" fill="#444444">Each face is a first layer. The rail slides in from one end; the pair then cannot lift apart.</text>
</g>
<g data-panel="4. The lower rail, closed, across it, to scale">
<text x="706.76" y="330.1" font-size="14" font-weight="bold" fill="#222222">4. The lower rail, closed, across it, to scale</text>
<g transform="translate(706.76,350.1)">
<polygon data-kind="piece" points="25.6,134.4 358.4,134.4 358.4,115.2 25.6,115.2" fill="#3f9189"/>
<line data-mark="first" x1="25.6" y1="134.4" x2="358.4" y2="134.4" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="flange" points="0,115.2 384,115.2 384,67.2 0,67.2" fill="#3f9189"/>
<polygon data-kind="flange" points="0,67.2 384,67.2 384,19.2 0,19.2" fill="#dcaa33"/>
<polygon data-kind="piece" points="25.6,19.2 358.4,19.2 358.4,0 25.6,0" fill="#dcaa33"/>
<line data-mark="first" x1="25.6" y1="0" x2="358.4" y2="0" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="slot" points="259.2,67.2 259.2,60.8 262.4,60.8 262.4,54.4 265.6,54.4 265.6,48 265.6,48 265.6,41.6 118.4,41.6 118.4,48 118.4,48 118.4,54.4 121.6,54.4 121.6,60.8 124.8,60.8 124.8,67.2" fill="#ffffff"/>
<polygon data-kind="rail" points="256,67.2 256,60.8 259.2,60.8 259.2,54.4 262.4,54.4 262.4,48 121.6,48 121.6,54.4 124.8,54.4 124.8,60.8 128,60.8 128,67.2" fill="#3f9189"/>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="336" y1="67.2" x2="336" y2="48"/>
<line x1="332" y1="67.2" x2="340" y2="67.2"/>
<line x1="332" y1="48" x2="340" y2="48"/>
</g>
<text x="343" y="61.6" font-size="11" fill="#444444" text-anchor="start">rail 0.6</text>
</g>
<text x="706.76" y="512.5" font-size="12" fill="#444444">At 0.10 mm a side the lock is 0.1 mm more than the gap; at 0.20 it would be</text>
<text x="706.76" y="529.5" font-size="12" fill="#444444">none, so that gap is left out for this rail.</text>
</g>
</svg>
