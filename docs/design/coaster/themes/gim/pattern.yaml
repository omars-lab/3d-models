# One line under the pattern's picture.
caption: A six-pointed star rosette, built step by step from a hexagon, drawn after a GeoGebra lesson by Sarah Brewer (mathémartiste).

# Two or three sentences for the product page and the pattern's article.
story: >
  A six-pointed star rosette, built step by step from a hexagon. Interlaced six-fold patterns are
  among the earliest in Islamic art: at the mosque of Ibn Tulun in Cairo, built 876–879, the
  stucco under the arches carries interlacing hexagons, according to Creswell, and Abdullahi and
  Embi count its simple six- and eight-point patterns among the earliest woven ones.

# Facts scholars disagree on, and lines not to print. The story above avoids each one.
contested:
  - No building is known for this rosette. Do not give it one.
  - The Ibn Tulun design is a field of stars and hexagons, not this rosette. Never call the rosette
    itself "one of the oldest Islamic patterns".
  - Which part of Ibn Tulun. The interlace is in the stucco under the arches (Creswell); the few
    original window grilles are compass-drawn circles. Never point the six- and eight-fold line at
    the windows, and never call the original grilles "the simplest".
  - 876–879 is the building's date. Lajin redid some soffits in 1296 (Creswell p. 346, NE. 22), so
    never print "9th-century star patterns at Ibn Tulun" of any one panel.

