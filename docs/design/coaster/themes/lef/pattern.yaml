# One line under the pattern's picture.
caption: Eight-pointed stars, inlaid in colored stone, from a pillar at the tomb of Itimad-ud-Daula, Agra.

# Two or three sentences for the product page and the pattern's article.
story: >
  In Agra in the 1620s, after her father died in 1622, the empress Nur Jahan built a tomb for her
  parents: her father Mirza Ghiyas Beg, called Itimad-ud-Daula, 'Pillar of the Empire', and her
  mother Asmat Begum. It was the first Mughal tomb faced in white marble to carry so much inlaid
  stone on its outside. Eight-pointed stars like these, inlaid in colored stone, decorate a pillar
  there.

# Facts scholars disagree on, and lines not to print. The story above avoids each one.
contested:
  - The same eight-fold pattern is also recorded at the Hakim mosque in Isfahan and the Tillya-Kari
    madrasa in Samarkand (Tiling Search F78). Never say it is found only in Agra.
  - Where on the building. Clévenot's caption says "a pillar"; two photos show it at the foot of the
    corner towers. "At the foot of its corner towers" rests on the photos alone, so say "seen at",
    not "recorded at".
  - Building dates. 1622 is the year Itimad-ud-Daula died; the sources that start the building then
    cite no record of work beginning. Ebba Koch dates the tomb AH 1036–37 (1626–28), and Archnet's
    own Hijri dates begin in late 1625. Most sources give 1628 for the finish; David Wade's catalogue
    gives 1626, and one thesis argues 1629–30. Say "the 1620s" or "finished about 1628"; never "all
    agree". Two inscriptions by the calligrapher Abd al-Nabi are dated AH 1036 (north wall band of
    the upper room) and AH 1037 (with his name, south-west corner tower), per Koch (2001) p. 18 n. 14
    and Asher (1992) p. 130; Stefanovic reads the upper one as AH 1039 (1629–30). Print them as
    dates of those bands, not of the inlay or of any one room. Führer's AH 1027 inscription is
    doubtful (Koch); do not print it. Keep "the 1620s" for the building work, never for the
    inscriptions (AH 1039 is mostly 1630).
  - Its size, any Italian influence on the inlay, the architect's name and "first all-marble
    building". Do not print these.

