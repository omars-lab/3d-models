# docs/research/2026-10-06-naqsh-history-consolidated.md, §3 "What we may print" (lines 1, 2 and 4).
# Add a fact only from that list, with a source someone opened (never a search snippet). Fix
# wording here, never in the storefront's generated file. The store shows a history name only when
# this record has at least one source.
#
# lEf has no color themes yet, so no product reads this record; it is here so the storefront's
# name table can draft its name next to gBV's (both come from the same tomb; the fold tells them
# apart).
#
# The tie to the tomb is a photo (Wade IND 0414), a catalogue entry (Wichmann F78) and Hankin's 1925
# drawing, Plate III, Fig. 21 (storefront seven-eras check, design question 13). Hankin's figure
# and Wade's photo were matched to our drawing by eye: eight-pointed stars inside large octagons on
# a square repeat, the same family, not compared line for line. Hankin was a bacteriologist in
# India, not a botanist. Wade IND 0422 and 0423 may show it too; they stay a lead, not a source.
#
# The dates follow the storefront Agra and Isfahan dates check
# (docs/research/2026-10-07-agra-isfahan-dates-consolidated.md, table R). 1622 is the year
# Itimad-ud-Daula died, not a record of building starting, and the finish is not agreed (Wade gives
# 1626, one thesis 1629–30). So the era says "the 1620s".

