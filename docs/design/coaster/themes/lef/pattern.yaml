found_at: Tomb of Itimad-ud-Daula, Agra, India
era: Mughal, 1622–1628

# One line under the pattern's picture.
caption: Eight-pointed stars, inlaid in colored stone, from a pillar at the tomb of Itimad-ud-Daula, Agra.

# Two or three sentences for the product page and the pattern's article.
story: >
  In Agra, between 1622 and 1628, the empress Nur Jahan built a tomb for her parents: her father
  Mirza Ghiyas Beg, called Itimad-ud-Daula, 'Pillar of the Empire', and her mother Asmat Begum. It
  was the first Mughal tomb faced in white marble to carry so much inlaid stone on its outside.
  Eight-pointed stars like these, inlaid in colored stone, decorate a pillar there.

# Facts scholars disagree on, and lines not to print. The story above avoids each one.
contested:
  - The same eight-fold pattern is also recorded at the Hakim mosque in Isfahan and the Tillya-Kari
    madrasa in Samarkand (Tiling Search F78). Never say it is found only in Agra.
  - Where on the building. Clévenot's caption says "a pillar"; two photos show it at the foot of the
    corner towers. "At the foot of its corner towers" rests on the photos alone, so say "seen at",
    not "recorded at".
  - Building start. Most sources say 1622; Archnet's Hijri dates work out to about 1625. All agree it
    was finished in 1628.
  - Its size, any Italian influence on the inlay, the architect's name and "first all-marble
    building". Do not print these.

