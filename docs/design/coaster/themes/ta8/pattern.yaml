  - title: Jay Bonner and Marc Pelletier, "A 7-Fold System for Creating Islamic Geometric Patterns Part 1, Historical Antecedents", Bridges 2012
    url: https://archive.bridgesmathart.org/2012/bridges2012-141.pdf
    supports: [story]
  - title: Y. Abdullahi and M. R. Embi, "Evolution of Islamic geometric patterns", Frontiers of Architectural Research 2 (2013)
    url: https://www.scipedia.com/public/Abdullahi_Bin-Embi_2013a
