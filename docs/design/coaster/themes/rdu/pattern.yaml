# One line under the pattern's picture.
caption: An eight-pointed star in a square tile, framed by octagons, drawn after a GeoGebra lesson by Sarah Brewer.

# Two or three sentences for the product page and the pattern's article.
story: >
  Interlaced eight-pointed stars are among the earliest star patterns in Islamic art: at the mosque
  of Ibn Tulun in Cairo, built 876–879, the stucco under the arches carries a star of two crossed
  squares, according to Creswell, and Abdullahi and Embi count its simple six- and eight-point
  patterns among the earliest woven ones. Brian Wichmann calls
  eight-pointed stars with octagons one of the commonest Islamic patterns, found from Spain and
  Morocco to India.

# Facts scholars disagree on, and lines not to print. The story above avoids each one.
contested:
  - No building is known for this tile. Do not give it one, and do not say it is the same as any
    one plate in a pattern book. It is close to one, but nobody has shown the proportions match.
  - The family's first dated example. A 12th-century Iranian date rests on a book nobody here has
    opened; print the Ibn Tulun line instead.
  - Which part of Ibn Tulun. The interlace is in the stucco under the arches (Creswell); the few
    original window grilles are compass-drawn circles. Never point the six- and eight-fold line at
    the windows, and never call the original grilles "the simplest".
  - 876–879 is the building's date. Lajin redid some soffits in 1296 (Creswell p. 346, NE. 22), so
    never print "9th-century star patterns at Ibn Tulun" of any one panel, nor "the first
    eight-pointed stars".

