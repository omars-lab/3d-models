# Where the jlT pattern (CS-14) comes from, for the storefront's pattern record (Naqsh's `pattern`
# metaobject, written by coffee-house-storefront's sync-theme-designs skill).
#
# Every line here is one the history research cleared for print: coffee-house-storefront
# docs/research/2026-10-06-nine-coasters-consolidated.md, §10 "What we may print", CS-14
# (lines 1, 2, 3 and 6). Add a fact only from that list, with a source someone opened (never a
# search snippet). Fix wording here, never in the storefront's generated file. The store shows a
# history name only when this record has at least one source.
#
# The building rests on a catalogue: Wichmann's Tiling Search records Bourgoin's plate 170 on a
# carved stone panel in the Qijmas mosque, after a Creswell photo too small to count the stars. No
# open photo of the panel exists. So the record says "recorded", and gives no era: 1479–1481 is the
# building's date, not proof the panel is the same design.
#
# "Plate 170" is the 1879 numbering (storefront seven-eras check, design question 15). In the Getty
# Research Institute's scan of the 1879 Firmin-Didot portfolio on archive.org (gri_33125012261786,
# scan leaf n388), the number 170 is printed on the plate itself. The plate shows seven-pointed
# stars round octagons on a square plan, and Bourgoin's text for "Pl. 170" (VIIe série, famille
# heptagonale) describes the same construction: a square plan whose central line is turned a
# seventh of a right angle, ending in a seven-pointed star. Checked by eye against our drawing and
# Wichmann's P170, not line for line. The Dover reprint (1973) was not opened, so do not cite its
# plate number.

construction: jlTmt_279M4
short: jlT
fold: 7
