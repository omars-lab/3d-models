history_name: ""

found_at: Amir Qijmas al-Ishaqi Mosque, Cairo, Egypt

# One line under the pattern's picture.
caption: Seven-pointed stars round an octagon, on a square tile turned a seventh of a right angle, after plate 170 of Jules Bourgoin's 1879 book.

# Two or three sentences for the product page and the pattern's article.
story: >
  Our drawing follows plate 170 of Jules Bourgoin's Les éléments de l'art arabe (1879), as analysed
  by the channel unravelling pattern. Brian Wichmann's Tiling Search records the same design on a
  carved stone panel at the springing of an iwan arch in the mosque of Amir Qijmas al-Ishaqi in
  Cairo, built 1479–1481. Seven does not divide a circle by ruler and compass, so this pattern can
  only be drawn by approximation.

# Facts scholars disagree on, and lines not to print. The story above avoids each one.
contested:
  - Whether the panel is the same design, and whether it is still there. It is known from
    Wichmann's record and one archive photo too small to count the stars. Say "recorded at", never
    "on the mosque" or "seen at" as our own fact.
  - Baghdad. Wichmann also records the design at the Mirjaniyya madrasa (1357), after Jay Bonner,
    whose book nobody here has opened. Print it only as his record. Never say it survives there,
    and give no craft or place on that building.
  - The archive photo of the Cairo panel (Creswell Archive), the Tiling Search drawing
    (non-commercial licence) and David Wade's scan of the plate are not ours to show.

