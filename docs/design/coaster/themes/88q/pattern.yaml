# A teaching rosette: its maker names no building, so there is no found_at and no era. The Qijmas
# minbar is a relative with an open-licence photo, not where this rosette comes from. The video
# title says "4 Fold"; the rosette has sixteen petals, so the fold is 16.

construction: 88q-u2eWZqg
short: 88q
fold: 16

# The name the shop uses for the pattern: its fold and shape, with "star rosette" only where the
# drawing meets that class's rules (Omar, 2026-10-08; storefront DESIGN.md "Pattern names" and
# docs/research/2026-10-08-pattern-family-names-consolidated.md). It leads the product title.
history_name: "Sixteen-Petal Rosette"

# One line under the pattern's picture.
caption: Sixteen petals from two octagons, drawn as one unbroken line, after a lesson by Eman Zainab.

# Two or three sentences for the product page and the pattern's article.
story: >
  Sixteen-pointed stars adorn the dome of the Hasan Sadaqah mausoleum in Cairo by 1321, according
  to Abdullahi and Embi. On the inlaid wooden minbar of the Qijmas al-Ishaqi mosque in Cairo,
  finished 1480–1481, sixteen-pointed stars grow from round bosses.

# Facts scholars disagree on, and lines not to print. The story above avoids each one.
contested:
  - Its fold. It is a sixteen-fold rosette (storefront seven-eras check). The video title says
    "4 Fold"; quote that only as the video's title. Never "four-fold" or "4-fold" in our own words.
  - No building is known for this rosette. The Cairo lines are its family; never "from" the Qijmas
    minbar or any other building.
  - The family's first dated example. An earlier Cairo date rests on a book nobody here has opened;
    print "by 1321". Bonner's 1211 Imam al-Shafi'i design, seen in snippets only, has
    sixteen-pointed stars, so never "first" and never "simple stars came first" (storefront
    lead-sources check, 2026-10-08).

