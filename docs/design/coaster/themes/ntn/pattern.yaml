# Where the Ntn pattern (CS-15) comes from, for the storefront's pattern record (Naqsh's `pattern`
# metaobject, written by coffee-house-storefront's sync-theme-designs skill).
#
# Every line here is one the history research cleared for print: coffee-house-storefront
# docs/research/2026-10-06-coaster-monuments-consolidated.md, §4 "What we may print", CS-15
# (lines 2, 3, 4 and 6). Add a fact only from that list, with a source someone opened (never a
# search snippet). Fix wording here, never in the storefront's generated file. The store shows a
# history name only when this record has at least one source.
#
# The star rests on its maker's word alone: Samira Mian attributes it to the Mustansiriya, and no
# photo or catalogue shows this star on the building. So the record says "after", and gives no era:
# the building's dates are in the story, as the building's, not the pattern's.
#
# Rechecked 2026-10-07 (storefront seven-eras check, design question 13): all four sources were
# opened, looking for a photo or catalogue entry. None shows this star. Khalil's gate photo shows a
# carved-brick tympanum with a different, irregular field of interlaced stars and polygons; his
# other photo is the information sign, text only; the Wikipedia article's door photos are too small
# to make out any star. So the tie stays the maker's word only.
#
# Rechecked 2026-10-07 (storefront docs/research/2026-10-07-dates-to-scholars-consolidated.md): the
# video's description was read in a browser and shows no photo of the building; all 43 photos in
# Commons' "Mustansiriyya Madrasa" category were looked at, and none shows this single star (ten-
# pointed stars appear only inside repeating fields). The story's dates now follow the Baghdad
# chronicles: work began AH 625 (1227–28), opened 5 Rajab 631 (6 April 1234).

