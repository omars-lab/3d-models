history_name: ""

found_at: Mustansiriya Madrasa, Baghdad, Iraq

# One line under the pattern's picture.
caption: A single ten-pointed star, drawn as one interlaced band, after a drawing Samira Mian attributes to the Mustansiriya in Baghdad.

# Two or three sentences for the product page and the pattern's article.
story: >
  Our ten-fold star follows a drawing by the artist Samira Mian, who attributes it to the
  Mustansiriya in Baghdad. The Abbasid caliph al-Mustansir ordered the madrasa built; work began in
  1227–28, and it opened in 1234; it is one of the few surviving landmarks of Abbasid Baghdad. Its
  façade is decorated in carved brick, and its main entrance carries star and polygon figures.

# Facts scholars disagree on, and lines not to print. The story above avoids each one.
contested:
  - Whether this exact star is on the building. Only the tutorial's maker says so; no photo or
    catalogue shows it. Say "after a drawing … attributed to", never "on the walls" or "from the
    Mustansiriya walls", and never a place on the building (gate, façade, courtyard).
  - Stone or brick. The video says "stone walls"; the building's decoration is carved brick. Never
    "carved in stone".
  - Girih tiles. Lu and Steinhardt (2007) redraw one of its spandrels with girih tiles; whether the
    craftsmen worked that way is argued. Say "can be redrawn with girih tiles", never "made with".
  - Opening year. 1233 in Wikipedia, Ma'ruf and Islam Online is AH 631 written as the year it
    began; the opening was 5 Rajab 631, 6 April 1234. The inscriptions' 630 is when the caliph
    ordered it, not its finish. Print no weekday (the chronicles disagree).
  - Do not print "the oldest university", "survived the Mongol sack" without saying parts were
    devastated and later restored, or any day-level date.

