#
# The tie to the tomb is a photo plus a catalogue entry (storefront seven-eras check, design
# question 13): Brian Wichmann's Tiling Search P48 catalogues the pattern from David Wade's photo IND
# 0415, which shows ten-pointed rosettes ringed by gold five-pointed stars. A second, openly licensed
