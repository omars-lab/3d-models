#
# Every line here is one the history research cleared for print: coffee-house-storefront
# docs/research/2026-10-06-naqsh-history-consolidated.md, §3 "What we may print". Add a fact only
# from that list, with a source someone opened (never a search snippet). Fix wording here, never in
# the storefront's generated file. The store shows a history name only when this record has at
# least one source.
#
# The tie to the tomb is a photo plus a catalogue entry (storefront seven-eras check, design
# question 13): Brian Wichmann's Tiling Search P48 catalogues the pattern from David Wade's photo IND
# 0415, which shows ten-pointed rosettes ringed by gold five-pointed stars. A second, openly licensed
# photo on Wikimedia Commons (Royroydeb, own work, 2014-10-13, CC BY-SA 4.0) shows the same layout
# on the tomb wall. Both photos were matched to our drawing by eye: the same family, not compared
# line for line.
#
# The dates follow the storefront Agra and Isfahan dates check
# (docs/research/2026-10-07-agra-isfahan-dates-consolidated.md, table R). 1622 is the year
# Itimad-ud-Daula died, not a record of building starting, and the finish is not agreed (Wade gives
# 1626, one thesis 1629–30). So the era says "the 1620s" and the caption "finished about 1628".

