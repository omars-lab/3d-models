<!doctype html>
<!-- Source of one-piece.png for finish-techniques-brainstorm.md §1.4. Regenerate with headless Chrome:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
       --hide-scrollbars --window-size=1000,470 --screenshot=one-piece.png one-piece.html
     A schematic, not to scale: the gaps and the air are drawn wide so they show. Same look as split-pieces.html. -->
<html>
<head>
<meta charset="utf-8">
<title>Printed in place, joined as one</title>
<style>
  body { margin: 0; background: #fbfaf7; font: 14px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #2b2b2b; }
  h1 { font-size: 17px; margin: 14px 20px 2px; }
  p.sub { margin: 0 20px 6px; color: #666; font-size: 12.5px; }
  .lower { fill: #8d8a84; }
  .upper { fill: #aaa59c; }
  .piece { fill: #d9a931; }
  .piece2 { fill: #3f8f8a; }
  .ghost { fill: #3f8f8a; opacity: 0.35; }
  .peg { fill: #5a3d8a; }
  .bed { stroke: #2a6fdb; stroke-width: 4; }
  .seam { stroke: #fbfaf7; stroke-width: 1.6; stroke-dasharray: 3 3; }
  .arrow { stroke: #b0302a; stroke-width: 1.6; fill: none; }
  .head { font-size: 15px; font-weight: 700; }
  .note { font-size: 12px; fill: #555; }
  .warn { font-size: 12px; fill: #b0302a; }
  .good { font-size: 12px; fill: #2c7a3f; }
  .lbl { font-size: 11px; fill: #b0302a; }
</style>
</head>
<body>
<h1>Way c: keep each piece half in its own coaster half, then join the two as one</h1>
<p class="sub">Cut through, side view of one piece. Dark grey: lower coaster half. Light grey: upper. Gold and teal: the two piece halves. Solid blue: printed on the bed. Not to scale.</p>
<svg id="s" width="1000" height="380" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const s = document.getElementById('s');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, t) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (t) e.textContent = t;
  s.appendChild(e); return e;
}
const text = (x, y, t, cls) => el('text', { x, y, class: cls });
const textT = (x, y, t, cls) => { const e = text(x, y, t, cls); e.textContent = t; return e; };
const line = (x1, y1, x2, y2, cls) => el('line', { x1, y1, x2, y2, class: cls });

// One coaster half around one hole. u is the distance in from the face: 0 at the face, 88 at the cut.
// The face neck is u 0-24, then the band's room; a pocket adds a neck at the cut too (u 64-88).
// Straps: x..x+50 and x+210..x+260. Necks reach 20 in. Piece body x+78..x+182, band x+58..x+202.
function half(x, yFace, dir, cc, pc, o) {
  o = o || {};
  const dy = o.drop || 0;
  const R = (x1, x2, u1, u2, cls) => {
    const ya = yFace + dir * u1, yb = yFace + dir * u2;
    const y0 = Math.min(ya, yb);
    el('rect', { x: x + x1, y: y0, width: x2 - x1, height: Math.abs(yb - ya), class: cls });
  };
  const P = (x1, x2, u1, u2, cls) => {
    const ya = yFace + dir * u1 + dy, yb = yFace + dir * u2 + dy;
    el('rect', { x: x + x1, y: Math.min(ya, yb), width: x2 - x1, height: Math.abs(yb - ya), class: cls });
  };
  R(0, 50, 0, 88, cc); R(210, 260, 0, 88, cc);
  R(50, 70, 0, 24, cc); R(190, 210, 0, 24, cc);
  if (o.pocket) { R(50, 70, 64, 88, cc); R(190, 210, 64, 88, cc); }
  P(78, 182, 0, 88, pc);
  if (o.pocket) P(58, 202, 32, 56, pc); else P(58, 202, 32, 88, pc);
  if (o.bed) { line(x, yFace, x + 70, yFace, 'bed'); line(x + 190, yFace, x + 260, yFace, 'bed');
               line(x + 78, yFace + dy, x + 182, yFace + dy, 'bed'); }
}

const notes = (x, ls) => ls.forEach((n, i) => textT(x, 318 + i * 16, n[0], n[1] || 'note'));

// 1. The flaw: the upper half turned over, cut side down, and its piece half falls out.
{ const x = 30;
  textT(x, 22, '1. As first drawn: it falls out', 'head');
  half(x, 70, 1, 'upper', 'piece2', { drop: 70 });
  line(x + 130, 120, x + 130, 196, 'arrow');
  line(x + 123, 189, x + 130, 196, 'arrow'); line(x + 137, 189, x + 130, 196, 'arrow');
  notes(x, [['The upper half is turned over to close the coaster.'],
            ['Its face holds the band, but the cut side is open,'],
            ['so the piece half drops out before it can be closed.', 'warn']]);
}
// 2. The fix: a pocket, the band caught on both sides, air above and below it.
{ const x = 360;
  textT(x, 22, '2. A pocket: caught on both sides', 'head');
  half(x, 230, -1, 'upper', 'piece2', { pocket: true, bed: true });
  textT(x + 263, 206, '\u2190 air', 'lbl'); textT(x + 263, 172, '\u2190 air', 'lbl');
  notes(x, [['A narrow neck at the cut as well as at the face.'],
            ['Each piece half is captive in its own coaster half,'],
            ['so nothing falls out.'], ['It needs air above and below the band.', 'warn']]);
}
// 3. Closed: the halves meet at the cut, a peg (or a drop of glue) makes them one.
{ const x = 690;
  textT(x, 22, '3. Closed, joined by a peg or glue', 'head');
  half(x, 290, -1, 'lower', 'piece2', { pocket: true, bed: true });
  half(x, 114, 1, 'upper', 'piece', { pocket: true, bed: true });
  line(x + 78, 202, x + 182, 202, 'seam');
  el('rect', { x: x + 122, y: 188, width: 16, height: 28, class: 'peg' });
  notes(x, [['The two halves meet at the cut, both faces on the bed.'],
            ['A peg lines them up; a drop of glue makes them one.', 'good'],
            ['Lifted, the pair can still shift by the air gap.']]);
}
</script>
</body>
</html>
