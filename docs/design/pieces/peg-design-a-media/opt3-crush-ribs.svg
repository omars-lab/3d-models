<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="920" height="470" fill="#f7f5f1"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#222">Option 3: crush ribs on the stud, in a loose socket</text>
  <text x="30" y="60" font-size="13" fill="#555">Left: from above, 50 px per mm. Right: the stud from the side, 60 px per mm. Rib heights drawn a little large so they show.</text>

  <text x="150" y="122" font-size="15" font-weight="600" fill="#222">From above</text>
  <rect x="150" y="150" width="200" height="200" fill="#b3ada6"/>
  <circle cx="250" cy="250" r="58.75" fill="#ffffff"/>
  <circle cx="250" cy="250" r="50" fill="#8d8780"/>
  <g fill="#8d8780">
    <circle cx="250" cy="197" r="9"/>
    <circle cx="295.9" cy="276.5" r="9"/>
    <circle cx="204.1" cy="276.5" r="9"/>
  </g>
  <g fill="#c0392b">
    <circle cx="250" cy="190.5" r="4"/>
    <circle cx="301.5" cy="279.8" r="4"/>
    <circle cx="198.5" cy="279.8" r="4"/>
  </g>
  <line x1="250" y1="190" x2="380" y2="160" stroke="#333" stroke-width="1"/>
  <text x="384" y="156" font-size="13" fill="#c0392b">three ribs, each</text>
  <text x="384" y="172" font-size="13" fill="#c0392b">the only thing that touches</text>
  <line x1="300" y1="222" x2="380" y2="232" stroke="#333" stroke-width="1"/>
  <text x="384" y="236" font-size="13" fill="#222">socket drawn loose</text>
  <text x="384" y="252" font-size="13" fill="#222">(spl-2's best gap + 0.10)</text>

  <text x="600" y="122" font-size="15" font-weight="600" fill="#222">The stud from the side</text>
  <rect x="560" y="290" width="240" height="30" fill="#8d8780"/>
  <polygon points="620,290 620,218 632,206 728,206 740,218 740,290" fill="#8d8780"/>
  <rect x="656" y="212" width="48" height="78" fill="#a19b94" stroke="#555" stroke-width="1"/>
  <line x1="704" y1="250" x2="800" y2="230" stroke="#333" stroke-width="1"/>
  <text x="760" y="198" font-size="13" fill="#222">rib 0.8 mm wide,</text>
  <text x="760" y="214" font-size="13" fill="#222">running the stud's height</text>
  <line x1="656" y1="300" x2="704" y2="300" stroke="#222" stroke-width="1"/>
  <line x1="656" y1="294" x2="656" y2="306" stroke="#222" stroke-width="1"/>
  <line x1="704" y1="294" x2="704" y2="306" stroke="#222" stroke-width="1"/>
  <text x="560" y="350" font-size="13" fill="#222">0.8 mm is the narrowest rib that prints as a</text>
  <text x="560" y="368" font-size="13" fill="#222">rib at a 0.4 mm nozzle (Lego Lab's rule); three</text>
  <text x="560" y="386" font-size="13" fill="#222">fit round a 2 mm stud with room between.</text>

  <text x="150" y="390" font-size="13" fill="#222">The ribs crush; the socket wall and the</text>
  <text x="150" y="408" font-size="13" fill="#222">stud's core do not. Grip comes from three</text>
  <text x="150" y="426" font-size="13" fill="#222">small lobes, not the whole ring.</text>
</svg>
