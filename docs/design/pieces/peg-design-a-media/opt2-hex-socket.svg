<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="920" height="470" fill="#f7f5f1"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#222">Option 2: a hexagon socket for the round stud</text>
  <text x="30" y="60" font-size="13" fill="#555">Seen from above, looking down the socket, to scale (50 px per mm). Light gray: upper half. White: air. Dark gray: the stud. Red: where they touch.</text>

  <text x="130" y="122" font-size="15" font-weight="600" fill="#222">Round socket today</text>
  <rect x="130" y="150" width="200" height="200" fill="#b3ada6"/>
  <circle cx="230" cy="250" r="56.25" fill="#ffffff"/>
  <circle cx="230" cy="250" r="50" fill="#8d8780"/>
  <circle cx="230" cy="250" r="53" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="130" y="380" font-size="13" fill="#222">Tight anywhere round the ring: a ring can only</text>
  <text x="130" y="398" font-size="13" fill="#222">give by stretching, and the seam bump and any</text>
  <text x="130" y="416" font-size="13" fill="#222">excess plastic have nowhere to go.</text>

  <text x="550" y="122" font-size="15" font-weight="600" fill="#222">Hexagon socket</text>
  <rect x="550" y="150" width="200" height="200" fill="#b3ada6"/>
  <polygon points="707.7,250 678.87,300 621.13,300 592.3,250 621.13,200 678.87,200" fill="#ffffff"/>
  <circle cx="650" cy="250" r="50" fill="#8d8780"/>
  <g fill="#c0392b">
    <circle cx="693.3" cy="275" r="4"/><circle cx="650" cy="300" r="4"/><circle cx="606.7" cy="275" r="4"/>
    <circle cx="606.7" cy="225" r="4"/><circle cx="650" cy="200" r="4"/><circle cx="693.3" cy="225" r="4"/>
  </g>
  <line x1="702" y1="250" x2="713" y2="250" stroke="#e07a1f" stroke-width="4"/>
  <line x1="710" y1="250" x2="764" y2="210" stroke="#333" stroke-width="1"/>
  <text x="770" y="205" font-size="13" fill="#e07a1f">seam in a corner</text>
  <line x1="650" y1="200" x2="764" y2="170" stroke="#333" stroke-width="1"/>
  <text x="770" y="150" font-size="13" fill="#c0392b">six lines of contact,</text>
  <text x="770" y="166" font-size="13" fill="#c0392b">one on each flat</text>
  <line x1="690" y1="292" x2="764" y2="326" stroke="#333" stroke-width="1"/>
  <text x="770" y="336" font-size="13" fill="#222">six corners of air</text>
  <text x="550" y="380" font-size="13" fill="#222">Drawn with the flats just touching the stud. The flats</text>
  <text x="550" y="398" font-size="13" fill="#222">bend a little; the corners take the seam and any spare</text>
  <text x="550" y="416" font-size="13" fill="#222">plastic. The flat-to-flat size has to be found by printing.</text>
</svg>
