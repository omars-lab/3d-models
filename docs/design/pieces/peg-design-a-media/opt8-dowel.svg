<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="920" height="500" fill="#f7f5f1"/>
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#222">Option 8: a separate dowel printed lying down, against today's stud</text>
  <text x="30" y="60" font-size="13" fill="#555">Cut through, side view, closed, 40 px per mm. Thin lines inside each pin: the layers it was printed in.</text>

  <text x="60" y="110" font-size="15" font-weight="600" fill="#222">Today: a stud grown on the lower half</text>
  <rect x="60" y="212" width="320" height="88" fill="#b3ada6"/>
  <rect x="175" y="236" width="90" height="64" fill="#ffffff"/>
  <rect x="60" y="300" width="320" height="88" fill="#8d8780"/>
  <rect x="180" y="244" width="80" height="56" fill="#8d8780"/>
  <g stroke="#5a5550" stroke-width="1">
    <line x1="180" y1="292" x2="260" y2="292"/><line x1="180" y1="284" x2="260" y2="284"/>
    <line x1="180" y1="276" x2="260" y2="276"/><line x1="180" y1="268" x2="260" y2="268"/>
    <line x1="180" y1="260" x2="260" y2="260"/><line x1="180" y1="252" x2="260" y2="252"/>
  </g>
  <line x1="60" y1="300" x2="175" y2="300" stroke="#fff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="265" y1="300" x2="380" y2="300" stroke="#fff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="120" y1="268" x2="176" y2="268" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="60" y="150" font-size="13" fill="#222">Layers run across the stud. A sideways</text>
  <text x="60" y="168" font-size="13" fill="#222">push (red) only has to split one layer</text>
  <text x="60" y="186" font-size="13" fill="#222">line, the weak way.</text>
  <text x="60" y="420" font-size="13" fill="#222">One part. Both halves come off the bed ready.</text>
  <text x="60" y="438" font-size="13" fill="#222">The stud's root is where the first layers of</text>
  <text x="60" y="456" font-size="13" fill="#222">the stud meet the cut face's top skin.</text>

  <text x="500" y="110" font-size="15" font-weight="600" fill="#222">A dowel in two sockets</text>
  <rect x="500" y="212" width="320" height="88" fill="#b3ada6"/>
  <rect x="615" y="240" width="90" height="60" fill="#ffffff"/>
  <rect x="500" y="300" width="320" height="88" fill="#8d8780"/>
  <rect x="615" y="300" width="90" height="60" fill="#ffffff"/>
  <rect x="620" y="244" width="80" height="112" fill="#d9a520"/>
  <g stroke="#9c7614" stroke-width="1">
    <line x1="628" y1="244" x2="628" y2="356"/><line x1="636" y1="244" x2="636" y2="356"/>
    <line x1="644" y1="244" x2="644" y2="356"/><line x1="652" y1="244" x2="652" y2="356"/>
    <line x1="660" y1="244" x2="660" y2="356"/><line x1="668" y1="244" x2="668" y2="356"/>
    <line x1="676" y1="244" x2="676" y2="356"/><line x1="684" y1="244" x2="684" y2="356"/>
    <line x1="692" y1="244" x2="692" y2="356"/>
  </g>
  <line x1="500" y1="300" x2="615" y2="300" stroke="#fff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="705" y1="300" x2="820" y2="300" stroke="#fff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="560" y1="300" x2="616" y2="300" stroke="#c0392b" stroke-width="2.5" marker-end="url(#r)"/>
  <text x="500" y="150" font-size="13" fill="#222">Printed lying down, so its layers run along</text>
  <text x="500" y="168" font-size="13" fill="#222">its length; a sideways push crosses every</text>
  <text x="500" y="186" font-size="13" fill="#222">line. Gold: the third part.</text>
  <text x="500" y="420" font-size="13" fill="#222">A third part to print, count and press in, and a</text>
  <text x="500" y="438" font-size="13" fill="#222">second fit to get right. A round pin printed lying</text>
  <text x="500" y="456" font-size="13" fill="#222">down needs a flat side to sit on (BOSL2 does this).</text>
</svg>
