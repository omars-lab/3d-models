<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="920" height="470" fill="#f7f5f1"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#222">Option 4: a split stud</text>
  <text x="30" y="60" font-size="13" fill="#555">Left: from above, 50 px per mm. Right: cut through the slot from the side, 60 px per mm. Dark gray: lower half and stud. Dashed: the socket wall.</text>

  <text x="150" y="122" font-size="15" font-weight="600" fill="#222">From above</text>
  <rect x="150" y="150" width="200" height="200" fill="#8d8780" opacity="0.35"/>
  <circle cx="250" cy="250" r="50" fill="#8d8780"/>
  <rect x="200" y="240" width="100" height="20" fill="#ffffff"/>
  <line x1="300" y1="250" x2="380" y2="230" stroke="#333" stroke-width="1"/>
  <text x="384" y="226" font-size="13" fill="#222">0.4 mm slot, one line wide,</text>
  <text x="384" y="242" font-size="13" fill="#222">leaves two halves 0.8 mm thick</text>

  <text x="560" y="122" font-size="15" font-weight="600" fill="#222">From the side, going in</text>
  <rect x="540" y="290" width="280" height="40" fill="#8d8780"/>
  <polygon points="620,290 620,218 632,206 668,206 668,266 692,266 692,206 728,206 740,218 740,290" fill="#8d8780"/>
  <line x1="623" y1="150" x2="623" y2="290" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="737" y1="150" x2="737" y2="290" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M 600 230 L 640 230" stroke="#c0392b" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M 760 230 L 720 230" stroke="#c0392b" stroke-width="2.5" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
  <text x="760" y="178" font-size="13" fill="#c0392b">the socket squeezes</text>
  <text x="760" y="194" font-size="13" fill="#c0392b">the two halves together</text>
  <line x1="692" y1="262" x2="756" y2="262" stroke="#333" stroke-width="1"/>
  <text x="760" y="266" font-size="13" fill="#222">slot 1.0 mm deep</text>
  <text x="540" y="360" font-size="13" fill="#222">Drawn tighter than the stud, like spl-1's -0.10 mm</text>
  <text x="540" y="378" font-size="13" fill="#222">rung. The two halves bend in, so the force stays</text>
  <text x="540" y="396" font-size="13" fill="#222">small. They are built up in layers, the weak way</text>
  <text x="540" y="414" font-size="13" fill="#222">to bend: do they bend, or snap off?</text>
</svg>
