# Option E of peg-design-b: a 3 mm stud with a slot down its middle, so its two halves flex in.
# Drawn by the draw-side-view skill:
#   python3 .claude/skills/draw-side-view/scripts/side_view.py draw <this file>
# Stud 3.0 mm, 1.4 mm tall, slot 0.5 mm wide and 1.0 mm deep; socket 1.6 mm deep, drawn 0.1 mm
# smaller than the stud across the diameter, the squeeze the slot is meant to take up.
title: "Option E: a 3 mm stud split by a slot, so its two prongs bend in"
panels:
  - title: "1. Cut through the slot, to scale"
    width: 9
    scale: [32, 32]
    parts:
      - {kind: half, side: lower, box: [0, 0, 9, 2.2], first: bottom, label: "lower half", label_at: [0.8, 1.1], label_side: left}
      - {kind: half, side: upper, box: [0, 2.2, 9, 2.2], first: top, label: "upper half", label_at: [0.8, 3.6], label_side: left}
      - {kind: socket, box: [3.05, 2.2, 2.9, 1.6]}
      - {kind: stud, side: lower, box: [3, 2.2, 3, 1.4], toward: up, chamfer: 0.2, label: "3.0 mm stud", label_at: [5.4, 3.2]}
      - {kind: air, box: [4.25, 2.6, 0.5, 1.0], label: "0.5 mm slot, 1.0 deep", label_at: [4.5, 2.8]}
      - {kind: dim, from: [3, 1.7], to: [4.25, 1.7], text: "prong 1.25", place: below}
    notes:
      - "Each prong is a short beam 1.25 mm thick. Even if the slot ran the stud's full 1.4 mm,
        bending a prong the 2 to 3 percent PLA can take moves its tip only about 0.02 to 0.03 mm, so
        the pair gives about 0.05 mm across the diameter: less than a small hole prints undersize."
      - "The prongs stand upright, the weak way for layers, and a 3 mm stud needs more room than
        a 2 mm one, so fewer sites fit on a coaster."
