<svg xmlns="http://www.w3.org/2000/svg" width="1131.95" height="386.7" viewBox="0 0 1131.95 386.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Option F: snap pegs, a ring bead and a barbed prong</title>
<rect width="100%" height="100%" fill="#f8f7f4"/>
<text x="20" y="37" font-size="17" font-weight="bold" fill="#222222">Option F: snap pegs, a ring bead and a barbed prong</text>
<text x="20" y="53.5" font-size="12.5" fill="#555555">Cut through, side view. Dark gray: lower half of the coaster. Light gray: upper half. White: air. Solid blue: printed on the bed (first layer). To scale.</text>
<g data-panel="1. Ring snap, closed, to scale">
<text x="20" y="89.5" font-size="14" font-weight="bold" fill="#222222">1. Ring snap, closed, to scale</text>
<g transform="translate(117.6,109.5)">
<polygon data-kind="half" points="0,140.8 256,140.8 256,70.4 0,70.4" fill="#8e8a83"/>
<line data-mark="first" x1="0" y1="140.8" x2="256" y2="140.8" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="half" points="0,70.4 256,70.4 256,0 0,0" fill="#aba69f"/>
<line data-mark="first" x1="0" y1="0" x2="256" y2="0" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="socket" points="94.4,70.4 161.6,70.4 161.6,19.2 94.4,19.2" fill="#ffffff"/>
<polygon data-kind="air" points="89.6,48 166.4,48 166.4,32 89.6,32" fill="#ffffff"/>
<polygon data-kind="stud" points="96,70.4 160,70.4 160,32 153.6,25.6 102.4,25.6 96,32" fill="#8e8a83"/>
<polygon data-kind="stud" points="91.2,44.8 164.8,44.8 164.8,38.4 161.6,35.2 94.4,35.2 91.2,38.4" fill="#8e8a83"/>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="94.4" y1="86.4" x2="161.6" y2="86.4"/>
<line x1="94.4" y1="82.4" x2="94.4" y2="90.4"/>
<line x1="161.6" y1="82.4" x2="161.6" y2="90.4"/>
</g>
<text x="128" y="101.4" font-size="11" fill="#444444" text-anchor="middle">throat 2.1</text>
</g>
<circle data-label-dot="1" cx="143.2" cy="125.5" r="2.6" fill="#222222"/>
<polyline points="143.2,125.5 103.6,125.5 93.6,125.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="129.5" font-size="12" fill="#222222" text-anchor="end">upper half</text>
<circle data-label-dot="1" cx="208.8" cy="149.5" r="2.6" fill="#222222"/>
<polyline points="208.8,149.5 103.6,149.5 93.6,149.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="153.5" font-size="12" fill="#222222" text-anchor="end">groove</text>
<circle data-label-dot="1" cx="143.2" cy="215.1" r="2.6" fill="#222222"/>
<polyline points="143.2,215.1 103.6,215.1 93.6,215.1" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="219.1" font-size="12" fill="#222222" text-anchor="end">lower half</text>
<circle data-label-dot="1" cx="277.6" cy="149.5" r="2.6" fill="#222222"/>
<polyline points="277.6,149.5 387.6,149.5 397.6,149.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="401.6" y="153.5" font-size="12" fill="#222222" text-anchor="start">bead 2.3</text>
<text x="20" y="278.3" font-size="12" fill="#444444">To pass the throat, the bead must squeeze 0.2 mm or the throat must</text>
<text x="20" y="295.3" font-size="12" fill="#444444">stretch 0.2 mm on a 2 mm ring: about 10 percent, where molding</text>
<text x="20" y="312.3" font-size="12" fill="#444444">guides allow a few percent. A ring this small either cracks or never</text>
<text x="20" y="329.3" font-size="12" fill="#444444">clicks; one the printer could feel would need a ring many times</text>
<text x="20" y="346.3" font-size="12" fill="#444444">larger.</text>
</g>
<g data-panel="2. Barbed split prong, at the length it needs">
<text x="514.48" y="89.5" font-size="14" font-weight="bold" fill="#222222">2. Barbed split prong, at the length it needs</text>
<g transform="translate(637.52,107.5)">
<polygon data-kind="half" points="0,163.2 256,163.2 256,92.8 0,92.8" fill="#8e8a83"/>
<line data-mark="first" x1="0" y1="163.2" x2="256" y2="163.2" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="half" points="0,92.8 256,92.8 256,22.4 0,22.4" fill="#aba69f"/>
<line data-mark="first" x1="0" y1="22.4" x2="256" y2="22.4" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="socket" points="91.2,92.8 164.8,92.8 164.8,22.4 91.2,22.4" fill="#ffffff"/>
<polygon data-kind="stud" points="92.8,92.8 118.4,92.8 118.4,3.2 115.2,0 96,0 92.8,3.2" fill="#8e8a83"/>
<polygon data-kind="stud" points="137.6,92.8 163.2,92.8 163.2,3.2 160,0 140.8,0 137.6,3.2" fill="#8e8a83"/>
<polygon data-kind="stud" points="86.4,19.2 92.8,19.2 92.8,6.4 92.8,6.4 86.4,6.4 86.4,6.4" fill="#8e8a83"/>
<polygon data-kind="stud" points="163.2,19.2 169.6,19.2 169.6,6.4 169.6,6.4 163.2,6.4 163.2,6.4" fill="#8e8a83"/>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="236.8" y1="92.8" x2="236.8" y2="22.4"/>
<line x1="232.8" y1="92.8" x2="240.8" y2="92.8"/>
<line x1="232.8" y1="22.4" x2="240.8" y2="22.4"/>
</g>
<text x="243.8" y="61.6" font-size="11" fill="#444444" text-anchor="start">the whole upper half, 2.2</text>
</g>
<circle data-label-dot="1" cx="743.12" cy="113.9" r="2.6" fill="#222222"/>
<polyline points="743.12,113.9 623.52,113.9 613.52,113.9" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="609.52" y="117.9" font-size="12" fill="#222222" text-anchor="end">prong 2.9 long</text>
<circle data-label-dot="1" cx="663.12" cy="145.9" r="2.6" fill="#222222"/>
<polyline points="663.12,145.9 623.52,145.9 613.52,145.9" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="609.52" y="149.9" font-size="12" fill="#222222" text-anchor="end">upper half</text>
<circle data-label-dot="1" cx="663.12" cy="235.5" r="2.6" fill="#222222"/>
<polyline points="663.12,235.5 623.52,235.5 613.52,235.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="609.52" y="239.5" font-size="12" fill="#222222" text-anchor="end">lower half</text>
<circle data-label-dot="1" cx="803.92" cy="120.3" r="2.6" fill="#222222"/>
<polyline points="803.92,120.3 1041.07,120.3 1051.07,120.3" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1055.07" y="124.3" font-size="12" fill="#222222" text-anchor="start">barb 0.2</text>
<text x="514.48" y="298.7" font-size="12" fill="#444444">A barb the printer can form is about half a line, 0.2 mm. To bend that far at 2 to 4 percent</text>
<text x="514.48" y="315.7" font-size="12" fill="#444444">strain, a prong two lines thick (0.8 mm) needs about 2.5 to 3.5 mm of length. Our socket is</text>
<text x="514.48" y="332.7" font-size="12" fill="#444444">1.6 mm deep and the upper half 2.2 mm thick, so the prong comes out through the coaster's</text>
<text x="514.48" y="349.7" font-size="12" fill="#444444">face.</text>
</g>
</svg>
