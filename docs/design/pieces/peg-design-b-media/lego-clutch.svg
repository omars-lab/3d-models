<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='680' viewBox='0 0 1100 680'><rect width='1100' height='680' fill='#f8f7f4'/><text x='24' y='40' font-family='Helvetica, Arial, sans-serif' font-size='24' font-weight='bold' fill='#222'>How LEGO grips: a stud wedged between the tube and the wall</text><text x='24' y='66' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#555'>Drawn to scale from the sizes in this repo's LEGO survey (pitch 8, stud 4.8, tube 6.51, wall 1.5), not from a photo. Clutch points in red.</text><rect x='60' y='120' width='474.0' height='474.0' fill='#aca69e'/><rect x='105.0' y='165.0' width='384.0' height='384.0' fill='#ffffff'/><circle cx='297.00' cy='357.00' r='97.71' fill='#aca69e' stroke='none' stroke-width='1'/><circle cx='297.00' cy='357.00' r='72.00' fill='#ffffff' stroke='none' stroke-width='1'/><circle cx='177.00' cy='237.00' r='72.00' fill='#8c8780' stroke='#222' stroke-width='1'/><circle cx='227.91' cy='287.91' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='105.00' cy='237.00' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='177.00' cy='165.00' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='177.00' cy='477.00' r='72.00' fill='#8c8780' stroke='#222' stroke-width='1'/><circle cx='227.91' cy='426.09' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='105.00' cy='477.00' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='177.00' cy='549.00' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='417.00' cy='237.00' r='72.00' fill='#8c8780' stroke='#222' stroke-width='1'/><circle cx='366.09' cy='287.91' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='489.00' cy='237.00' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='417.00' cy='165.00' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='417.00' cy='477.00' r='72.00' fill='#8c8780' stroke='#222' stroke-width='1'/><circle cx='366.09' cy='426.09' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='489.00' cy='477.00' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><circle cx='417.00' cy='549.00' r='5.00' fill='#c0392b' stroke='none' stroke-width='1'/><text x='574.0' y='150.0' font-family='Helvetica, Arial, sans-serif' font-size='16' fill='#222' text-anchor='start' font-weight='bold'>A 2x2 brick from below, on the studs of the brick under it</text><text x='574.0' y='190.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>Each stud (dark) is pinched at three points (red): once by the</text><text x='574.0' y='212.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>center tube, and twice by the outer wall.</text><text x='574.0' y='234.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'></text><text x='574.0' y='256.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>The tube's size is set so it just touches all four studs:</text><text x='574.0' y='278.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>8 mm pitch, 4.8 stud, so the tube's outside is 6.51 mm.</text><text x='574.0' y='300.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>The wall's inside is set the same way, 2.4 mm from each</text><text x='574.0' y='322.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>stud's center, which leaves a 1.5 mm wall.</text><text x='574.0' y='344.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>The tube's wall is under a millimeter thick, with air inside,</text><text x='574.0' y='366.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>so it bends a little rather than the stud having to give way.</text><text x='574.0' y='388.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'></text><text x='574.0' y='410.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>The grip is a line contact against a thin wall that flexes.</text><text x='574.0' y='432.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>That idea carries over to printing. The tiny interference</text><text x='574.0' y='454.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>number (hundredths of a mm, held to molding tolerance)</text><text x='574.0' y='476.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>does not: a printed hole comes out off by far more.</text><line x1='60.00' y1='634.00' x2='180.00' y2='634.00' stroke='#222' stroke-width='2'/><line x1='60.00' y1='629.00' x2='60.00' y2='639.00' stroke='#222' stroke-width='2'/><line x1='180.00' y1='629.00' x2='180.00' y2='639.00' stroke='#222' stroke-width='2'/><text x='120.0' y='656.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>4 mm</text></svg>