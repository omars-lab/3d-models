<svg xmlns='http://www.w3.org/2000/svg' width='1260' height='530' viewBox='0 0 1260 530'><rect width='1260' height='530' fill='#f8f7f4'/><text x='24' y='40' font-family='Helvetica, Arial, sans-serif' font-size='24' font-weight='bold' fill='#222'>Why the studs need a hammer: the gap as drawn, and as printed (across the diameter, mm)</text><text x='24' y='66' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#555'>Each part's error eats into the gap from both sides, so a drawn gap must clear the sum, not either one.</text><line x1='330.00' y1='360.00' x2='1185.00' y2='360.00' stroke='#222' stroke-width='1'/><line x1='375.00' y1='355.00' x2='375.00' y2='365.00' stroke='#222' stroke-width='1'/><text x='375.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>-0.4</text><line x1='375.00' y1='110.00' x2='375.00' y2='355.00' stroke='#ddd' stroke-width='1'/><line x1='465.00' y1='355.00' x2='465.00' y2='365.00' stroke='#222' stroke-width='1'/><text x='465.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>-0.3</text><line x1='465.00' y1='110.00' x2='465.00' y2='355.00' stroke='#ddd' stroke-width='1'/><line x1='555.00' y1='355.00' x2='555.00' y2='365.00' stroke='#222' stroke-width='1'/><text x='555.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>-0.2</text><line x1='555.00' y1='110.00' x2='555.00' y2='355.00' stroke='#ddd' stroke-width='1'/><line x1='645.00' y1='355.00' x2='645.00' y2='365.00' stroke='#222' stroke-width='1'/><text x='645.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>-0.1</text><line x1='645.00' y1='110.00' x2='645.00' y2='355.00' stroke='#ddd' stroke-width='1'/><line x1='735.00' y1='355.00' x2='735.00' y2='365.00' stroke='#222' stroke-width='1'/><text x='735.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>0</text><line x1='735.00' y1='110.00' x2='735.00' y2='355.00' stroke='#ddd' stroke-width='1'/><line x1='825.00' y1='355.00' x2='825.00' y2='365.00' stroke='#222' stroke-width='1'/><text x='825.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>+0.1</text><line x1='825.00' y1='110.00' x2='825.00' y2='355.00' stroke='#ddd' stroke-width='1'/><line x1='915.00' y1='355.00' x2='915.00' y2='365.00' stroke='#222' stroke-width='1'/><text x='915.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>+0.2</text><line x1='915.00' y1='110.00' x2='915.00' y2='355.00' stroke='#ddd' stroke-width='1'/><line x1='1005.00' y1='355.00' x2='1005.00' y2='365.00' stroke='#222' stroke-width='1'/><text x='1005.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>+0.3</text><line x1='1005.00' y1='110.00' x2='1005.00' y2='355.00' stroke='#ddd' stroke-width='1'/><line x1='1095.00' y1='355.00' x2='1095.00' y2='365.00' stroke='#222' stroke-width='1'/><text x='1095.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>+0.4</text><line x1='1095.00' y1='110.00' x2='1095.00' y2='355.00' stroke='#ddd' stroke-width='1'/><line x1='1185.00' y1='355.00' x2='1185.00' y2='365.00' stroke='#222' stroke-width='1'/><text x='1185.0' y='382.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>+0.5</text><line x1='1185.00' y1='110.00' x2='1185.00' y2='355.00' stroke='#ddd' stroke-width='1'/><line x1='735.00' y1='105.00' x2='735.00' y2='360.00' stroke='#222' stroke-width='2'/><text x='735.0' y='100.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#222' text-anchor='middle' font-weight='normal'>flush: no gap, no squeeze</text><text x='537.0' y='405.0' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#c0392b' text-anchor='middle' font-weight='bold'>squeeze (hammer)</text><text x='1005.0' y='405.0' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#3a7d44' text-anchor='middle' font-weight='bold'>gap (slips in, then rattles)</text><text x='318.0' y='155.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='end' font-weight='normal'>spl-1's best, drawn 0.15</text><circle cx='870.00' cy='150.00' r='7.00' fill='#ffffff' stroke='#222' stroke-width='2'/><rect x='420.0' y='164' width='270.0' height='16' fill='#e67e22' opacity='0.75'/><line x1='870.00' y1='157.00' x2='690.00' y2='164.00' stroke='#555' stroke-width='1' stroke-dasharray='3,3'/><text x='318.0' y='240.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='end' font-weight='normal'>spl-2's loosest, drawn 0.40</text><circle cx='1095.00' cy='235.00' r='7.00' fill='#ffffff' stroke='#222' stroke-width='2'/><rect x='645.0' y='249' width='270.0' height='16' fill='#e67e22' opacity='0.75'/><line x1='1095.00' y1='242.00' x2='915.00' y2='249.00' stroke='#555' stroke-width='1' stroke-dasharray='3,3'/><text x='318.0' y='325.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='end' font-weight='normal'>0.15 with the slicer opening holes</text><circle cx='870.00' cy='320.00' r='7.00' fill='#ffffff' stroke='#222' stroke-width='2'/><text x='888.0' y='318.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#555' text-anchor='start' font-weight='normal'>the slicer can open round holes in 0.02 mm steps;</text><text x='888.0' y='336.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#555' text-anchor='start' font-weight='normal'>one owner of another Bambu model saw little change</text><circle cx='40.00' cy='450.00' r='7.00' fill='#ffffff' stroke='#222' stroke-width='2'/><text x='56.0' y='455.0' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#222' text-anchor='start' font-weight='normal'>the gap as drawn (socket width less stud width)</text><rect x='33' y='470' width='16' height='14' fill='#e67e22' opacity='0.75'/><text x='56.0' y='482.0' font-family='Helvetica, Arial, sans-serif' font-size='14' fill='#222' text-anchor='start' font-weight='normal'>what likely prints, if holes come out 0.1 to 0.3 mm small and studs 0.1 to 0.2 mm big</text><text x='56.0' y='505.0' font-family='Helvetica, Arial, sans-serif' font-size='13' fill='#555' text-anchor='start' font-weight='normal'>(one source's figures, for holes 5 mm and larger; our 2 mm hole is smaller than its table, and not yet measured)</text></svg>