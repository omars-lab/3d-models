# Option F of peg-design-b: snap pegs. Panel 1 is a ring snap (a bead on the stud, a groove in the
# socket); panel 2 is a split prong with a barb, drawn at the length it would need.
# Drawn by the draw-side-view skill:
#   python3 .claude/skills/draw-side-view/scripts/side_view.py draw <this file>
# Ring snap: stud 2.0, bead 2.3 for 0.3 mm of its height, socket throat 2.1, groove 2.4.
# Prong: two 0.8 mm prongs, a 0.6 mm slot, barbs 0.2 mm a side, 2.9 mm long (see the design doc's
# snap section for the arithmetic).
title: "Option F: snap pegs, a ring bead and a barbed prong"
panels:
  - title: "1. Ring snap, closed, to scale"
    width: 8
    scale: [32, 32]
    parts:
      - {kind: half, side: lower, box: [0, 0, 8, 2.2], first: bottom, label: "lower half", label_at: [0.8, 1.1], label_side: left}
      - {kind: half, side: upper, box: [0, 2.2, 8, 2.2], first: top, label: "upper half", label_at: [0.8, 3.9], label_side: left}
      - {kind: socket, box: [2.95, 2.2, 2.1, 1.6]}
      - {kind: air, box: [2.8, 2.9, 2.4, 0.5], label: "groove", label_at: [2.85, 3.15], label_side: left}
      - {kind: stud, side: lower, box: [3, 2.2, 2, 1.4], toward: up, chamfer: 0.2}
      - {kind: stud, side: lower, box: [2.85, 3.0, 2.3, 0.3], toward: up, chamfer: 0.1, label: "bead 2.3", label_at: [5.0, 3.15]}
      - {kind: dim, from: [2.95, 1.7], to: [5.05, 1.7], text: "throat 2.1", place: below}
    notes:
      - "To pass the throat, the bead must squeeze 0.2 mm or the throat must stretch 0.2 mm on a
        2 mm ring: about 10 percent, where molding guides allow a few percent. A ring this small
        either cracks or never clicks; one the printer could feel would need a ring many times
        larger."

  - title: "2. Barbed split prong, at the length it needs"
    width: 8
    scale: [32, 32]
    parts:
      - {kind: half, side: lower, box: [0, 0, 8, 2.2], first: bottom, label: "lower half", label_at: [0.8, 1.1], label_side: left}
      - {kind: half, side: upper, box: [0, 2.2, 8, 2.2], first: top, label: "upper half", label_at: [0.8, 3.9], label_side: left}
      - {kind: socket, box: [2.85, 2.2, 2.3, 2.2]}
      - {kind: stud, side: lower, box: [2.9, 2.2, 0.8, 2.9], toward: up, chamfer: 0.1, label: "prong 2.9 long", label_at: [3.3, 4.9], label_side: left}
      - {kind: stud, side: lower, box: [4.3, 2.2, 0.8, 2.9], toward: up, chamfer: 0.1}
      - {kind: stud, side: lower, box: [2.7, 4.5, 0.2, 0.4], toward: up, chamfer: 0}
      - {kind: stud, side: lower, box: [5.1, 4.5, 0.2, 0.4], toward: up, chamfer: 0, label: "barb 0.2", label_at: [5.2, 4.7]}
      - {kind: dim, from: [7.4, 2.2], to: [7.4, 4.4], text: "the whole upper half, 2.2"}
    notes:
      - "A barb the printer can form is about half a line, 0.2 mm. To bend that far at 2 to 4
        percent strain, a prong two lines thick (0.8 mm) needs about 2.5 to 3.5 mm of length. Our
        socket is 1.6 mm deep and the upper half 2.2 mm thick, so the prong comes out through the
        coaster's face."
