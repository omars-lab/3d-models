<svg xmlns="http://www.w3.org/2000/svg" width="561.56" height="433.3" viewBox="0 0 561.56 433.3" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Option D: a LEGO-style socket, a thin tube freed by a moat</title>
<rect width="100%" height="100%" fill="#f8f7f4"/>
<text x="20" y="37" font-size="17" font-weight="bold" fill="#222222">Option D: a LEGO-style socket, a thin tube freed by a moat</text>
<text x="20" y="53.5" font-size="12.5" fill="#555555">Cut through, side view. Dark gray: lower half of the coaster. Light gray:</text>
<text x="20" y="70" font-size="12.5" fill="#555555">upper half. White: air. Solid blue: printed on the bed (first layer). To</text>
<text x="20" y="86.5" font-size="12.5" fill="#555555">scale.</text>
<g data-panel="1. Closed, cut through the stud, to scale">
<text x="20" y="122.5" font-size="14" font-weight="bold" fill="#222222">1. Closed, cut through the stud, to scale</text>
<g transform="translate(117.6,142.5)">
<polygon data-kind="half" points="0,140.8 320,140.8 320,70.4 0,70.4" fill="#8e8a83"/>
<line data-mark="first" x1="0" y1="140.8" x2="320" y2="140.8" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="half" points="0,70.4 320,70.4 320,0 0,0" fill="#aba69f"/>
<line data-mark="first" x1="0" y1="0" x2="320" y2="0" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="air" points="80.32,70.4 96.32,70.4 96.32,19.2 80.32,19.2" fill="#ffffff"/>
<polygon data-kind="air" points="223.68,70.4 239.68,70.4 239.68,19.2 223.68,19.2" fill="#ffffff"/>
<polygon data-kind="socket" points="123.2,70.4 196.8,70.4 196.8,19.2 123.2,19.2" fill="#ffffff"/>
<polygon data-kind="stud" points="128,70.4 192,70.4 192,32 185.6,25.6 134.4,25.6 128,32" fill="#8e8a83"/>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="96.32" y1="86.4" x2="123.2" y2="86.4"/>
<line x1="96.32" y1="82.4" x2="96.32" y2="90.4"/>
<line x1="123.2" y1="82.4" x2="123.2" y2="90.4"/>
</g>
<text x="109.76" y="101.4" font-size="11" fill="#444444" text-anchor="middle">tube wall 0.84</text>
</g>
<circle data-label-dot="1" cx="143.2" cy="158.5" r="2.6" fill="#222222"/>
<polyline points="143.2,158.5 103.6,158.5 93.6,158.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="162.5" font-size="12" fill="#222222" text-anchor="end">upper half</text>
<circle data-label-dot="1" cx="205.92" cy="203.3" r="2.6" fill="#222222"/>
<polyline points="205.92,203.3 103.6,203.3 93.6,203.3" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="207.3" font-size="12" fill="#222222" text-anchor="end">moat</text>
<circle data-label-dot="1" cx="143.2" cy="248.1" r="2.6" fill="#222222"/>
<polyline points="143.2,248.1 103.6,248.1 93.6,248.1" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="89.6" y="252.1" font-size="12" fill="#222222" text-anchor="end">lower half</text>
<circle data-label-dot="1" cx="296.8" cy="177.7" r="2.6" fill="#222222"/>
<polyline points="296.8,177.7 451.6,177.7 461.6,177.7" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="465.6" y="181.7" font-size="12" fill="#222222" text-anchor="start">2.0 mm stud</text>
<text x="20" y="311.3" font-size="12" fill="#444444">The tube wall is two lines thick and free on its outside, so a stud a little too</text>
<text x="20" y="328.3" font-size="12" fill="#444444">big bends the wall out instead of needing a hammer. That is the job LEGO's tube</text>
<text x="20" y="345.3" font-size="12" fill="#444444">does between four studs.</text>
<text x="20" y="362.3" font-size="12" fill="#444444">Socket, tube and moat together need a site about 3.4 mm from center to the nearest</text>
<text x="20" y="379.3" font-size="12" fill="#444444">edge, more than a gBV crossing has, so this one is for wider parts, not today's</text>
<text x="20" y="396.3" font-size="12" fill="#444444">coaster.</text>
</g>
</svg>
