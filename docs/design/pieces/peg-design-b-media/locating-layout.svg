3,222.30 799.94,221.48 801.38,220.40 802.61,219.08 803.60,217.57 804.31,215.91 804.72,214.16' fill='#ffffff' stroke='#222' stroke-width='1.2'/><line x1='778.00' y1='328.00' x2='796.00' y2='202.00' stroke='#2f6fd6' stroke-width='1' stroke-dasharray='4,4'/><circle cx='796.00' cy='202.00' r='9.00' fill='#8c8780' stroke='none' stroke-width='1'/><text x='60.0' y='560.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>Left: each stud must land in its own hole, so any error in the spacing between studs binds them, and all must be pushed in at once.</text><text x='60.0' y='584.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>Right: the round socket fixes where the coaster sits; each slot only stops it turning, and lets the spacing between studs be off.</text><text x='60.0' y='608.0' font-family='Helvetica, Arial, sans-serif' font-size='15' fill='#222' text-anchor='start' font-weight='normal'>This is the round-pin-plus-diamond-pin rule from machine fixtures. Slots drawn long for clarity: the real slot is 0.3 to 0.5 mm longer than round.</text></svg>