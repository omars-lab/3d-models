<svg xmlns="http://www.w3.org/2000/svg" width="1346.64" height="712.9" viewBox="0 0 1346.64 712.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Cable spiral: one channel, and two discs stacked (d = 4 mm)</title>
<rect width="100%" height="100%" fill="#f8f7f4"/>
<text x="20" y="37" font-size="17" font-weight="bold" fill="#222222">Cable spiral: one channel, and two discs stacked (d = 4 mm)</text>
<text x="20" y="53.5" font-size="12.5" fill="#555555">Dark gray: the lower disc. Light gray: the upper disc. Gold: the cable. Blue line: the first layer on the bed. Panel 1 is to scale; panel 2 is not.</text>
<g data-panel="1. One channel, cut across, to scale">
<text x="20" y="89.5" font-size="14" font-weight="bold" fill="#222222">1. One channel, cut across, to scale</text>
<g transform="translate(110.88,112.5)">
<polygon data-kind="half" points="90,186 270,186 270,162 90,162" fill="#8e8a83"/>
<line data-mark="first" x1="90" y1="186" x2="270" y2="186" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="half" points="90,162 114,162 114,0 90,0" fill="#8e8a83"/>
<polygon data-kind="half" points="246,162 270,162 270,0 246,0" fill="#8e8a83"/>
<polygon data-kind="lip" points="114,42 132,42 132,24 114,24" fill="#8e8a83"/>
<polygon data-kind="lip" points="228,42 246,42 246,24 228,24" fill="#8e8a83"/>
<polygon data-kind="piece" points="120,162 240,162 240,42 120,42" fill="#dcaa33"/>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="114" y1="132" x2="246" y2="132"/>
<line x1="114" y1="128" x2="114" y2="136"/>
<line x1="246" y1="128" x2="246" y2="136"/>
</g>
<text x="180" y="147" font-size="11" fill="#444444" text-anchor="middle">channel 4.4</text>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="132" y1="12" x2="228" y2="12"/>
<line x1="132" y1="8" x2="132" y2="16"/>
<line x1="228" y1="8" x2="228" y2="16"/>
</g>
<text x="180" y="6" font-size="11" fill="#444444" text-anchor="middle">mouth 3.2</text>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="66" y1="186" x2="66" y2="0"/>
<line x1="62" y1="186" x2="70" y2="186"/>
<line x1="62" y1="0" x2="70" y2="0"/>
</g>
<text x="59" y="97" font-size="11" fill="#444444" text-anchor="end">6.2 thick</text>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="318" y1="24" x2="318" y2="0"/>
<line x1="314" y1="24" x2="322" y2="24"/>
<line x1="314" y1="0" x2="322" y2="0"/>
</g>
<text x="325" y="16" font-size="11" fill="#444444" text-anchor="start">lead-in 0.8</text>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="318" y1="162" x2="318" y2="42"/>
<line x1="314" y1="162" x2="322" y2="162"/>
<line x1="314" y1="42" x2="322" y2="42"/>
</g>
<text x="325" y="106" font-size="11" fill="#444444" text-anchor="start">d = 4</text>
<rect data-kind="bed" x="-6" y="190" width="372" height="5" fill="#cfcbc3"/>
<text x="370" y="196" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="368.88" cy="193.5" r="2.6" fill="#222222"/>
<polyline points="368.88,193.5 90.88,193.5 80.88,193.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="76.88" y="197.5" font-size="12" fill="#222222" text-anchor="end">wall 0.8</text>
<circle data-label-dot="1" cx="233.88" cy="145.5" r="2.6" fill="#222222"/>
<polyline points="233.88,145.5 552.12,145.5 562.12,145.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="566.12" y="149.5" font-size="12" fill="#222222" text-anchor="start">lip (0.6 reach)</text>
<circle data-label-dot="1" cx="320.88" cy="220.5" r="2.6" fill="#222222"/>
<polyline points="320.88,220.5 552.12,220.5 562.12,220.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="566.12" y="224.5" font-size="12" fill="#222222" text-anchor="start">cable (drawn square)</text>
<circle data-label-dot="1" cx="350.88" cy="286.5" r="2.6" fill="#222222"/>
<polyline points="350.88,286.5 552.12,286.5 562.12,286.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="566.12" y="290.5" font-size="12" fill="#222222" text-anchor="start">floor 0.8</text>
<text x="20" y="338.1" font-size="12" fill="#444444">The lip starts at height d (4.8 above the bed, counting the floor). A round cable lying on the floor</text>
<text x="20" y="355.1" font-size="12" fill="#444444">clears it with room to spare. Pressing the cable down bends each wall 0.4 mm out at the top, until it</text>
<text x="20" y="372.1" font-size="12" fill="#444444">slips past the 3.2 mouth.</text>
<text x="20" y="389.1" font-size="12" fill="#444444">Drawn square: the cable is really round, the lip's underside a 45° slope, and the lead-in a 30° slope that</text>
<text x="20" y="406.1" font-size="12" fill="#444444">widens the mouth back toward 4.4 at the top face. The next picture in the doc shows the true shapes.</text>
</g>
<g data-panel="2. Two discs stacked, at the outer edge (not to scale)">
<text x="755.32" y="89.5" font-size="14" font-weight="bold" fill="#222222">2. Two discs stacked, at the outer edge (not to scale)</text>
<g transform="translate(858.92,107.5)">
<polygon data-kind="half" points="0,460.8 216,460.8 216,237.6 0,237.6" fill="#8e8a83"/>
<line data-mark="first" x1="0" y1="460.8" x2="216" y2="460.8" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="pocket" points="54,432 133.2,432 133.2,237.6 54,237.6" fill="#ffffff"/>
<polygon data-kind="piece" points="57.6,432 129.6,432 129.6,288 57.6,288" fill="#dcaa33"/>
<polygon data-kind="stud" points="208.8,237.6 216,237.6 216,228 213.6,223.2 211.2,223.2 208.8,228" fill="#8e8a83"/>
<polygon data-kind="half" points="0,223.2 216,223.2 216,0 0,0" fill="#aba69f"/>
<polygon data-kind="socket" points="205.2,223.2 216,223.2 216,201.6 205.2,201.6" fill="#ffffff"/>
<line data-kind="arrow" x1="108" y1="46.8" x2="108" y2="201.6" stroke="#444444" stroke-width="1.6"/>
<polyline points="103,192.6 108,201.6 113,192.6" fill="none" stroke="#444444" stroke-width="1.6"/>
<text x="120" y="128.2" font-size="12" fill="#444444">set down</text>
<rect data-kind="bed" x="-6" y="464.8" width="264" height="5" fill="#cfcbc3"/>
<text x="262" y="470.8" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="885.92" cy="226.3" r="2.6" fill="#222222"/>
<polyline points="885.92,226.3 838.92,226.3 828.92,226.3" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="824.92" y="230.3" font-size="12" fill="#222222" text-anchor="end">upper disc</text>
<circle data-label-dot="1" cx="885.92" cy="460.3" r="2.6" fill="#222222"/>
<polyline points="885.92,460.3 838.92,460.3 828.92,460.3" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="824.92" y="464.3" font-size="12" fill="#222222" text-anchor="end">lower disc</text>
<circle data-label-dot="1" cx="1069.52" cy="316.3" r="2.6" fill="#222222"/>
<polyline points="1069.52,316.3 1192.16,316.3 1202.16,316.3" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1206.16" y="320.3" font-size="12" fill="#222222" text-anchor="start">bottom chamfer 0.6</text>
<circle data-label-dot="1" cx="1071.32" cy="337.9" r="2.6" fill="#222222"/>
<polyline points="1071.32,337.9 1192.16,337.9 1202.16,337.9" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1206.16" y="341.9" font-size="12" fill="#222222" text-anchor="start">stacking ring 0.4</text>
<circle data-label-dot="1" cx="977.72" cy="370.3" r="2.6" fill="#222222"/>
<polyline points="977.72,370.3 1192.16,370.3 1202.16,370.3" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1206.16" y="374.3" font-size="12" fill="#222222" text-anchor="start">a channel</text>
<circle data-label-dot="1" cx="952.52" cy="467.5" r="2.6" fill="#222222"/>
<polyline points="952.52,467.5 1192.16,467.5 1202.16,467.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1206.16" y="471.5" font-size="12" fill="#222222" text-anchor="start">cable</text>
<text x="755.32" y="607.9" font-size="12" fill="#444444">Drawn apart so both parts show. Set down, the upper disc's flat underside rests on the</text>
<text x="755.32" y="624.9" font-size="12" fill="#444444">tops of the lower disc's walls and closes every channel, so the cable cannot lift out.</text>
<text x="755.32" y="641.9" font-size="12" fill="#444444">The stacking ring (0.4 tall) tucks into the chamfer (0.6 tall) and stops 0.2 short, so it</text>
<text x="755.32" y="658.9" font-size="12" fill="#444444">never props the disc up.</text>
<text x="755.32" y="675.9" font-size="12" fill="#444444">The ring is really a triangle with a 45° inner face; the chamfer is a 45° bevel.</text>
</g>
</svg>
