# The words we use for printing coasters, one entry a term, each with a picture.
#
# Omar, 2026-11-05: "i also want a vocabulary in out hub with visual - skirt va brim vs pin va
# dovetail wtc ... as we add more generic techiques we expand the vocabulary/tehcniqur oage".
#
# This file is the source. The vault page beside it, README.md, is written from it, and the hub's
# vocabulary page reads it. After an edit, run:
#
#   python3 .claude/skills/maintain-vocabulary/scripts/vocabulary.py render
#
# Each term:
#   id        short name, used by `related`
#   term      the word as we say it
#   also      other words for it, and the look-alike it gets mixed up with
#   what      what it is, in plain words
#   ours      where it shows up on our coasters, and what we found
#   picture   a picture inside docs/, as a path from this folder
#   alt       what the picture shows
#   from      where the picture came from: a plate's own media, or made for this page
#   drawn     true when the picture is a drawing, not a slice or a render
#   snippet   the code that switches it on, where there is one (lang: naqsh, yaml, json)
#   knobs     the plate params (bkr) and object_settings (setting:) it covers; `scan` checks
#             every one a plate uses is named by some term
#   plates    plates that asked about it; `check` makes sure each one exists
#   related   ids of terms to read beside it
#   cookbook  the cookbook recipe that draws it, when there is one

groups:
  - id: bases
    title: What the slicer adds round or under a piece
  - id: joins
    title: What holds two parts together
  - id: shapes
    title: Shapes we cut into a piece
  - id: marks
    title: Telling pieces apart
  - id: fit
    title: Fit and the bottom face

terms:
  - id: skirt
    group: bases
    term: Skirt
    also: [brim (the look-alike)]
    what: >-
      A loop or two of plastic that the printer lays on the bed round everything, a few millimetres
      away from the pieces, before it prints them. It touches nothing. It is there to get the
      plastic flowing cleanly, and it is thrown away after.
    ours: >-
      Our printer's stock settings print no skirt. closeout-1 is the first plate to ask for one: two
      lines round the whole plate, after you asked "on small kite (10/11) can we try them with skirt
      and brim". Earlier on closeout-1 you asked "do we have stars with skirts in this?": the star
      you meant, STAR-GRID, stands on grid supports, which are a base under it, not a skirt. The
      picture is a demo slice made for this page, with a two-loop skirt turned on: the blue loop
      runs round the whole bed.
    picture: media/skirt.png
    alt: First layer of the demo slice, seen from above. A blue loop runs round all the pieces, well away from them.
    from: made for this page, from the demo slice media/bases-demo.yaml
    snippet: |-
      # in a plate recipe (closeout-1.yaml): a skirt round the whole plate
      skirt: { loops: 2 }        # distance: 2 mm unless set, 1 to 10
    lang: yaml
    knobs: []
    plates: [closeout-1]
    related: [brim, raft, supports]

  - id: brim
    group: bases
    term: Brim
    also: [mouse ears, skirt (the look-alike)]
    what: >-
      A flat band of plastic, one layer thick, printed joined onto the piece's outside edge on the
      first layer. It gives the piece more grip on the bed so its edges do not lift. You peel or cut
      it off after.
    ours: >-
      star-1 put a 5 mm brim round one sloped star (SLOPE-BRIM), to see if a base helps the star's
      bottom. A brim only touches the edge, so the bottom face stays the piece's own.
    picture: ../design/plates/star-1-media/first-layer.png
    alt: star-1's first layer. The stars on the right sit in a purple band joined to their edge; that band is the brim.
    from: star-1's slice
    snippet: |-
      object_settings: { brim_type: "outer_only", brim_width: "5" }
    lang: yaml
    knobs: ["setting:brim_type", "setting:brim_width"]
    plates: [star-1, closeout-1]
    related: [skirt, raft]

  - id: raft
    group: bases
    term: Raft
    also: []
    what: >-
      A few thick layers of plastic printed under the whole piece, and the piece is printed on top
      of them. The piece never touches the bed. You break the raft off after.
    ours: >-
      We have not printed one. star-1 left it out on purpose: under a raft the piece's bottom is the
      raft's top, so it is rough, and the bottom face was the face being judged. The picture is the
      demo slice: two grey stars of raft where two small stars will sit.
    picture: media/raft.png
    alt: First layer of the demo slice, close up. Two solid grey star shapes, wider than the pieces; the pieces print on top of them.
    from: made for this page, from the demo slice media/bases-demo.yaml
    snippet: |-
      object_settings: { raft_layers: "2" }
    lang: yaml
    knobs: ["setting:raft_layers"]
    plates: [star-1]
    related: [brim, supports, bed-face]

  - id: supports
    group: bases
    term: Supports, grid and tree
    also: [normal supports, tree supports, a base]
    what: >-
      Plastic the slicer builds under a part that would otherwise be printed over air, such as the
      underside of a flange. Grid supports (Bambu calls them "normal") are blocks of straight lines
      straight down under every overhang. Tree supports are thin branches that grow from a few spots
      on the bed and reach up to the overhang. Both snap off after.
    ours: >-
      On split-10 the stock tree supports met the middle piece's wide flange and laid a ring a few
      millimetres wide on the bed round it. A star's step out is narrow, so tree supports gave it only
      a few twigs. star-1 tried grid supports under a sloped star instead (SLOPE-GRID), and star-2
      and closeout-1 kept that star. The first picture is star-1's first layer: the grey blocks are
      grid supports. The second is the demo slice: the grey rings round the two big middle pieces are
      where tree supports stand on the bed.
    picture: ../design/plates/star-1-media/first-layer.png
    alt: star-1's first layer. The middle stars stand in grey blocks of straight lines; those are grid supports.
    from: star-1's slice
    pictures:
      - picture: media/tree-supports.png
        alt: First layer of the demo slice. Grey rings, a few mm wide, round two middle pieces; tree supports grow up from them.
        from: made for this page, from the demo slice media/bases-demo.yaml
    snippet: |-
      object_settings: { enable_support: "1", support_type: "normal(auto)" }   # grid
      object_settings: { enable_support: "1", support_type: "tree(auto)" }     # tree
    lang: yaml
    knobs: ["setting:enable_support", "setting:support_type"]
    plates: [split-10, star-1, star-2, closeout-1]
    related: [flange, slope, raft]

  - id: pin
    group: joins
    term: Pin
    also: [peg (the look-alike)]
    what: >-
      A short round post standing on one half of a piece that goes into a hole in the other half,
      so the two halves line up and stay together.
    ours: >-
      Pins join the two halves of a loose piece (a star, a kite, the middle). The middle takes a pin
      in the centre and six round it; a star takes three on a triangle. split-03 first tried them;
      star-2 tried three pin sizes on the star. A pin joins a piece's halves; a stud joins the
      coaster's halves.
    picture: ../cookbook/img/coaster-half-pins.png
    alt: A piece cut in two, with the lower half's pins standing up and the matching holes in the upper half.
    from: the cookbook's picture
    snippet: |-
      halves 1
      pin 1.2          # pin diameter, mm
      pin_gap 0.25     # how much wider the hole is
      pins_middle 7    # the centre and six round it
      pins_star 3
      pins_star_ring 1 # the star's three on a ring, none in the middle
    lang: naqsh
    knobs: [pin, pin_gap, pin_wall, "pins_*"]
    plates: [split-03, split-05, split-08, star-2, star-3]
    related: [halves, stud, slide]
    cookbook: ../cookbook/coaster-knobs.md#pins-that-close-a-cut-piece

  - id: stud
    group: joins
    term: Stud
    also: [peg, alignment peg, pin (the look-alike)]
    what: >-
      A short peg on one half of the coaster that goes into a socket in the other half, so the two
      big halves of a split coaster line up when you close them.
    ours: >-
      Studs stand on the coaster's lower half at the spots where straps meet, since only there is
      there room for a socket. spl-1 and spl-2 found how tight a stud can be and still go in by hand;
      stud-1 tried how far apart they go. Same idea as a pin, but on the coaster, not on a piece.
    picture: ../design/plates/stud-1-media/opened.png
    alt: stud-1's coasters opened up. The lower halves carry small round pegs at strap crossings; the upper halves have the sockets.
    from: stud-1's photo
    snippet: |-
      stud 1.2        # peg diameter, mm
      stud_gap 0.25   # how much wider the socket is
      stud_spacing 6  # the least distance between two pegs
    lang: naqsh
    knobs: [stud, stud_gap, stud_spacing, stud_wall, stud_boss, "stud_ring*"]
    plates: [spl-1, spl-2, stud-1, split-07]
    related: [pin, halves]

  - id: slide
    group: joins
    term: Rail and slot (a slide)
    also: [slide, rail]
    what: >-
      A ridge on one half (the rail) that slides sideways into a groove in the other half (the slot).
      Once slid in, the halves cannot pull straight apart.
    ours: >-
      We use a slide on the hexagons and the outer pieces, where the cut face is long and narrow.
      sld-1 showed a small slide can join two piece halves. hexfit-1 tried how tight; hexfit-2 found
      what stops the hexagon halves rocking: they keep their rail.
    picture: ../cookbook/img/coaster-half-slide.png
    alt: A cut piece with a rail running across the lower half's face and a matching slot in the upper half.
    from: the cookbook's picture
    snippet: |-
      halves 1
      slide 4           # the rail's width at its root, mm
      slide_gap 0.15    # room each side between rail and slot
      slide_height 0.8  # the rail's height, whole 0.2 mm layers
      slide_hex 1       # put a slide on the hexagons
    lang: naqsh
    knobs: [slide, slide_gap, slide_height, slide_slot_extra, "slide_*"]
    plates: [sld-1, hexfit-1, hexfit-2, split-10]
    related: [dovetail, pin, halves]
    cookbook: ../cookbook/coaster-knobs.md#a-slide-that-closes-a-cut-piece

  - id: dovetail
    group: joins
    term: Dovetail
    also: [rail (its shape)]
    what: >-
      The shape of a rail that is wider at the top than at its root, like a bird's tail. Because it
      flares out, the slot holds it in: it can only slide out the end. Our slide's rail is a dovetail.
    ours: >-
      Our printed dovetail flares in steps, one per 0.2 mm layer, because a printer builds in layers.
      sld-1's cut through shows the steps. minis-03 and minis-06 used bigger dovetails to join
      two mini coasters edge to edge.
    picture: ../design/plates/sld-1-media/side-cut.png
    alt: sld-1 cut through. The rail on the lower half widens in steps as it goes up, inside a slot of the same shape.
    from: sld-1's side cut
    snippet: |-
      neck 3   # mm, the dovetail's narrow root where it leaves the edge (minis-06)
    lang: naqsh
    knobs: [neck]
    plates: [sld-1, minis-03, minis-06, hexfit-1]
    related: [slide]

  - id: halves
    group: joins
    term: Halves (a split piece)
    also: [cut piece, split coaster (the coaster's halves)]
    what: >-
      A piece printed as two halves cut across its middle, each lying on one of its own faces. Both
      the top and the bottom then print flat on the bed, so both come out smooth. Pins or a slide
      put the halves back together.
    ours: >-
      Every loose piece on the flange coaster can be printed in halves since split-07. The coaster
      itself is also split in two, so the pieces are trapped between its halves; that is the split
      coaster, a different cut.
    picture: ../design/plates/pkt-2-media/halves.png
    alt: The two halves of a middle piece side by side, each lying on the face that printed on the bed.
    from: pkt-2's picture
    snippet: |-
      halves 1   # 1 prints each loose piece as two halves
    lang: naqsh
    knobs: [halves, room]
    plates: [split-07, split-10, pkt-2]
    related: [pin, slide, stud]
    cookbook: ../cookbook/coaster-knobs.md#split-coasters-two-halves-that-trap-the-pieces

  - id: flange
    group: shapes
    term: Flange (a step)
    also: [step, lip (the look-alike)]
    what: >-
      A thin rim that sticks out round the bottom of a piece, like the brim of a hat. It reaches
      under the coaster's strap, so the piece cannot fall out of the top.
    ours: >-
      The flange coaster is named for it (split-02 was the first). Its pieces carry a flange that
      sits in an undercut in the coaster's lower half. The flange's underside hangs over air when
      it prints, which is why we tried supports and then the slope.
    picture: ../design/plates/pkt-2-media/side-kite.png
    alt: A cut through a kite in its pocket. The kite's rim reaches out under the strap; the white lines are the gaps round it.
    from: pkt-2's side cut
    snippet: |-
      flange 0.8   # how far the undercut reaches under the strap, mm
    lang: naqsh
    knobs: [flange]
    plates: [split-02, pkt-1, pkt-2, split-07]
    related: [lip, slope, supports, gap]

  - id: lip
    group: shapes
    term: Lip
    also: [flange (the look-alike)]
    what: >-
      A rim on the coaster, not the piece, that leans in over the edge of a pocket and holds the
      piece down from above.
    ours: >-
      split-01 held its pieces under a lip (option A); split-02 moved to a flange on each piece
      instead (option C). A lip is on the frame and holds from above; a flange is on the piece and
      holds from below.
    picture: ../design/plates/split-01-media/how-it-holds.png
    alt: split-01's side view. The coaster's edge leans in over the piece; that lip is 0.8 mm.
    from: split-01's side view
    drawn: true
    knobs: []
    plates: [split-01, spl-1]
    related: [flange]

  - id: slope
    group: shapes
    term: Slope (stairs under the flange)
    also: [chamfer, 45° overhang]
    what: >-
      Instead of a flat ledge sticking straight out over air, the underside steps out a little each
      layer, so it prints as a 45° slope. Each layer then sits mostly on the one below it and needs
      no supports.
    ours: >-
      Up to split-07 the flange's underside was a flat ledge printed over air. slope 0.2 makes it
      a 45° slope at our 0.2 mm layers. split-10 first tried it; star-1 to star-3 printed sloped
      stars. The picture cuts a star half through, without and with the slope.
    picture: media/slope.png
    alt: Two cuts through a star half. Left, slope 0, the flange's underside is a flat ledge. Right, slope 0.2, it steps out like stairs.
    from: made for this page, from the flange coaster's star rendered at slope 0 and 0.2
    snippet: |-
      slope 0.2   # mm out per 0.2 mm layer up: a 45° slope
    lang: naqsh
    knobs: [slope]
    plates: [split-10, star-1, star-2, star-3]
    related: [flange, supports]

  - id: in-place
    group: joins
    term: Printed in place
    also: [captive piece, air gap]
    what: >-
      A piece printed already inside its closed pocket, in one go, with a layer or two of air
      left between them. If the air is enough, the piece comes off the bed loose but cannot get
      out.
    ours: >-
      pkt-1 tried it on a hexagon: the pocket narrows to a neck at the face and at the cut, and the
      piece has a band in the room between, with air above and below. One layer of air (0.2 mm)
      and two (0.4 mm) were tried, two copies each. pkt-2 then printed a split coaster's pieces in
      their pockets.
    picture: ../design/plates/pkt-1-media/cut-closed-0.4.png
    alt: A cut through pkt-1's closed pocket. The piece in the middle has a band that sits in a wider room of the pocket; the white lines are the air round it.
    from: pkt-1's side cut
    snippet: |-
      air 0.4     # mm of air above and below the band: two 0.2 mm layers
      thick 0.4   # mm, each neck's thickness
    lang: naqsh
    knobs: [air, thick]
    plates: [pkt-1, pkt-2]
    related: [gap, flange]

  - id: wedge
    group: shapes
    term: Wedge (a slice of the ring)
    also: [test slice]
    what: >-
      A pie slice of the whole coaster, both halves, with whole pegs and sockets, so a fit can be
      tried in a few grams instead of a whole coaster.
    ours: >-
      wedge 36 prints a 36° slice, two faces' worth. split-04 used wedges to try every piece kind at
      three gaps; wedge_center 1 keeps the middle piece in too. closeout-1 cut its frame slice with
      the same wedge the kites came from, so each kite has its own pocket.
    picture: ../design/plates/split-04-media/opened.png
    alt: split-04's wedges opened up, pie slices of the coaster with flange pieces sitting in their pockets.
    from: split-04's photo
    snippet: |-
      wedge 36        # degrees of the ring to print
      wedge_from 9    # where the slice starts
      wedge_center 1  # keep the middle piece too
    lang: naqsh
    knobs: [wedge, wedge_from, wedge_center]
    plates: [split-04, stud-1, closeout-1]
    related: [gap, stud]

  - id: dots
    group: marks
    term: Dots
    also: [tally dots]
    what: >-
      Little round dents sunk into a face to tell versions apart: one dot, two dots, three dots. They
      fit where a carved id has no room.
    ours: >-
      Dots go on a hidden face, either the cut face between two halves or, with dots_bottom 1, the
      bed face, so they leave the cut face free for a slide. A star half has room for at most three.
    picture: ../design/plates/hexfit-1-media/bottom-8-dots.png
    alt: The bottom of a hexagon half with eight small round dents in it.
    from: hexfit-1's picture
    snippet: |-
      dots_star 2     # two dots on each star
      dots_bottom 1   # on the bed face, not the cut face
    lang: naqsh
    knobs: ["dots_*", "*_dots"]
    plates: [split-10, hexfit-1, star-1, closeout-1]
    related: [carved-id]
    cookbook: ../cookbook/coaster-knobs.md#dots-on-loose-pieces

  - id: carved-id
    group: marks
    term: Carved id
    also: [id, mark]
    what: >-
      Letters and numbers cut into a face of a piece, so you can tell which print and which version
      it is once it is off the bed. A question after a print names the piece by its id.
    ours: >-
      Ids go on the bottom so the top stays clean. They are 2.5 mm tall, too small to tell B from D
      or M from N, so we skip those letters. A piece too small for an id gets dots.
    picture: ../design/plates/split-01-media/ids.png
    alt: A middle piece with "SP1 6 M" cut into it.
    from: split-01's picture
    snippet: |-
      id 1   # the prototype's id, cut into the lower half's bottom
    lang: naqsh
    knobs: [id, pair]
    plates: [split-01, split-05, split-06, bedface-1]
    related: [dots]
    cookbook: ../cookbook/coaster-knobs.md#an-id-on-each-half-of-a-split-coaster

  - id: gap
    group: fit
    term: Gap (the fit)
    also: [clearance, fit, play]
    what: >-
      The space left between two parts that go together, on each face. Too small and they will not
      go in; too big and they rattle. Every join has its own gap: a piece in its pocket, a pin in its
      hole, a rail in its slot.
    ours: >-
      gap is a piece in its pocket, pin_gap a pin in its hole, stud_gap a stud in its socket,
      slide_gap a rail in its slot. room makes each piece a little shorter than the closed coaster,
      so the halves meet each other and not the piece. The sheets-04g-fit plates tried a ladder of
      piece gaps.
    picture: ../design/plates/pkt-2-media/side-kite.png
    alt: A cut through a kite in its pocket. The thin white lines round the kite are the gap.
    from: pkt-2's side cut
    snippet: |-
      gap 0.1        # piece in its pocket, mm a face
      pin_gap 0.25   # pin in its hole, across
      slide_gap 0.15 # rail in its slot, a side
      room 0.2       # each piece this much shorter than the closed coaster
    lang: naqsh
    knobs: [gap, room, clearance, star_gap]
    plates: [sheets-04g-fit, sheets-04g-fit2, sheets-04g-fit3, split-03, split-10]
    related: [pin, slide, stud, wedge]

  - id: first-layer
    group: fit
    term: First layer
    also: [initial layer]
    what: >-
      The very first layer the printer lays on the bed. Everything else stands on it, so if it does
      not stick or is laid too thin, the print fails or the bottom is rough.
    ours: >-
      Our first layer is the bottom face of every piece, so its lines are what you see when you turn
      a coaster over. The bedface plates tried settings for it, beside stock, to close the little
      slits between its lines.
    picture: ../design/plates/bedface-1-media/coaster-first-layer.png
    alt: The slicer's lines for a coaster's first layer, colored by kind, with a key and the carved ids.
    from: bedface-1's slice
    snippet: |-
      object_settings: { initial_layer_flow_ratio: "1.1" }
    lang: yaml
    knobs: ["setting:initial_layer_flow_ratio"]
    plates: [bedface-1, bedface-2, bedface-4, bedface-5]
    related: [bed-face]

  - id: bed-face
    group: fit
    term: Bed face
    also: [bottom face, bottom]
    what: >-
      The face of a piece that printed lying on the bed. It takes the bed's texture, and the first
      layer's lines show in it. It is the coaster's bottom, or with halves, both its top and bottom.
    ours: >-
      On our textured plate the bed face comes out matte and even, which is why halves print both
      faces on the bed. Little bare slits between the first layer's lines were the bedface plates'
      question; infill_wall_overlap 55% is what we print with now.
    picture: ../design/plates/star-3-media/bottoms.png
    alt: Star pieces turned over, showing their bed faces.
    from: star-3's photo
    snippet: |-
      object_settings: { infill_wall_overlap: "55%" }
    lang: yaml
    knobs: ["setting:bottom_surface_pattern", "setting:infill_wall_overlap"]
    plates: [bedface-1, bedface-4, bedface-5, star-3]
    related: [first-layer, halves, raft]

# Plate params that are not a print technique: sizes and shapes of the pattern itself, which the
# cookbook's recipes draw, or a label. `scan` does not ask for a term for these.
not_techniques:
  size: the coaster's size, mm
  height: the coaster's height
  round: the outline's rounding, a cookbook recipe
  strap: strap width, a cookbook recipe
  weld: soft weld where straps meet, a cookbook recipe
  twist: twisted straps, a cookbook recipe
  peak: peaked pieces, a cookbook recipe
  tip: rounded hole points, a cookbook recipe
  code: the filament's color code on a swatch
  depth: a swatch's depth
  floor: what is left under a socket on a coupon
  wall: a coupon's wall
