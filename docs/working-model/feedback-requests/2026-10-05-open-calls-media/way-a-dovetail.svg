<line data-mark="first" x1="0" y1="102.4" x2="384" y2="102.4" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="piece" points="0,51.2 384,51.2 384,0 0,0" fill="#dcaa33"/>
<line data-mark="first" x1="0" y1="0" x2="384" y2="0" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="slot" points="260.8,51.2 260.8,44.8 264,44.8 264,38.4 267.2,38.4 267.2,32 270.4,32 270.4,25.6 270.4,25.6 270.4,19.2 113.6,19.2 113.6,25.6 113.6,25.6 113.6,32 116.8,32 116.8,38.4 120,38.4 120,44.8 123.2,44.8 123.2,51.2" fill="#ffffff"/>
<polygon data-kind="rail" points="256,51.2 256,44.8 259.2,44.8 259.2,38.4 262.4,38.4 262.4,32 265.6,32 265.6,25.6 118.4,25.6 118.4,32 121.6,32 121.6,38.4 124.8,38.4 124.8,44.8 128,44.8 128,51.2" fill="#3f9189"/>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="297.6" y1="51.2" x2="297.6" y2="25.6"/>
<line x1="293.6" y1="51.2" x2="301.6" y2="51.2"/>
<line x1="293.6" y1="25.6" x2="301.6" y2="25.6"/>
</g>
<text x="304.6" y="42.4" font-size="11" fill="#444444" text-anchor="start">rail 0.8 mm</text>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="86.4" y1="51.2" x2="86.4" y2="19.2"/>
<line x1="82.4" y1="51.2" x2="90.4" y2="51.2"/>
<line x1="82.4" y1="19.2" x2="90.4" y2="19.2"/>
</g>
<text x="79.4" y="39.2" font-size="11" fill="#444444" text-anchor="end">slot 1.0 mm</text>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="86.4" y1="19.2" x2="86.4" y2="0"/>
<line x1="82.4" y1="19.2" x2="90.4" y2="19.2"/>
<line x1="82.4" y1="0" x2="90.4" y2="0"/>
</g>
<text x="79.4" y="13.6" font-size="11" fill="#444444" text-anchor="end">floor 0.6 mm</text>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="128" y1="62.4" x2="256" y2="62.4"/>
<line x1="128" y1="58.4" x2="128" y2="66.4"/>
<line x1="256" y1="58.4" x2="256" y2="66.4"/>
</g>
<text x="192" y="77.4" font-size="11" fill="#444444" text-anchor="middle">4 mm at its root</text>
<g data-kind="dim" stroke="#666666" stroke-width="1">
<line x1="368" y1="102.4" x2="368" y2="51.2"/>
<line x1="364" y1="102.4" x2="372" y2="102.4"/>
<line x1="364" y1="51.2" x2="372" y2="51.2"/>
</g>
<text x="361" y="80.8" font-size="11" fill="#444444" text-anchor="end">1.6 mm</text>
</g>
<text x="20" y="561.8" font-size="12" fill="#444444">Four 0.2 mm layers, each 0.1 mm a side wider than the one under it,</text>
<text x="20" y="578.8" font-size="12" fill="#444444">so the rail's top is 0.3 mm a side wider than its root. The slot is</text>
<text x="20" y="595.8" font-size="12" fill="#444444">one layer deeper than the rail and 0.15 mm a side wider, so the cut</text>
<text x="20" y="612.8" font-size="12" fill="#444444">faces close flat.</text>
<text x="20" y="629.8" font-size="12" fill="#444444">sld-1 printed this at 0.10, 0.15 and 0.20 mm a side, and you said</text>
<text x="20" y="646.8" font-size="12" fill="#444444">all three worked.</text>
</g>
