<line data-mark="first" x1="342" y1="158.4" x2="360" y2="158.4" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="lip" points="72,21.6 90,21.6 90,0 72,0" fill="#aba69f"/>
<line data-mark="first" x1="72" y1="0" x2="90" y2="0" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="lip" points="342,21.6 360,21.6 360,0 342,0" fill="#aba69f"/>
<line data-mark="first" x1="342" y1="0" x2="360" y2="0" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="piece" points="75.6,136.8 356.4,136.8 356.4,79.2 75.6,79.2" fill="#3f9189"/>
<line data-mark="first" x1="75.6" y1="136.8" x2="356.4" y2="136.8" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="piece" points="75.6,79.2 356.4,79.2 356.4,21.6 75.6,21.6" fill="#dcaa33"/>
<line data-mark="first" x1="75.6" y1="21.6" x2="356.4" y2="21.6" stroke="#2f6fd8" stroke-width="4"/>
<line data-kind="seam" x1="75.6" y1="79.2" x2="356.4" y2="79.2" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
</g>
<text x="20" y="312.4" font-size="12" fill="#444444">Each piece half prints face down; the upper one is turned over. The</text>
<text x="20" y="329.4" font-size="12" fill="#444444">lips hold both halves, so no glue, but the two halves go in one at</text>
<text x="20" y="346.4" font-size="12" fill="#444444">a time and nothing holds them to each other.</text>
</g>
<g data-panel="2. Way a with a dovetail across the cut">
