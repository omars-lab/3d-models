<polygon data-kind="rail" points="468,19.2 468,14.4 470.4,14.4 470.4,9.6 472.8,9.6 472.8,4.8 475.2,4.8 475.2,0 364.8,0 364.8,4.8 367.2,4.8 367.2,9.6 369.6,9.6 369.6,14.4 372,14.4 372,19.2" fill="#3f9189"/>
