<text x="538" y="67.6" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="768.44" cy="469.8" r="2.6" fill="#222222"/>
<polyline points="768.44,469.8 712.44,469.8 702.44,469.8" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="698.44" y="473.8" font-size="12" fill="#222222" text-anchor="end">upper piece half, turned over</text>
<circle data-label-dot="1" cx="1224.44" cy="469.8" r="2.6" fill="#222222"/>
<polyline points="1224.44,469.8 1341.68,469.8 1351.68,469.8" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1355.68" y="473.8" font-size="12" fill="#222222" text-anchor="start">lower piece half</text>
<text x="508" y="528.6" font-size="12" fill="#444444">Both print face down, so both outer faces are first layers. The slot prints open at the top, each layer 0.1 mm a side narrower than the one under it;</text>
<text x="508" y="545.6" font-size="12" fill="#444444">the rail prints standing up, each layer 0.1 mm a side wider. Both are short overhangs, one layer at a time.</text>
</g>
</svg>
