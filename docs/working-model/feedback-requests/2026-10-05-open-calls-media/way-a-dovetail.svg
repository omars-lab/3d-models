<polygon data-kind="slot" points="254.7,79.2 254.7,72 256.5,72 256.5,64.8 258.3,64.8 258.3,57.6 260.1,57.6 260.1,50.4 260.1,50.4 260.1,43.2 171.9,43.2 171.9,50.4 171.9,50.4 171.9,57.6 173.7,57.6 173.7,64.8 175.5,64.8 175.5,72 177.3,72 177.3,79.2" fill="#ffffff"/>
<polygon data-kind="rail" points="252,79.2 252,72 253.8,72 253.8,64.8 255.6,64.8 255.6,57.6 257.4,57.6 257.4,50.4 174.6,50.4 174.6,57.6 176.4,57.6 176.4,64.8 178.2,64.8 178.2,72 180,72 180,79.2" fill="#3f9189"/>
</g>
<circle data-label-dot="1" cx="904" cy="165.6" r="2.6" fill="#222222"/>
<polyline points="904,165.6 954,165.6 964,165.6" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="968" y="169.6" font-size="12" fill="#222222" text-anchor="start">upper half</text>
<circle data-label-dot="1" cx="796" cy="165.6" r="2.6" fill="#222222"/>
<polyline points="796,165.6 954,181.6 964,181.6" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="968" y="185.6" font-size="12" fill="#222222" text-anchor="start">piece half with the slot</text>
<circle data-label-dot="1" cx="752.8" cy="190.8" r="2.6" fill="#222222"/>
<polyline points="752.8,190.8 954,197.6 964,197.6" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="968" y="201.6" font-size="12" fill="#222222" text-anchor="start">rail in its slot</text>
<circle data-label-dot="1" cx="796" cy="241.2" r="2.6" fill="#222222"/>
<polyline points="796,241.2 954,241.2 964,241.2" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="968" y="245.2" font-size="12" fill="#222222" text-anchor="start">piece half with the rail</text>
<circle data-label-dot="1" cx="904" cy="244.8" r="2.6" fill="#222222"/>
<polyline points="904,244.8 954,257.2 964,257.2" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="968" y="261.2" font-size="12" fill="#222222" text-anchor="start">lower half</text>
<circle data-label-dot="1" cx="859" cy="273.6" r="2.6" fill="#222222"/>
<polyline points="859,273.6 954,273.6 964,273.6" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="968" y="277.6" font-size="12" fill="#222222" text-anchor="start">lip</text>
<text x="508" y="312.4" font-size="12" fill="#444444">The rail slides into the slot from one end, along the rail, into the page. The pair can then only slide back out, not lift apart, so the two halves go</text>
<text x="508" y="329.4" font-size="12" fill="#444444">in as one piece and the lips hold it as they hold a whole piece today. Each face is still a first layer.</text>
</g>
<g data-panel="3. The pair out of the coaster, to scale">
<text x="20" y="411.4" font-size="14" font-weight="bold" fill="#222222">3. The pair out of the coaster, to scale</text>
<g transform="translate(20,431.4)">
