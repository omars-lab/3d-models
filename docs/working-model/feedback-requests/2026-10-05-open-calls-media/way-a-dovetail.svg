<svg xmlns="http://www.w3.org/2000/svg" width="1483.44" height="683.8" viewBox="0 0 1483.44 683.8" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Way a with a dovetail: the piece halves slide together before they go in</title>
<rect width="100%" height="100%" fill="#f8f7f4"/>
<text x="20" y="37" font-size="17" font-weight="bold" fill="#222222">Way a with a dovetail: the piece halves slide together before they go in</text>
<text x="20" y="53.5" font-size="12.5" fill="#555555">Cut through, side view. Dark gray: lower half of the coaster. Light gray: upper half. Gold and teal: the piece. White: air. Solid blue: printed on the bed (first layer). Orange dashed: printed last (top surface). Not</text>
<text x="20" y="70" font-size="12.5" fill="#555555">to scale.</text>
<g data-panel="1. Way a today: lip + a piece cut in two">
<text x="20" y="106" font-size="14" font-weight="bold" fill="#222222">1. Way a today: lip + a piece cut in two</text>
<g transform="translate(20,126)">
<polygon data-kind="half" points="0,158.4 72,158.4 72,79.2 0,79.2" fill="#8e8a83"/>
<line data-mark="first" x1="0" y1="158.4" x2="72" y2="158.4" stroke="#2f6fd8" stroke-width="4"/>
<polygon data-kind="half" points="360,158.4 432,158.4 432,79.2 360,79.2" fill="#8e8a83"/>
