<text data-label="1" x="816" y="549.1" font-size="12" fill="#222222" text-anchor="start">6705</text>
<text x="20" y="643.1" font-size="12" fill="#444444">Good: a bigger button at the same thickness. But: its size was read by one pass and not checked, the pattern loses more of its middle, and the</text>
