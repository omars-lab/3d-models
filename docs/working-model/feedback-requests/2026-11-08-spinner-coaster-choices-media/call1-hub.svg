<polygon data-kind="air" points="626.4,266.4 657,266.4 657,244.8 626.4,244.8" fill="#ffffff"/>
<polygon data-kind="piece" points="207,244.8 270,244.8 270,100.8 207,100.8" fill="#5a6270"/>
<polygon data-kind="piece" points="630,244.8 693,244.8 693,100.8 630,100.8" fill="#5a6270"/>
<polygon data-kind="piece" points="273.6,266.4 626.4,266.4 626.4,93.6 273.6,93.6" fill="#c99a2e"/>
