<text x="462" y="47.2" font-size="12" fill="#444444">the bearing must miss the hub on the way down</text>
<rect data-kind="bed" x="-6" y="270.4" width="912" height="5" fill="#cfcbc3"/>
<text x="910" y="276.4" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="610.8" cy="287.5" r="2.6" fill="#222222"/>
<polyline points="610.8,287.5 230.8,287.5 220.8,287.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="216.8" y="291.5" font-size="12" fill="#222222" text-anchor="end">hub: a 21 mm island on its own</text>
<circle data-label-dot="1" cx="916.8" cy="237.1" r="2.6" fill="#222222"/>
<polyline points="916.8,237.1 1232.04,237.1 1242.04,237.1" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1246.04" y="241.1" font-size="12" fill="#222222" text-anchor="start">6704 bearing, dropped over the hub</text>
<circle data-label-dot="1" cx="1060.8" cy="283.9" r="2.6" fill="#222222"/>
<polyline points="1060.8,283.9 1232.04,283.9 1242.04,283.9" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1246.04" y="287.9" font-size="12" fill="#222222" text-anchor="start">coaster, its mug face on the bed</text>
<circle data-label-dot="1" cx="925.8" cy="363.1" r="2.6" fill="#222222"/>
<polyline points="925.8,363.1 1232.04,363.1 1242.04,363.1" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1246.04" y="367.1" font-size="12" fill="#222222" text-anchor="start">lower cap under the outer ring</text>
<text x="20" y="413.5" font-size="12" fill="#444444">After the pause an upper cap closes over both rings. The hub turns with the inner ring, and the mug face is flat across hub and coaster.</text>
<text x="20" y="430.5" font-size="12" fill="#444444">Good: one print, nothing to press. But: the straps coaster cannot lie face down (its straps would be on the bed), so this needs a flat-faced coaster we do not make, and a knocked hub spoils the whole print.</text>
