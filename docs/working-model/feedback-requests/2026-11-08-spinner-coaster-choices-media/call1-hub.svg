<svg xmlns="http://www.w3.org/2000/svg" width="1488.28" height="467.5" viewBox="0 0 1488.28 467.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Call 1, option 2: a hub printed in the same job, in a flat coaster printed face down (a sketch, sizes not settled)</title>
<rect width="100%" height="100%" fill="#f8f7f4"/>
<text x="20" y="37" font-size="17" font-weight="bold" fill="#222222">Call 1, option 2: a hub printed in the same job, in a flat coaster printed face down (a sketch, sizes not settled)</text>
<text x="20" y="53.5" font-size="12.5" fill="#555555">Cut through, side view. White: air. Solid blue: printed on the bed (first layer). Not to scale.</text>
<g data-panel="At the pause: the hub stands alone in the middle while the bearing goes in round it">
<text x="20" y="89.5" font-size="14" font-weight="bold" fill="#222222">At the pause: the hub stands alone in the middle while the bearing goes in round it</text>
<g transform="translate(250.8,107.5)">
<polygon data-kind="piece" points="0,266.4 207,266.4 207,79.2 0,79.2" fill="#aba69f"/>
