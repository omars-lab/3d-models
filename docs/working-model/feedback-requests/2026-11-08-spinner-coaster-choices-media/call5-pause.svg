<text x="910" y="312.4" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="818" cy="211.9" r="2.6" fill="#222222"/>
<polyline points="818,211.9 1007.24,211.9 1017.24,211.9" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1021.24" y="215.9" font-size="12" fill="#222222" text-anchor="start">cap, printed after you press resume: the bearing cannot fall out</text>
<circle data-label-dot="1" cx="854" cy="301.9" r="2.6" fill="#222222"/>
<polyline points="854,301.9 1007.24,301.9 1017.24,301.9" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1021.24" y="305.9" font-size="12" fill="#222222" text-anchor="start">one body, no seam</text>
