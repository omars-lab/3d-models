<polygon data-kind="piece" points="678.6,115.2 900,115.2 900,93.6 678.6,93.6" fill="#aba69f"/>
<line data-mark="last" x1="678.6" y1="93.6" x2="900" y2="93.6" stroke="#e27a2a" stroke-width="4" stroke-dasharray="6 4"/>
