<svg xmlns="http://www.w3.org/2000/svg" width="1454.28" height="486.5" viewBox="0 0 1454.28 486.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Call 5, option 1: pause and cap, one solid coaster</title>
<rect width="100%" height="100%" fill="#f8f7f4"/>
<text x="20" y="37" font-size="17" font-weight="bold" fill="#222222">Call 5, option 1: pause and cap, one solid coaster</text>
<text x="20" y="53.5" font-size="12.5" fill="#555555">Cut through, side view. White: air. Solid blue: printed on the bed (first layer). Orange dashed: printed last (top surface). Not to scale.</text>
<g data-panel="The printer waits at 5.2 mm; you drop the bearing in; it prints the cap over it">
<text x="20" y="89.5" font-size="14" font-weight="bold" fill="#222222">The printer waits at 5.2 mm; you drop the bearing in; it prints the cap over it</text>
<g transform="translate(26,107.5)">
