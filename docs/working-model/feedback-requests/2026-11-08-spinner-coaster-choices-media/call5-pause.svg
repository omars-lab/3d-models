<polyline points="692,301.9 1007.24,317.9 1017.24,317.9" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1021.24" y="321.9" font-size="12" fill="#222222" text-anchor="start">bearing, dropped in by hand at the pause</text>
<text x="20" y="449.5" font-size="12" fill="#444444">Good: what you asked for, one solid coaster. But: you are at the printer for every one, and our slicing must learn to carry the pause first (call 4).</text>
