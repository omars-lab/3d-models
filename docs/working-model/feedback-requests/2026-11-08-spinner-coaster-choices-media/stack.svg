<polygon data-kind="piece" points="657,230.4 900,230.4 900,216 657,216" fill="#aba69f"/>
<polygon data-kind="air" points="243,230.4 657,230.4 657,216 243,216" fill="#ffffff"/>
<polygon data-kind="piece" points="0,216 204.3,216 204.3,64.8 0,64.8" fill="#aba69f"/>
<polygon data-kind="piece" points="695.7,216 900,216 900,64.8 695.7,64.8" fill="#aba69f"/>
<polygon data-kind="piece" points="0,64.8 221.4,64.8 221.4,43.2 0,43.2" fill="#aba69f"/>
<polygon data-kind="piece" points="678.6,64.8 900,64.8 900,43.2 678.6,43.2" fill="#aba69f"/>
<polygon data-kind="piece" points="72,43.2 126,43.2 126,0 72,0" fill="#aba69f"/>
<line data-mark="last" x1="72" y1="0" x2="126" y2="0" stroke="#e27a2a" stroke-width="4" stroke-dasharray="6 4"/>
<polygon data-kind="piece" points="774,43.2 828,43.2 828,0 774,0" fill="#aba69f"/>
<line data-mark="last" x1="774" y1="0" x2="828" y2="0" stroke="#e27a2a" stroke-width="4" stroke-dasharray="6 4"/>
<polygon data-kind="piece" points="207,216 270,216 270,72 207,72" fill="#5a6270"/>
<polygon data-kind="piece" points="630,216 693,216 693,72 630,72" fill="#5a6270"/>
<polygon data-kind="piece" points="228.6,64.8 671.4,64.8 671.4,7.2 228.6,7.2" fill="#dcaa33"/>
<polygon data-kind="piece" points="259.2,72 640.8,72 640.8,64.8 259.2,64.8" fill="#dcaa33"/>
<polygon data-kind="piece" points="270,180 630,180 630,72 270,72" fill="#dcaa33"/>
<rect data-kind="bed" x="-6" y="256" width="912" height="5" fill="#cfcbc3"/>
<text x="910" y="262" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="585.36" cy="595.7" r="2.6" fill="#222222"/>
<polyline points="585.36,595.7 205.36,595.7 195.36,595.7" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="191.36" y="599.7" font-size="12" fill="#222222" text-anchor="end">stub pressed into the hole</text>
<circle data-label-dot="1" cx="1026.36" cy="484.1" r="2.6" fill="#222222"/>
<polyline points="1026.36,484.1 1206.6,484.1 1216.6,484.1" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1220.6" y="488.1" font-size="12" fill="#222222" text-anchor="start">strap, where the mug sits: top at 7.0 mm</text>
<circle data-label-dot="1" cx="765.36" cy="498.5" r="2.6" fill="#222222"/>
<polyline points="765.36,498.5 1206.6,500.1 1216.6,500.1" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1220.6" y="504.1" font-size="12" fill="#222222" text-anchor="start">button, about 25 mm: it spins</text>
<circle data-label-dot="1" cx="1017.36" cy="523.7" r="2.6" fill="#222222"/>
<polyline points="1017.36,523.7 1206.6,523.7 1216.6,523.7" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1220.6" y="527.7" font-size="12" fill="#222222" text-anchor="start">cap: 3 layers over the outer ring</text>
<circle data-label-dot="1" cx="891.36" cy="613.7" r="2.6" fill="#222222"/>
<polyline points="891.36,613.7 1206.6,613.7 1216.6,613.7" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1220.6" y="617.7" font-size="12" fill="#222222" text-anchor="start">bearing</text>
<text x="20" y="761.3" font-size="12" fill="#444444">Gray is the coaster, blue-gray the steel bearing, gold the button. The button is printed on its own and pressed into the bearing's hole after the print comes off the bed.</text>
<text x="20" y="778.3" font-size="12" fill="#444444">The button's top is 0.2 mm below the strap tops, so a mug does not stop it. A finger flick does.</text>
</g>
</svg>
