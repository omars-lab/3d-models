<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" font-family="Helvetica, Arial, sans-serif">
  <!-- Call 4, option 1 (recommended): our slicing passes the pause to Bambu Studio's command line.
       From docs/design/pieces/spinner-coaster-design.md, open question 4. Hand-drawn flow. -->
  <rect width="1400" height="420" fill="#f7f6f2"/>
  <text x="30" y="44" font-size="26" font-weight="bold" fill="#222">Call 4, option 1: our slicing carries the pause</text>
  <text x="30" y="74" font-size="17" fill="#555">Every step stays on the path every plate takes today. Gold: the one new piece, a small tool change nobody has run yet.</text>
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#444"/></marker></defs>
  <g font-size="18" fill="#222">
    <rect x="30" y="130" width="220" height="110" rx="10" fill="#e4e1db" stroke="#888"/>
    <text x="140" y="178" text-anchor="middle">the coaster's</text><text x="140" y="202" text-anchor="middle">model file</text>
    <rect x="300" y="130" width="250" height="110" rx="10" fill="#dcaa33" stroke="#8a6a12" stroke-width="2"/>
    <text x="425" y="168" text-anchor="middle" font-weight="bold">our slicing</text><text x="425" y="192" text-anchor="middle">adds "pause before</text><text x="425" y="216" text-anchor="middle">layer 27"</text>
    <rect x="600" y="130" width="230" height="110" rx="10" fill="#e4e1db" stroke="#888"/>
    <text x="715" y="178" text-anchor="middle">check: one pause,</text><text x="715" y="202" text-anchor="middle">at 5.2 mm</text>
    <rect x="880" y="130" width="230" height="110" rx="10" fill="#e4e1db" stroke="#888"/>
    <text x="995" y="166" text-anchor="middle">approval on the</text><text x="995" y="190" text-anchor="middle">page, warnings</text><text x="995" y="214" text-anchor="middle">check, print log</text>
    <rect x="1160" y="130" width="210" height="110" rx="10" fill="#e4e1db" stroke="#888"/>
    <text x="1265" y="178" text-anchor="middle">send to</text><text x="1265" y="202" text-anchor="middle">the printer</text>
  </g>
  <g stroke="#444" stroke-width="2.5" marker-end="url(#a)">
    <line x1="250" y1="185" x2="296" y2="185"/><line x1="550" y1="185" x2="596" y2="185"/>
    <line x1="830" y1="185" x2="876" y2="185"/><line x1="1110" y1="185" x2="1156" y2="185"/>
  </g>
  <text x="30" y="310" font-size="18" fill="#222">Good: our send's checks stay whole, and the pause check runs on every slice.</text>
  <text x="30" y="340" font-size="18" fill="#222">But: Bambu Studio's command line has the option (load_custom_gcodes), and nobody has tried it yet.</text>
  <text x="30" y="370" font-size="18" fill="#222">Leads to: a code change and its test, before the first test piece.</text>
</svg>
