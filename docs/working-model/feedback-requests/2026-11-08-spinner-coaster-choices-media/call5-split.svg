<text data-label="1" x="1021.24" y="266.8" font-size="12" fill="#222222" text-anchor="start">bearing, placed by hand: no printer involved</text>
<text x="20" y="374.4" font-size="12" fill="#444444">Good: no pause and no risk to the printer; the split coasters already have pockets and pegs. But: a seam shows round the edge, and the join has to hold under mugs.</text>
