<svg xmlns="http://www.w3.org/2000/svg" width="1346.16" height="411.4" viewBox="0 0 1346.16 411.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Call 5, option 2: split halves now, no pause</title>
