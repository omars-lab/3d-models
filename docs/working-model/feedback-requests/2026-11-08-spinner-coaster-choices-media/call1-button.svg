<polyline points="445,63 450,72 455,63" fill="none" stroke="#444444" stroke-width="1.6"/>
<text x="462" y="40" font-size="12" fill="#444444">pressed in by hand after the print</text>
<rect data-kind="bed" x="-6" y="328" width="912" height="5" fill="#cfcbc3"/>
<text x="910" y="334" font-size="12" fill="#444444">print bed</text>
