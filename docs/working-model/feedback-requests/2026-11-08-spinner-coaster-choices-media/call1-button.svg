<polygon data-kind="piece" points="259.2,115.2 640.8,115.2 640.8,108 259.2,108" fill="#dcaa33"/>
<polygon data-kind="piece" points="270,108 630,108 630,0 270,0" fill="#dcaa33"/>
<line data-mark="last" x1="270" y1="0" x2="630" y2="0" stroke="#e27a2a" stroke-width="4" stroke-dasharray="6 4"/>
<rect data-kind="bed" x="-6" y="176.8" width="912" height="5" fill="#cfcbc3"/>
<text x="910" y="182.8" font-size="12" fill="#444444">print bed</text>
</g>
<circle data-label-dot="1" cx="566" cy="163.5" r="2.6" fill="#222222"/>
<polyline points="566,163.5 1007.24,163.5 1017.24,163.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1021.24" y="167.5" font-size="12" fill="#222222" text-anchor="start">stub, 3 mm long: pressed into the 20 mm hole</text>
<circle data-label-dot="1" cx="638" cy="221.1" r="2.6" fill="#222222"/>
<polyline points="638,221.1 1007.24,221.1 1017.24,221.1" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1021.24" y="225.1" font-size="12" fill="#222222" text-anchor="start">collar: the only part that touches the bearing</text>
<circle data-label-dot="1" cx="620" cy="253.5" r="2.6" fill="#222222"/>
<polyline points="620,253.5 1007.24,253.5 1017.24,253.5" fill="none" stroke="#666666" stroke-width="0.9"/>
<text data-label="1" x="1021.24" y="257.5" font-size="12" fill="#222222" text-anchor="start">the button's top: 24.6 mm across, 1.6 mm thick</text>
<text x="20" y="321.9" font-size="12" fill="#444444">A small print of a few minutes, apart from the coaster. If the press fit is wrong, only this is reprinted.</text>
</g>
<g data-panel="Pressed into the coaster that spins (the straps coaster, printed face up)">
<text x="20" y="386.9" font-size="14" font-weight="bold" fill="#222222">Pressed into the coaster that spins (the straps coaster, printed face up)</text>
<g transform="translate(104.52,404.9)">
