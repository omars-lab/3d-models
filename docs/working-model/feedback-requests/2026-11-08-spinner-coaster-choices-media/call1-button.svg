<text data-label="1" x="1099.76" y="624.9" font-size="12" fill="#222222" text-anchor="start">coaster</text>
<text x="20" y="768.5" font-size="12" fill="#444444">Good: the coaster we make today, and the steel turns against nothing printed. But: a second part to print and press in.</text>
