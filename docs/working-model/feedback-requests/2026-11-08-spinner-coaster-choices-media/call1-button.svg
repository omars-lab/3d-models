<svg xmlns="http://www.w3.org/2000/svg" width="1339.8" height="805.5" viewBox="0 0 1339.8 805.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title>Call 1, option 1: a button, printed on its own and pressed in after</title>
<rect width="100%" height="100%" fill="#f8f7f4"/>
<text x="20" y="37" font-size="17" font-weight="bold" fill="#222222">Call 1, option 1: a button, printed on its own and pressed in after</text>
<text x="20" y="53.5" font-size="12.5" fill="#555555">Cut through, side view. White: air. Solid blue: printed on the bed (first layer). Orange dashed: printed last (top surface). Not to scale.</text>
<g data-panel="The button on the bed: its top face down, the stub up">
<text x="20" y="89.5" font-size="14" font-weight="bold" fill="#222222">The button on the bed: its top face down, the stub up</text>
<g transform="translate(26,109.5)">
<polygon data-kind="piece" points="228.6,172.8 671.4,172.8 671.4,115.2 228.6,115.2" fill="#dcaa33"/>
